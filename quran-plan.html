<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap');

  :root {
    --espresso: #2b1c13;
    --coffee: #4a3020;
    --cinnamon: #7a5236;
    --caramel: #a8794f;
    --latte: #cba573;
    --sand: #e7d7bd;
    --linen: #f6efe3;
    --paper: #fffdfa;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  .app-shell {
    min-height: 100vh;
    width: 100%;
    /* Faint decorative Islamic geometric watermark layered above the warm gradient.
       The SVG's own stroke-opacity keeps it extremely subtle so it never competes with the text. */
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 150 150'><g fill='none' stroke='%234a3020' stroke-opacity='0.06' stroke-width='1.2'><path d='M75 10 L90 56 L136 71 L90 86 L75 132 L60 86 L14 71 L60 56 Z'/><circle cx='75' cy='71' r='22'/><circle cx='75' cy='71' r='34'/></g></svg>"),
      linear-gradient(180deg, #ffffff 0%, #fdfbf8 35%, #f7efe2 100%);
    background-repeat: repeat, no-repeat;
    background-size: 150px 150px, 100% 100%;
    /* "fixed" على الجوال يجبر المتصفح على إعادة رسم الخلفية مع كل إطار تمرير (سبب شائع ومعروف
       لتعليق/تهنيج التمرير على المتصفحات المحمولة)، لذا نجعلها "scroll" افتراضياً (يشمل الجوال)
       ونُفعّل التأثير الخفيف (fixed) فقط على الشاشات الأكبر (حاسوب) عبر media query أدناه. */
    background-attachment: scroll, scroll;
    font-family: 'Tajawal', sans-serif;
    color: var(--espresso);
    padding: clamp(0.9rem, 3vw, 2.2rem) clamp(0.7rem, 4vw, 1.6rem) clamp(2rem, 5vw, 3.2rem);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .container { width: 100%; max-width: 800px; margin: 0 auto; }
  /* التأثير الخفيف لخلفية ثابتة أثناء التمرير مناسب فقط على الحاسوب حيث لا يوجد تمرير باللمس؛
     على الجوال أعلاه يبقى scroll دائماً لتفادي أي تهنيج في التمرير. */
  @media (min-width: 900px) {
    .app-shell { background-attachment: fixed, scroll; }
  }

  /* Two-column layout on wide screens, one column on narrow — no breakpoint needed:
     each column has a minimum of 300px, so it wraps to a single column automatically
     once the available width can no longer fit two of them side by side. */
  .panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
    gap: clamp(1rem, 3vw, 1.7rem);
    align-items: start;
  }
  .panel-col { min-width: 0; } /* prevents grid children from overflowing their track */
  .panel-col-results { margin-top: 0; }
  @media (min-width: 640px) {
    .panel-col-form { position: sticky; top: 1rem; }
  }

  /* ---- Header: dark espresso banner fading into the page ---- */
  .header-banner {
    position: relative;
    overflow: hidden;
    text-align: center;
    border-radius: clamp(18px, 3vw, 26px);
    padding: clamp(1.4rem, 4vw, 2.6rem) clamp(1rem, 4vw, 2rem) clamp(1.2rem, 3vw, 2.1rem);
    margin-bottom: clamp(1rem, 3vw, 1.6rem);
    background: linear-gradient(150deg, var(--espresso) 0%, var(--coffee) 55%, var(--cinnamon) 100%);
    box-shadow: 0 16px 34px rgba(43, 28, 19, 0.28);
  }
  .header-banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 85% -10%, rgba(203,165,115,0.35), transparent 55%),
                       radial-gradient(circle at 8% 115%, rgba(203,165,115,0.22), transparent 55%);
    pointer-events: none;
  }
  .header .ornament { font-family: 'Amiri', serif; color: var(--latte); font-size: clamp(1.2rem, 3vw, 1.6rem); letter-spacing: 0.25rem; position: relative; }
  .header-banner h1 {
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: clamp(1.55rem, 5vw, 2.4rem);
    margin: 0.3rem 0 0.3rem;
    color: var(--paper);
    position: relative;
  }
  .header-banner p { margin: 0; font-size: clamp(0.8rem, 2.2vw, 0.98rem); color: var(--sand); position: relative; }
  .student-name-field {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
    margin: 0.9rem auto 0;
    max-width: 420px;
  }
  .student-name-field label {
    font-size: clamp(0.78rem, 2vw, 0.88rem);
    font-weight: 700;
    color: var(--sand);
    white-space: nowrap;
  }
  .student-name-field input {
    flex: 1;
    min-width: 160px;
    min-height: 42px;
    border-radius: 12px;
    border: 1.5px solid var(--caramel);
    background: var(--paper);
    color: var(--espresso);
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: clamp(0.85rem, 2vw, 0.95rem);
    padding: 0.4rem 0.8rem;
    text-align: center;
  }
  .student-name-field input:focus {
    outline: none;
    border-color: var(--latte);
    box-shadow: 0 0 0 3px rgba(203,165,115,0.35);
  }
  .cal-plan-student { font-size: 0.85rem; font-weight: 700; color: var(--espresso); margin: 4px 0 0; }
  .cal-month-badge-hijri {
    display: block;
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: 0.62rem;
    color: var(--sand);
    margin-top: 2px;
    text-align: center;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    background: var(--linen);
    border: 1px solid var(--sand);
    border-radius: 18px;
    padding: 4px;
    margin-bottom: clamp(1rem, 3vw, 1.4rem);
    box-shadow: inset 0 1px 3px rgba(74,48,32,0.08);
  }
  .tab-btn {
    flex: 1;
    min-width: 96px;
    border: none;
    background: transparent;
    padding: clamp(0.55rem, 2vw, 0.7rem) 0.5rem;
    min-height: 44px;
    border-radius: 14px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: clamp(0.72rem, 2vw, 0.9rem);
    line-height: 1.3;
    color: var(--cinnamon);
    cursor: pointer;
    transition: all .25s ease;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--coffee), var(--espresso));
    color: var(--paper);
    box-shadow: 0 5px 14px rgba(43,28,19,0.3);
  }

  .mode-switch { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
  .mode-btn {
    flex: 1;
    min-width: 140px;
    min-height: 44px;
    padding: clamp(0.5rem, 1.8vw, 0.6rem) 0.4rem;
    border-radius: 12px;
    border: 1.5px solid var(--sand);
    background: var(--paper);
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: clamp(0.78rem, 2vw, 0.88rem);
    color: var(--cinnamon);
    cursor: pointer;
    transition: all .2s ease;
  }
  .mode-btn.active {
    border-color: var(--caramel);
    background: linear-gradient(160deg, #f3e4cd, var(--linen));
    color: var(--espresso);
    font-weight: 700;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--sand);
    border-radius: clamp(14px, 2vw, 18px);
    padding: clamp(0.85rem, 3vw, 1.1rem);
    margin-bottom: 1rem;
    box-shadow: 0 4px 16px rgba(74,48,32,0.06);
    break-inside: avoid;
  }
  .field-label { display: block; font-weight: 700; font-size: clamp(0.82rem, 2vw, 0.9rem); margin-bottom: 0.55rem; color: var(--coffee); }
  .combo-section-title {
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: clamp(1rem, 2.6vw, 1.15rem);
    color: var(--coffee);
    margin: 1.1rem 0 0.6rem;
    padding-bottom: 0.35rem;
    border-bottom: 2px solid var(--sand);
  }
  .combo-section-title:first-child { margin-top: 0; }
  .field-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr));
    gap: 0.6rem;
  }
  .field-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--linen);
    border: 1px solid var(--sand);
    border-radius: 10px;
    padding: 0.5rem 0.7rem;
    min-height: 44px;
    min-width: 0;
    font-size: clamp(0.8rem, 2vw, 0.88rem);
    color: var(--cinnamon);
  }
  .field-group.wide { grid-column: 1 / -1; }
  .field-group input, .field-group select {
    width: 100%;
    min-width: 0;
    border: none;
    background: transparent;
    font-family: 'Tajawal', sans-serif;
    font-size: clamp(0.92rem, 2.4vw, 1.05rem);
    font-weight: 700;
    color: var(--espresso);
    outline: none;
  }
  .hint { font-size: clamp(0.74rem, 1.8vw, 0.8rem); color: var(--cinnamon); margin: 0.5rem 0 0; }

  /* ---- Searchable "surah" combo box (من/إلى سورة fields) ---- */
  .surah-combo { position: relative; width: 100%; }
  .surah-combo-input {
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'Tajawal', sans-serif;
    font-size: clamp(0.92rem, 2.4vw, 1.05rem);
    font-weight: 700;
    color: var(--espresso);
    outline: none;
  }
  .surah-combo-list {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    left: 0;
    max-height: 220px;
    overflow-y: auto;
    z-index: 20;
    background: var(--paper);
    border: 1px solid var(--sand);
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(43,28,19,0.18);
  }
  .surah-combo-option {
    padding: 0.5rem 0.7rem;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--espresso);
    border-bottom: 1px solid var(--linen);
  }
  .surah-combo-option:last-child { border-bottom: none; }
  .surah-combo-option.highlighted, .surah-combo-option:hover { background: var(--linen); }
  .surah-combo-empty { padding: 0.5rem 0.7rem; font-size: 0.85rem; color: var(--cinnamon); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(96px, 100%), 1fr));
    gap: 0.55rem;
    margin-bottom: 1rem;
  }
  .stat-card {
    background: linear-gradient(160deg, var(--paper), var(--linen));
    border: 1px solid var(--sand);
    border-radius: 16px;
    padding: clamp(0.7rem, 2.5vw, 0.9rem) 0.4rem;
    text-align: center;
    break-inside: avoid;
  }
  .stat-value { font-family: 'Amiri', serif; font-weight: 700; font-size: clamp(1.15rem, 3.6vw, 1.55rem); color: var(--coffee); }
  .stat-label { font-size: clamp(0.66rem, 1.7vw, 0.72rem); color: var(--cinnamon); margin-top: 0.15rem; }

  .inspire-card {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: linear-gradient(120deg, var(--espresso), var(--coffee));
    color: var(--linen);
    border-radius: 18px;
    padding: clamp(0.85rem, 2.5vw, 1rem) clamp(0.9rem, 3vw, 1.15rem);
    margin-bottom: 1.2rem;
    box-shadow: 0 8px 20px rgba(43,28,19,0.22);
    break-inside: avoid;
  }
  .inspire-card p { margin: 0; font-size: clamp(0.82rem, 2.1vw, 0.9rem); line-height: 1.6; }
  .inspire-icon { color: var(--latte); font-size: 1.1rem; flex-shrink: 0; }

  .beads-wrap { text-align: center; margin-bottom: 0.5rem; }
  .beads-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: clamp(4px, 1vw, 6px);
    direction: ltr;
    margin-bottom: 0.5rem;
  }
  .bead {
    width: clamp(10px, 2.6vw, 14px);
    height: clamp(10px, 2.6vw, 14px);
    border-radius: 50%;
    background: var(--sand);
    border: 1px solid var(--latte);
    display: inline-block;
    flex-shrink: 0;
  }
  .bead-filled { background: radial-gradient(circle at 30% 30%, var(--latte), var(--coffee)); border-color: var(--coffee); }
  .beads-label { font-size: clamp(0.72rem, 1.8vw, 0.78rem); color: var(--cinnamon); }

  .week-table { margin-top: 0.3rem; }
  .week-title { font-family: 'Amiri', serif; font-size: clamp(1rem, 2.6vw, 1.1rem); margin: 0 0 0.7rem; color: var(--coffee); }
  .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(64px, 100%), 1fr)); gap: 0.5rem; }
  .day-card {
    background: var(--linen);
    border: 1px solid var(--sand);
    border-radius: 12px;
    padding: 0.6rem 0.25rem;
    text-align: center;
    min-width: 0;
  }
  .day-card.day-rest { background: #efe6d6; opacity: 0.75; }
  .day-name { display: block; font-size: clamp(0.66rem, 1.7vw, 0.72rem); color: var(--cinnamon); margin-bottom: 0.25rem; }
  .day-pages { display: block; font-weight: 700; color: var(--coffee); font-size: clamp(0.78rem, 2vw, 0.85rem); }

  /* ---- Structured upcoming-schedule table (real dates + daily ranges) ---- */
  .sched-table-card { margin-top: 0.9rem; }
  .sched-table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--sand); }
  .sched-table { width: 100%; border-collapse: collapse; font-size: clamp(0.76rem, 1.9vw, 0.86rem); white-space: nowrap; }
  .sched-table th {
    background: linear-gradient(135deg, var(--coffee), var(--espresso));
    color: var(--paper);
    font-weight: 700;
    padding: 0.55rem 0.6rem;
    text-align: center;
    position: sticky;
    top: 0;
  }
  .sched-table td { padding: 0.5rem 0.6rem; text-align: center; color: var(--espresso); border-top: 1px solid var(--sand); }
  .sched-surah-line { font-weight: 700; color: var(--espresso); }
  .sched-multi-sep { font-size: 0.68em; color: var(--sand); margin: 3px 0; }
  .sched-table tbody tr:nth-child(even) { background: var(--linen); }
  .sched-table tr.sched-row-rest td { color: var(--cinnamon); background: #efe6d6; opacity: 0.85; }
  .sched-table td.sched-cell-memo { color: var(--coffee); font-weight: 700; }
  .sched-table td.sched-cell-review { color: var(--cinnamon); }

  .days-select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(64px, 100%), 1fr)); gap: 0.5rem; margin-top: 0.7rem; }
  .day-toggle-btn {
    min-height: 44px;
    border-radius: 12px;
    border: 1.5px solid var(--sand);
    background: var(--paper);
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: clamp(0.72rem, 1.8vw, 0.8rem);
    color: var(--cinnamon);
    cursor: pointer;
    padding: 0.4rem 0.2rem;
    transition: all .2s ease;
  }
  .day-toggle-btn.active {
    border-color: var(--caramel);
    background: linear-gradient(160deg, #f3e4cd, var(--linen));
    color: var(--espresso);
  }

  .actions { display: flex; gap: 0.55rem; margin-top: 1.2rem; flex-wrap: wrap; }
  .action-btn {
    flex: 1;
    min-width: 140px;
    min-height: 48px;
    padding: clamp(0.7rem, 2.2vw, 0.8rem) 0.6rem;
    border-radius: 14px;
    border: none;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: clamp(0.8rem, 2vw, 0.88rem);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .action-btn:active { transform: scale(0.98); }
  .action-btn:disabled { opacity: 0.65; cursor: default; }
  .action-btn.primary {
    background: linear-gradient(135deg, var(--coffee), var(--espresso));
    color: var(--paper);
    box-shadow: 0 8px 18px rgba(43,28,19,0.28);
  }
  .action-btn.secondary {
    background: var(--linen);
    color: var(--coffee);
    border: 1.5px solid var(--sand);
  }
  .save-notice { text-align: center; font-size: 0.8rem; color: var(--coffee); margin-top: 0.6rem; font-weight: 700; }

  /* ---- Print calendar (built off-screen, used only for PDF export) ----
     Wrapped in a zero-size, overflow-hidden, non-fixed container instead of a huge
     negative offset: some mobile/webview renderers turn ancestors with a transform
     into a new containing block, which breaks "position:fixed; top:-99999px" and can
     leave the raw calendar markup visible at the bottom of the page. A 0x0 clipped
     box in normal flow has no such failure mode and still lays out/paints its
     full-size children so html2canvas can capture them correctly. */
  #pdf-calendar-wrap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #pdf-calendar-root {
    width: 1200px;
    background: var(--paper);
  }
  @media print {
    #pdf-calendar-wrap { display: none !important; }
  }
  .cal-page {
    width: 1200px;
    height: 849px;
    background: var(--paper);
    padding: 30px 34px 20px;
    font-family: 'Tajawal', sans-serif;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .cal-page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--sand);
    padding-bottom: 12px;
    margin-bottom: 14px;
    flex: 0 0 auto;
  }
  .cal-plan-title { font-family: 'Amiri', serif; font-weight: 700; font-size: 1.35rem; color: var(--coffee); margin: 0; }
  .cal-plan-sub { font-size: 0.8rem; color: var(--cinnamon); margin: 3px 0 0; }
  .cal-month-badge {
    background: linear-gradient(135deg, var(--coffee), var(--espresso));
    color: var(--paper);
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 8px 26px 7px;
    border-radius: 22px;
    box-shadow: 0 6px 14px rgba(43,28,19,0.25);
    text-align: center;
    line-height: 1.35;
  }
  .cal-grid {

<script>
(function () {
  "use strict";

  const TOTAL_PAGES = 604;
  const TOTAL_AJZA = 30;

  const SURAHS = [
    ["الفاتحة", 1], ["البقرة", 2], ["آل عمران", 50], ["النساء", 77], ["المائدة", 106],
    ["الأنعام", 128], ["الأعراف", 151], ["الأنفال", 177], ["التوبة", 187], ["يونس", 208],
    ["هود", 221], ["يوسف", 235], ["الرعد", 249], ["إبراهيم", 255], ["الحجر", 262],
    ["النحل", 267], ["الإسراء", 282], ["الكهف", 293], ["مريم", 305], ["طه", 312],
    ["الأنبياء", 322], ["الحج", 332], ["المؤمنون", 342], ["النور", 350], ["الفرقان", 359],
    ["الشعراء", 367], ["النمل", 377], ["القصص", 385], ["العنكبوت", 396], ["الروم", 404],
    ["لقمان", 411], ["السجدة", 415], ["الأحزاب", 418], ["سبأ", 428], ["فاطر", 434],
    ["يس", 440], ["الصافات", 446], ["ص", 453], ["الزمر", 458], ["غافر", 467],
    ["فصلت", 477], ["الشورى", 483], ["الزخرف", 489], ["الدخان", 496], ["الجاثية", 499],
    ["الأحقاف", 502], ["محمد", 507], ["الفتح", 511], ["الحجرات", 515], ["ق", 518],
    ["الذاريات", 520], ["الطور", 523], ["النجم", 526], ["القمر", 528], ["الرحمن", 531],
    ["الواقعة", 534], ["الحديد", 537], ["المجادلة", 542], ["الحشر", 545], ["الممتحنة", 549],
    ["الصف", 551], ["الجمعة", 553], ["المنافقون", 554], ["التغابن", 556], ["الطلاق", 558],
    ["التحريم", 560], ["الملك", 562], ["القلم", 564], ["الحاقة", 566], ["المعارج", 568],
    ["نوح", 570], ["الجن", 572], ["المزمل", 574], ["المدثر", 575], ["القيامة", 577],
    ["الإنسان", 578], ["المرسلات", 580], ["النبأ", 582], ["النازعات", 583], ["عبس", 585],
    ["التكوير", 586], ["الانفطار", 587], ["المطففين", 587], ["الانشقاق", 589], ["البروج", 590],
    ["الطارق", 591], ["الأعلى", 591], ["الغاشية", 592], ["الفجر", 593], ["البلد", 594],
    ["الشمس", 595], ["الليل", 595], ["الضحى", 596], ["الشرح", 596], ["التين", 597],
    ["العلق", 597], ["القدر", 598], ["البينة", 598], ["الزلزلة", 599], ["العاديات", 599],
    ["القارعة", 600], ["التكاثر", 600], ["العصر", 601], ["الهمزة", 601], ["الفيل", 601],
    ["قريش", 602], ["الماعون", 602], ["الكوثر", 602], ["الكافرون", 603], ["النصر", 603],
    ["المسد", 603], ["الإخلاص", 604], ["الفلق", 604], ["الناس", 604],
  ];

  const WEEK_DAYS = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];
  const STORAGE_KEY = "خطة-القرآن-الكريم-المحفوظة";

  const state = {
    tab: "memorize",
    studentName: "",
    memo: {
      mode: "duration", years: 3, months: 0, pagesPerWeek: 7,
      direction: "forward",
      preMemorized: { enabled: false, mode: "range", fromPage: 1, toPage: 20, count: 20, secondRangeEnabled: false, fromPage2: 500, toPage2: 604 },
      daysMode: "all", activeDays: ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"],
      // نهاية خطة الحفظ: "finishQuran" (تستمر حتى إتمام حفظ القرآن كاملاً، الوضع الافتراضي)
      // أو "date" (تتوقف عند تاريخ محدد، ولو لم يكتمل حفظ القرآن بعد).
      endMode: "finishQuran", calendarType: "gregorian", endDate: null,
    },
    review: {
      rangeMode: "pages", fromPage: 1, toPage: 20, fromSurah: 0, toSurah: SURAHS.length - 1,
      durationValue: 10, durationUnit: "days",
      daysMode: "custom", activeDays: ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"],
      cyclicMode: false, cycleValue: 7, cycleUnit: "days", growWithMemo: false,
      programValue: 1, programUnit: "months",
      endMode: "duration", calendarType: "gregorian", endDate: null,
      reverseMode: false, reversePagesPerDay: 6, reverseRepeat: false,
    },
    // تاريخ بداية الخطة: "today" (اليوم) | "weekday" (أقرب يوم قادم باسمه) | "custom" (تاريخ محدد يدوياً)
    startDate: {
      mode: "today",
      weekday: null,
      calendarType: "gregorian",
      customDate: null,
    },
  };

  // يحسب تاريخ بداية الخطة الفعلي (كائن Date عند منتصف الليل) بناءً على اختيار المستخدم في state.startDate.
  // كل بناء للجدول اليومي في التطبيق (حفظ / مراجعة / خطة شاملة / تقويم PDF) ينطلق من هذا التاريخ بدل "اليوم" الفعلي مباشرة.
  function getPlanStartDate() {
    const t = new Date();
    const todayMidnight = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const sd = state.startDate;

    if (sd.mode === "custom" && sd.customDate && sd.customDate.year && sd.customDate.month && sd.customDate.day) {
      const g = sd.calendarType === "hijri" ? convertDateParts("hijri", "gregorian", sd.customDate) : sd.customDate;
      const d = new Date(g.year, g.month - 1, g.day);
      return isNaN(d.getTime()) ? todayMidnight : d;
    }

    if (sd.mode === "weekday" && sd.weekday) {
      const targetIdx = WEEK_DAYS.indexOf(sd.weekday);
      if (targetIdx === -1) return todayMidnight;
      const todayIdx = (todayMidnight.getDay() + 1) % 7; // متوافق مع ترتيب WEEK_DAYS (يبدأ بالسبت)
      const diff = (targetIdx - todayIdx + 7) % 7; // صفر يعني أن اليوم المختار هو اليوم نفسه
      return addDays(todayMidnight, diff);
    }

    return todayMidnight; // mode === "today" أو أي حالة غير مكتملة
  }

  // مكافئ todayHijriParts لكن مبني على تاريخ بداية الخطة (وليس التاريخ الفعلي)، يُستخدم لضبط سنة الأساس
  // في منتقي التاريخ الهجري حتى تظهر السنوات المناسبة عندما تكون بداية الخطة في تاريخ لاحق.
  function planStartHijriParts() {
    const d = getPlanStartDate();
    return jdnToHijri(gregorianToJDN(d.getFullYear(), d.getMonth() + 1, d.getDate()));
  }

  // نهاية سورة قد يشاركها أكثر من سورة "صفحة البداية" نفسها (سور قصيرة جداً متتالية موضوعة على نفس
  // الصفحة، كالقدر التي تشارك صفحتها مع البينة، أو قريش والماعون والكوثر على صفحة واحدة). الصيغة
  // القديمة (SURAHS[index+1][1] - 1) كانت تُنتج نهاية أقل من البداية في هذه الحالة (خطأ)، فنتخطى هنا
  // أي سور تالية تشارك نفس صفحة البداية، ونحسب النهاية من أول صفحة بداية مختلفة فعلياً بعدها.
  function surahEndPage(index) {
    let j = index + 1;
    while (j < SURAHS.length && SURAHS[j][1] <= SURAHS[index][1]) j++;
    return j < SURAHS.length ? SURAHS[j][1] - 1 : TOTAL_PAGES;
  }
  // يرجع فهرس السورة التي تقع فيها صفحة معيّنة (SURAHS مرتبة تصاعدياً حسب صفحة البداية).
  function surahIndexForPage(page) {
    let lo = 0, hi = SURAHS.length - 1;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      if (SURAHS[mid][1] <= page) lo = mid; else hi = mid - 1;
    }
    return lo;
  }
  function surahStartPageOf(index) { return SURAHS[index][1]; }

  /* ---------------- محاذاة نهاية اليوم على حدود السور (بدل الاعتماد على حساب الصفحات فقط) ----------------
     الفكرة: كل يوم له "نهاية طبيعية" محسوبة رياضياً حسب المعدّل. إن وقعت هذه النهاية في منتصف سورة
     وكان ينقصها صفحة واحدة فقط لتختم السورة كاملة، نمدّها بصفحة واحدة لتنطبق نهاية اليوم مع نهاية
     السورة تماماً (فيبدأ اليوم التالي تلقائياً من أول سورة جديدة، تصاعدياً).
     ملاحظة: أُزيل سابقاً تعديل مقابل كان "يسحب" صفحة واحدة من نهاية اليوم إن كانت أول صفحة منفردة من
     سورة جديدة ويؤجلها لليوم التالي — لأن هذا كان يترك أحياناً صفحة يتيمة معزولة (مثل صفحة واحدة من
     سورة فُصّلت) تظهر لوحدها في يوم لاحق بدل أن تُدمج بشكل صحيح مع بقية صفحات نفس السورة، فبدا الأمر
     وكأن هناك صفحات "مفقودة" رغم أنها لم تكن كذلك فعلياً. الآن أي سورة لم تكتمل يبقى الباقي منها
     تلقائياً لليوم التالي، ويبدأ حساب اليوم التالي من حيث توقف (أي من بداية السورة نفسها إن كانت هي
     كل ما تبقى) تصاعدياً دون أي قصّ اصطناعي. */
  function nudgeForwardBoundary(toP, hardMax) {
    if (toP >= hardMax) return Math.min(toP, hardMax);
    const idx = surahIndexForPage(toP);
    const end = surahEndPage(idx);
    if (toP === end) return toP; // نهاية اليوم أصلاً نهاية سورة كاملة
    if (toP + 1 === end && toP + 1 <= hardMax) return toP + 1; // ينقصه صفحة واحدة ليختم السورة كاملة
    return toP;
  }
  function nudgeReverseBoundary(fromP, hardMin) {
    if (fromP <= hardMin) return Math.max(fromP, hardMin);
    const idx = surahIndexForPage(fromP);
    const start = surahStartPageOf(idx);
    if (fromP === start) return fromP; // بداية اليوم أصلاً بداية سورة كاملة (السورة اكتملت)
    if (fromP - 1 === start && fromP - 1 >= hardMin) return fromP - 1; // ينقصه صفحة واحدة ليكمل السورة لبدايتها
    return fromP;
  }

  /* ---------------- "ورد المراجعة": إنهاء الحصة اليومية دوماً عند نهاية سورة كاملة ----------------
     يُطبَّق هذا حصراً داخل دوال بناء أيام "المراجعة" (وليس الحفظ إطلاقاً). القواعد:
     1) نهاية الحصة اليومية يجب أن تقع دوماً عند نهاية سورة كاملة — إلا إن كانت السورة الحالية
        أطول أصلاً من أن تكتمل ضمن يوم واحد (عندها يستمر التقدّم داخلها طبيعياً دون أي قصّ اصطناعي،
        لأنه لا توجد "سورة سابقة مكتملة ضمن نفس اليوم" يمكن الرجوع إليها).
     2) إن كان الباقي حتى نهاية السورة الحالية ≤ 3 صفحات: تُمدّ الحصة تلقائياً لتشمل بقية السورة كاملة.
     3) إن كان الباقي > 3 صفحات: تُقصّ الحصة عند نهاية آخر سورة مكتملة سابقة ضمن نفس اليوم، وتُرحَّل
        بداية السورة الحالية (غير المكتملة) لليوم التالي.
     4) إن كانت السورة التي يبدأ بها اليوم عدد صفحاتها أقل من 10 ولن تتّسع حصة اليوم المعتادة
        لإتمامها كاملة ضمن هذا اليوم: لا تُدرَج هذه السورة في هذا اليوم إطلاقاً (يُصفَّر مقدار هذا
        اليوم)، وتُرحَّل السورة كاملة (من بدايتها) لليوم التالي. */
  function reviewAdjustEndForSurahCompletion(fromUnit, toUnit, endUnit) {
    if (toUnit < fromUnit || toUnit >= endUnit) return toUnit;
    const naturalEndPage = halfUnitToPage(toUnit);
    const curIdx = surahIndexForPage(naturalEndPage);
    const curSurahEndUnit = pageToHalfUnit(surahEndPage(curIdx), true);
    if (toUnit === curSurahEndUnit) return toUnit; // ينتهي أصلاً عند نهاية سورة كاملة (بما فيها نصفها الأخير)
    // القاعدة 2: إن كان الباقي حتى نهاية السورة ≤ 3 صفحات (= 6 أنصاف صفحة) فأقل — بحساب دقيق يشمل
    // أنصاف الصفحات كي لا يُترك نصف صفحة أخير من سورة قصيرة معلّقاً — تُمدّ الحصة لإتمام السورة كاملة.
    const remainingHalves = curSurahEndUnit - toUnit;
    if (remainingHalves <= 6) {
      return curSurahEndUnit <= endUnit ? curSurahEndUnit : toUnit;
    }
    // القاعدة 3: القصّ عند نهاية آخر سورة مكتملة سابقة ضمن نفس اليوم (إن وُجدت)
    if (curIdx > 0) {
      const prevSurahEndUnit = pageToHalfUnit(surahEndPage(curIdx - 1), true);
      if (prevSurahEndUnit >= fromUnit) return prevSurahEndUnit;
    }
    return toUnit; // لا توجد سورة سابقة مكتملة ضمن اليوم نفسه — استمرار طبيعي داخل سورة طويلة
  }
  function reviewShouldDeferShortSurah(fromUnit, endUnit, halvesToday) {
    if (!isHalfUnitTop(fromUnit)) return false; // اليوم لا يبدأ من أول صفحة سورة أصلاً
    const pageFrom = halfUnitToPage(fromUnit);
    const idx = surahIndexForPage(pageFrom);
    if (surahStartPageOf(idx) !== pageFrom) return false;
    const sEndPage = surahEndPage(idx);
    const surahLenPages = sEndPage - pageFrom + 1;
    if (surahLenPages >= 10) return false;
    const surahEndUnit = pageToHalfUnit(sEndPage, true);
    if (surahEndUnit > endUnit) return false; // نهاية السورة تتجاوز نطاق المراجعة المحدد أصلاً
    const halvesInSurah = surahEndUnit - fromUnit + 1;
    return halvesToday < halvesInSurah;
  }
  // مكافئ للقاعدتين أعلاه لمسار "المراجعة العكسية" (تنازلياً من صفحة عليا لأدنى): هنا "نهاية اليوم
  // الطبيعية" هي fromUnit (الطرف الأدنى)، والمحاذاة المطلوبة تكون على بداية سورة (لا نهايتها).
  function reviewAdjustStartForSurahCompletionReverse(toUnit, fromUnit, startUnit) {
    if (fromUnit > toUnit || fromUnit <= startUnit) return fromUnit;
    const naturalStartPage = halfUnitToPage(fromUnit);
    const curIdx = surahIndexForPage(naturalStartPage);
    const curSurahStartUnit = pageToHalfUnit(surahStartPageOf(curIdx), false);
    if (fromUnit === curSurahStartUnit) return fromUnit; // يبدأ أصلاً من بداية سورة كاملة
    // مكافئ القاعدة 2 (بحساب دقيق بأنصاف الصفحات): امتد للخلف حتى بداية السورة كاملة.
    const remainingHalves = fromUnit - curSurahStartUnit;
    if (remainingHalves <= 6) {
      return curSurahStartUnit >= startUnit ? curSurahStartUnit : fromUnit;
    }
    // مكافئ القاعدة 3: القصّ عند بداية السورة التالية (الأقرب للأسفل) ضمن نفس اليوم
    if (curIdx + 1 < SURAHS.length) {
      const nextSurahStartUnit = pageToHalfUnit(surahStartPageOf(curIdx + 1), false);
      if (nextSurahStartUnit <= toUnit) return nextSurahStartUnit;
    }
    return fromUnit;
  }
  function reviewShouldDeferShortSurahReverse(toUnit, startUnit, halvesToday) {
    if (!isHalfUnitTop(toUnit + 1)) return false; // اليوم لا يبدأ (من أعلى) من آخر صفحة سورة أصلاً
    const pageTo = halfUnitToPage(toUnit);
    const idx = surahIndexForPage(pageTo);
    if (surahEndPage(idx) !== pageTo) return false;
    const sStartPage = surahStartPageOf(idx);
    const surahLenPages = pageTo - sStartPage + 1;
    if (surahLenPages >= 10) return false;
    const surahStartUnit = pageToHalfUnit(sStartPage, false);
    if (surahStartUnit < startUnit) return false;
    const halvesInSurah = toUnit - surahStartUnit + 1;
    return halvesToday < halvesInSurah;
  }
  // يرجع نطاقات الصفحات الفعلية ليوم ما: يعتمد أولاً على day.ranges (مصفوفة {from,to} — تُستخدم في
  // "الحفظ المعكوس" حين يغطي اليوم أكثر من نطاق منفصل)، ويرجع تلقائياً لزوج fromPage/toPage القديم
  // لأي يوم آخر لا يحمل ranges (الحفظ الأمامي، المراجعة، إلخ). مصفوفة فارغة تعني يوماً بلا ورد صفحات.
  function dayPageRanges(d) {
    if (d && Array.isArray(d.parts) && d.parts.length) {
      return d.parts.map((p) => p.type === "half"
        ? { from: p.page, to: p.page, half: p.half }
        : { from: p.from, to: p.to });
    }
    if (d && Array.isArray(d.ranges) && d.ranges.length) return d.ranges;
    if (d && d.fromPage != null && d.toPage != null) return [{ from: d.fromPage, to: d.toPage }];
    return [];
  }
  /* ---------------- دعم "نصف الصفحة" (مقدار يومي أقل من صفحة كاملة) ----------------
     كل صفحة تُمثَّل داخلياً بوحدتين متتاليتين من "أنصاف الصفحات" (half-units): الوحدة الزوجية هي
     النصف الأعلى، والوحدة الفردية التالية لها مباشرة هي النصف الأسفل من نفس الصفحة. هذا يسمح بتوزيع
     حصة يومية أصغر من صفحة كاملة (نصف صفحة، صفحة ونصف، ...) بدقة، بدل تقريبها دائماً لصفحة كاملة. */
  function pageToHalfUnit(page, isBottom) { return (page - 1) * 2 + (isBottom ? 1 : 0); }
  function halfUnitToPage(u) { return Math.floor(u / 2) + 1; }
  function isHalfUnitTop(u) { return u % 2 === 0; }
  // يحوّل مدى متصل من أنصاف الصفحات [fromUnit..toUnit] (شامل الطرفين) إلى قائمة "أجزاء" قابلة
  // للعرض: كل امتداد من صفحات كاملة متتالية يُجمع في جزء واحد {type:"full", from, to}، وأي طرف
  // ينتهي أو يبدأ في منتصف صفحة (نصف واحد فقط دون تكملته) يُفرد في جزء مستقل
  // {type:"half", page, half:"top"|"bottom"}.
  function halfUnitsToParts(fromUnit, toUnit) {
    const parts = [];
    let u = fromUnit;
    while (u <= toUnit) {
      if (isHalfUnitTop(u) && u + 1 <= toUnit) {
        const startPage = halfUnitToPage(u);
        let v = u;
        while (v + 1 <= toUnit && isHalfUnitTop(v)) v += 2;
        parts.push({ type: "full", from: startPage, to: halfUnitToPage(v - 1) });
        u = v;
      } else {
        parts.push({ type: "half", page: halfUnitToPage(u), half: isHalfUnitTop(u) ? "top" : "bottom" });
        u += 1;
      }
    }
    return parts;
  }
  function partStartPage(p) { return p.type === "half" ? p.page : p.from; }
  function partEndPage(p) { return p.type === "half" ? p.page : p.to; }
  // يدمج أجزاء "كاملة" (full) تتلامس أرقام صفحاتها في نطاق واحد متصل، حتى لو وردت في اليوم بترتيب
  // غير تصاعدي (كما يحدث في الحفظ المعكوس حين تُطوى السور من الأخيرة للأولى، بينما صفحات كل سورة
  // قصيرة قد تكون متتالية الأرقام مع سورة أخرى مجاورة). يحافظ على موضع أول ظهور لكل نطاق مدمَج ضمن
  // ترتيب اليوم الأصلي، ولا يمسّ الأجزاء النصفية (half) التي تبقى مستقلة كما هي.
  function mergeAdjacentParts(parts) {
    const fullIdx = [];
    parts.forEach((p, i) => { if (p.type === "full") fullIdx.push(i); });
    const parent = fullIdx.map((_, i) => i);
    function find(x) { return parent[x] === x ? x : (parent[x] = find(parent[x])); }
    function union(a, b) { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
    for (let a = 0; a < fullIdx.length; a++) {
      for (let b = a + 1; b < fullIdx.length; b++) {
        const pa = parts[fullIdx[a]], pb = parts[fullIdx[b]];
        if (pa.to + 1 === pb.from || pb.to + 1 === pa.from) union(a, b);
      }
    }
    const groups = new Map();
    fullIdx.forEach((origIdx, i) => {
      const root = find(i);
      const p = parts[origIdx];
      if (!groups.has(root)) groups.set(root, { from: p.from, to: p.to, firstIndex: origIdx });
      else {
        const g = groups.get(root);
        g.from = Math.min(g.from, p.from);
        g.to = Math.max(g.to, p.to);
        g.firstIndex = Math.min(g.firstIndex, origIdx);
      }
    });
    const result = [];
    parts.forEach((p, i) => { if (p.type !== "full") result.push({ item: p, idx: i }); });
    groups.forEach((g) => result.push({ item: { type: "full", from: g.from, to: g.to }, idx: g.firstIndex }));
    result.sort((a, b) => a.idx - b.idx);
    return result.map((r) => r.item);
  }
  // تسمية نطاق واحد بصيغة كاملة: "صفحة 482" أو "من 467 إلى 470" أو "نصف الصفحة 482 اللي فوق".
  function formatPageRangeFull(r) {
    if (r.half) return `نصف الصفحة ${r.from} اللي ${r.half === "top" ? "فوق" : "تحت"}`;
    return r.from === r.to ? `صفحة ${r.from}` : `من ${r.from} إلى ${r.to}`;
  }
  // تسمية نطاق واحد بصيغة مختصرة: "ص482" أو "467-470" أو "نصف ص482 فوق".
  function formatPageRangeShort(r) {
    if (r.half) return `نصف ص${r.from} ${r.half === "top" ? "فوق" : "تحت"}`;
    return r.from === r.to ? `ص${r.from}` : `${r.from}-${r.to}`;
  }
  // تسمية يوم كامل (قد يضم أكثر من نطاق صفحات منفصل في الحفظ المعكوس) بالصيغة الكاملة.
  function formatDayRangesFull(d) {
    const ranges = dayPageRanges(d);
    return ranges.map(formatPageRangeFull).join("، ثم ");
  }
  // تسمية يوم كامل بالصيغة المختصرة (تُستخدم في التقويم وجدول الخطة الشاملة).
  function formatDayRangesShort(d) {
    const ranges = dayPageRanges(d);
    return ranges.map(formatPageRangeShort).join(" + ");
  }

  /* ---------------- عرض الورد اليومي بأسماء السور بدل أرقام الصفحات (الجدول + PDF/الطباعة) ----------------
     يُستخدم فقط في طبقة العرض (نص الجدول وخلايا تقويم PDF)؛ لا يمسّ أي حساب داخلي لتوزيع الصفحات. */
  // يدمج نطاقات اليوم المتفرقة (قد تصل من أكثر من "جزء"/"كتلة" منفصلة، كما يحدث حين يعبر يوم واحد
  // من سورة إلى أخرى مجاورة، أو حين ينتهي/يبدأ اليوم بنصف صفحة قبل أو بعد نطاق كامل) في أقل عدد ممكن
  // من نطاقات متصلة فعلياً في ترقيم الصفحات — حتى لا تُعرَض سور أو أجزاء متجاورة الصفحات مفصولة بعلامة
  // "+" بلا داعٍ، ولا يُذكر جزء من سورة مرتين. تعمل على مستوى "نصف الصفحة" كي تلتقط التجاور الصحيح حتى
  // حين يلتقي طرف "نصف صفحة" بطرف نطاق كامل. هذه دالة عرض بحتة ولا تُستخدم في أي حساب لتوزيع الصفحات.
  function mergeRangesForDisplay(ranges) {
    if (!ranges || !ranges.length) return [];
    const units = ranges.map((r) => r.half
      ? { fromUnit: pageToHalfUnit(r.from, r.half === "bottom"), toUnit: pageToHalfUnit(r.from, r.half === "bottom") }
      : { fromUnit: pageToHalfUnit(r.from, false), toUnit: pageToHalfUnit(r.to, true) });
    units.sort((a, b) => a.fromUnit - b.fromUnit);
    const merged = [];
    units.forEach((u) => {
      const last = merged[merged.length - 1];
      if (last && u.fromUnit <= last.toUnit + 1) last.toUnit = Math.max(last.toUnit, u.toUnit);
      else merged.push({ fromUnit: u.fromUnit, toUnit: u.toUnit });
    });
    return merged;
  }
  // يقسّم نطاقاً مُدمَجاً (بوحدات نصف الصفحة) إلى أجزاء بحسب السور التي يمرّ بها، بحيث يُذكر مع كل
  // سورة نطاق صفحاتها الفعلي ضمن هذا اليوم (وليس اسم السورة فقط بلا أرقام).
  // ملاحظة مهمة: قد تشترك أكثر من سورة قصيرة جداً في نفس صفحة البداية (كالقدر مع البينة، أو قريش
  // والماعون والكوثر معاً) — بما أن أدق تقسيم متاح للعرض هو مستوى الصفحة، لا يمكن فصل هذه السور كلٌّ
  // على حدة، فتُجمع كلها في جزء واحد يمثّل "مجموعة" تلك الصفحة المشتركة، مع الاحتفاظ بأول وآخر سورة
  // في المجموعة (surahIdx وtieLastIdx) حتى تُذكر كل الأسماء عند العرض ولا تختفي أي سورة من الظهور.
  function splitMergedRangeBySurah(fromUnit, toUnit) {
    const segments = [];
    let curUnit = fromUnit;
    while (curUnit <= toUnit) {
      const curPage = halfUnitToPage(curUnit);
      const idx = surahIndexForPage(curPage);
      let firstIdx = idx;
      if (SURAHS[idx][1] === curPage) {
        while (firstIdx > 0 && SURAHS[firstIdx - 1][1] === curPage) firstIdx--;
      }
      const surahEndUnit = pageToHalfUnit(surahEndPage(idx), true);
      const segEnd = Math.min(surahEndUnit, toUnit);
      segments.push({ surahIdx: firstIdx, tieLastIdx: idx, fromUnit: curUnit, toUnit: segEnd });
      curUnit = segEnd + 1;
    }
    return segments;
  }
  // تسمية جزء واحد من سورة (أو مجموعة سور تشارك صفحة واحدة): "سورة البقرة 1-10"، أو "سورة البقرة 1"
  // إن كانت صفحة واحدة فقط، أو "سورة البقرة 50 (النصف الأول)" إن كان الجزء نصف صفحة واحدة فقط.
  function labelForSurahSegment(seg) {
    const name = seg.tieLastIdx !== seg.surahIdx
      ? `${SURAHS[seg.surahIdx][0]} - ${SURAHS[seg.tieLastIdx][0]}`
      : SURAHS[seg.surahIdx][0];
    if (seg.fromUnit === seg.toUnit) {
      const page = halfUnitToPage(seg.fromUnit);
      return `سورة ${name} ${page} (${isHalfUnitTop(seg.fromUnit) ? "النصف الأول" : "النصف الثاني"})`;
    }
    const fromPage = halfUnitToPage(seg.fromUnit);
    const toPage = halfUnitToPage(seg.toUnit);
    return fromPage === toPage ? `سورة ${name} ${fromPage}` : `سورة ${name} ${fromPage}-${toPage}`;
  }
  // هل هذا الجزء يغطي السورة (أو مجموعة السور المتجاورة التي تشارك صفحة بدايتها) كاملة من أولها
  // إلى آخرها؟ ملاحظة مهمة: مجموعة السور المتشاركة بصفحة بداية واحدة (كالانفطار مع المطففين) قد
  // تمتد فعلياً لأكثر من صفحة واحدة (سورتان قصيرتان، لكن مجموعهما صفحتان) — فالمقياس الصحيح دوماً
  // هو بداية أول سورة في المجموعة ونهاية آخر سورة فيها (عبر surahEndPage)، وليس افتراض أن المجموعة
  // بأكملها محصورة في صفحة واحدة مشتركة (وهو ما كان يُنتج نطاقاً خاطئاً يُقصي آخر صفحة من المجموعة
  // ويمنعها من الظهور كسلسلة سور مكتملة، فتُعرض بأرقام صفحات بدل اسم السورة فقط).
  function isCompleteSurahSegment(seg) {
    const sStartUnit = pageToHalfUnit(surahStartPageOf(seg.surahIdx), false);
    const sEndUnit = pageToHalfUnit(surahEndPage(seg.tieLastIdx), true);
    return seg.fromUnit === sStartUnit && seg.toUnit === sEndUnit;
  }
  // تسمية نطاق مُدمَج كامل: يُقسَّم بحسب السور. أي سلسلة من سور متتالية مكتملة بالكامل ضمن هذا
  // النطاق (لا حاجة لذكر أرقام صفحاتها) تُختصَر إلى "السورة الأولى - السورة الأخيرة" (أو اسم السورة
  // وحده إن كانت واحدة فقط)، بينما أي جزء غير مكتمل من سورة (بداية أو نهاية اليوم تقع في منتصف سورة
  // كبيرة تمتد لأكثر من يوم) يُذكر مع نطاق صفحاته الفعلي كما هو "سورة X من-إلى".
  function formatMergedRangeLabel(fromUnit, toUnit) {
    const segs = splitMergedRangeBySurah(fromUnit, toUnit);
    const labels = [];
    let i = 0;
    while (i < segs.length) {
      if (isCompleteSurahSegment(segs[i])) {
        let j = i;
        while (j + 1 < segs.length && isCompleteSurahSegment(segs[j + 1])) j++;
        const startName = SURAHS[segs[i].surahIdx][0];
        const endIdx = segs[j].tieLastIdx;
        const endName = SURAHS[endIdx][0];
        labels.push(endIdx !== segs[i].surahIdx ? `${startName} - ${endName}` : `سورة ${startName}`);
        i = j + 1;
      } else {
        labels.push(labelForSurahSegment(segs[i]));
        i++;
      }
    }
    return labels.join(" + ");
  }
  // نسخة "كاملة" (للجدول النصي حيث المساحة أوسع): تدمج نطاقات اليوم أولاً، ثم تعرض لكل نطاق مُدمَج
  // سطراً واحداً يجمع اسم كل سورة مع نطاق صفحاتها الفعلي.
  function formatDayRangesFullBySurah(d) {
    const merged = mergeRangesForDisplay(dayPageRanges(d));
    if (!merged.length) return "";
    return merged.map((r) => `<div class="sched-surah-line">${formatMergedRangeLabel(r.fromUnit, r.toUnit)}</div>`)
      .join('<div class="sched-multi-sep">ثم</div>');
  }
  // نسخة "مختصرة" (لخلايا التقويم/PDF والجدول الشامل): نفس المنطق لكن في سطر نصي واحد بلا HTML.
  function formatDayRangesShortBySurah(d) {
    const merged = mergeRangesForDisplay(dayPageRanges(d));
    if (!merged.length) return "";
    return merged.map((r) => formatMergedRangeLabel(r.fromUnit, r.toUnit)).join(" + ");
  }
  function formatDate(d) {
    return d.toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });
  }
  function addDays(base, days) {
    const d = new Date(base);
    d.setDate(d.getDate() + days);
    return d;
  }

  /* ---------------- Small debounce helper (used on numeric/date inputs) ---------------- */
  function debounce(fn, delay) {
    let t = null;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), delay);
    };
  }

  /* ---------------- Weekly active-days selection (أيام الحفظ / أيام المراجعة) ---------------- */
  // activeDays === null/undefined/empty/all-7 means "every day is active" (no rest days)
  function isDayActive(dayName, activeDays) {
    if (!activeDays || !activeDays.length || activeDays.length >= WEEK_DAYS.length) return true;
    return activeDays.indexOf(dayName) !== -1;
  }
  function getEffectiveActiveDays(obj) {
    if (obj.daysMode !== "custom") return null;
    return (obj.activeDays && obj.activeDays.length) ? obj.activeDays : null;
  }
  function getActiveDaysCountPerWeek(obj) {
    const eff = getEffectiveActiveDays(obj);
    return eff ? eff.length : WEEK_DAYS.length;
  }
  function buildDaysSelectHTML(obj, prefix, key, label) {
    const mode = obj.daysMode || "all";
    const active = (obj.activeDays && obj.activeDays.length) ? obj.activeDays : WEEK_DAYS;
    const daysButtonsHTML = WEEK_DAYS.map((d) =>
      `<button type="button" class="day-toggle-btn${active.indexOf(d) !== -1 ? " active" : ""}" id="${prefix}${key}-day-${d}">${d}</button>`
    ).join("");
    return `
      <div class="card form-card">
        <label class="field-label">${label}</label>
        <div class="mode-switch">
          <button class="mode-btn${mode !== "custom" ? " active" : ""}" id="${prefix}${key}-days-all">كل يوم</button>
          <button class="mode-btn${mode === "custom" ? " active" : ""}" id="${prefix}${key}-days-custom">أيام محددة</button>
        </div>
        ${mode === "custom" ? `
        <div class="days-select-grid">${daysButtonsHTML}</div>
        <p class="hint">الأيام غير المحددة تُعتبر أيام راحة ولن يُوزَّع عليها أي مقرر.</p>` : ""}
      </div>`;
  }
  function bindDaysSelectEvents(obj, prefix, key, onModeChange, onInputChange) {
    document.getElementById(`${prefix}${key}-days-all`).onclick = () => { obj.daysMode = "all"; onModeChange(); };
    document.getElementById(`${prefix}${key}-days-custom`).onclick = () => {
      obj.daysMode = "custom";
      if (!obj.activeDays || !obj.activeDays.length) obj.activeDays = WEEK_DAYS.slice();
      onModeChange();
    };
    if ((obj.daysMode || "all") === "custom") {
      WEEK_DAYS.forEach((d) => {
        const btn = document.getElementById(`${prefix}${key}-day-${d}`);
        if (!btn) return;
        btn.onclick = () => {
          const current = (obj.activeDays && obj.activeDays.length) ? obj.activeDays : WEEK_DAYS.slice();
          const set = new Set(current);
          if (set.has(d)) {
            if (set.size > 1) { set.delete(d); btn.classList.remove("active"); }
          } else {
            set.add(d);
            btn.classList.add("active");
          }
          obj.activeDays = WEEK_DAYS.filter((x) => set.has(x));
          onInputChange();
        };
      });
    }
  }

  /* ---------------- Hijri / Gregorian conversion (تقويم تقديري مبني على الحساب الفلكي التقريبي) ---------------- */
  const HIJRI_MONTHS = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];

  function gregorianToJDN(y, m, d) {
    const a = Math.floor((14 - m) / 12);
    const y2 = y + 4800 - a;
    const m2 = m + 12 * a - 3;
    return d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
  }
  function jdnToGregorian(jdn) {
    const a = jdn + 32044;
    const b = Math.floor((4 * a + 3) / 146097);
    const c = a - Math.floor((146097 * b) / 4);
    const d2 = Math.floor((4 * c + 3) / 1461);
    const e = c - Math.floor((1461 * d2) / 4);
    const m2 = Math.floor((5 * e + 2) / 153);
    const day = e - Math.floor((153 * m2 + 2) / 5) + 1;
    const month = m2 + 3 - 12 * Math.floor(m2 / 10);
    const year = 100 * b + d2 - 4800 + Math.floor(m2 / 10);
    return { year, month, day };
  }
  function hijriToJDN(y, m, d) {
    return Math.floor((11 * y + 3) / 30) + 354 * y + 30 * m - Math.floor((m - 1) / 2) + d + 1948440 - 385;
  }
  function jdnToHijri(jdn) {
    let l = jdn - 1948440 + 10632;
    const n = Math.floor((l - 1) / 10631);
    l = l - 10631 * n + 354;
    const j = (Math.floor((10985 - l) / 5316)) * (Math.floor((50 * l) / 17719)) + (Math.floor(l / 5670)) * (Math.floor((43 * l) / 15238));
    l = l - (Math.floor((30 - j) / 15)) * (Math.floor((17719 * j) / 50)) - (Math.floor(j / 16)) * (Math.floor((15238 * j) / 43)) + 29;
    const m = Math.floor((24 * l) / 709);
    const d = l - Math.floor((709 * m) / 24);
    const y = 30 * n + j - 30;
    return { year: y, month: m, day: d };
  }
  function todayHijriParts() {
    const t = new Date();
    return jdnToHijri(gregorianToJDN(t.getFullYear(), t.getMonth() + 1, t.getDate()));
  }
  function formatHijriDate(date) {
    const h = jdnToHijri(gregorianToJDN(date.getFullYear(), date.getMonth() + 1, date.getDate()));
    return `${h.day} ${HIJRI_MONTHS[h.month - 1]} ${h.year}هـ`;
  }
  function formatDualDate(date) {
    return `${formatDate(date)} م (موافق ${formatHijriDate(date)})`;
  }
  // Converts a {year,month,day} triple from one calendar system to the other, keeping the same absolute day.
  function convertDateParts(fromType, toType, parts) {
    if (!parts) return null;
    if (fromType === toType) return parts;
    const jdn = fromType === "hijri" ? hijriToJDN(parts.year, parts.month, parts.day) : gregorianToJDN(parts.year, parts.month, parts.day);
    return toType === "hijri" ? jdnToHijri(jdn) : jdnToGregorian(jdn);
  }
  function defaultEndDateParts(calendarType) {
    const d = addDays(getPlanStartDate(), 30);
    const g = { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
    return calendarType === "hijri" ? convertDateParts("gregorian", "hijri", g) : g;
  }
  function daysInHijriMonth() { return 30; }
  function daysInGregorianMonth(year, month) { return new Date(year, month, 0).getDate(); }

  /* ---------------- Pre-memorized pages (الحفظ المسبق) ---------------- */
  // Returns the list of already-memorized page ranges the user entered: 1-2 ranges when
  // pm.mode === "range", a single prefix range [1..count] when pm.mode === "count", and
  // empty when pre-memorization is off entirely.
  function getPreMemorizedRanges(m) {
    const pm = m.preMemorized;
    if (!pm || !pm.enabled) return [];
    if (pm.mode !== "range") {
      const count = Math.max(0, Math.min(Number(pm.count) || 0, TOTAL_PAGES));
      return count > 0 ? [{ from: 1, to: count }] : [];
    }
    const ranges = [];
    const from1 = Math.max(1, Math.min(Number(pm.fromPage) || 1, TOTAL_PAGES));
    const to1 = Math.max(from1, Math.min(Number(pm.toPage) || from1, TOTAL_PAGES));
    ranges.push({ from: from1, to: to1 });
    if (pm.secondRangeEnabled) {
      const from2 = Math.max(1, Math.min(Number(pm.fromPage2) || 1, TOTAL_PAGES));
      const to2 = Math.max(from2, Math.min(Number(pm.toPage2) || from2, TOTAL_PAGES));
      ranges.push({ from: from2, to: to2 });
    }
    return ranges;
  }
  // Merges the memorized ranges and returns whatever is left of the mushaf (1..604) as an
  // ascending list of gap segments. Two disjoint memorized ranges (e.g. 1-77 و 500-604) produce
  // the single gap between them; more complex inputs can produce several gaps. Returns
  // [{from:1,to:604}] when nothing is marked memorized, and [] when the whole mushaf is covered.
  function getRemainingSegments(m) {
    const memorized = getPreMemorizedRanges(m);
    if (!memorized.length) return [{ from: 1, to: TOTAL_PAGES }];
    const sorted = memorized.slice().sort((a, b) => a.from - b.from);
    const merged = [];
    sorted.forEach((r) => {
      if (merged.length && r.from <= merged[merged.length - 1].to + 1) {
        merged[merged.length - 1].to = Math.max(merged[merged.length - 1].to, r.to);
      } else {
        merged.push({ from: r.from, to: r.to });
      }
    });
    const segments = [];
    let cursor = 1;
    merged.forEach((r) => {
      if (r.from > cursor) segments.push({ from: cursor, to: r.from - 1 });
      cursor = Math.max(cursor, r.to + 1);
    });
    if (cursor <= TOTAL_PAGES) segments.push({ from: cursor, to: TOTAL_PAGES });
    return segments;
  }
  function getPreMemorizedCount(m) {
    const pm = m.preMemorized;
    if (!pm || !pm.enabled) return 0;
    const remaining = getRemainingSegments(m).reduce((s, seg) => s + (seg.to - seg.from + 1), 0);
    return Math.min(Math.max(TOTAL_PAGES - remaining, 0), TOTAL_PAGES - 1);
  }
  // "بداية الخطة" للعرض فقط: أول صفحة متبقية (اتجاه أمامي) أو آخر صفحة متبقية (اتجاه معكوس، من سورة الناس).
  function getRemainingStartPage(m) {
    const segs = getRemainingSegments(m);
    if (!segs.length) return TOTAL_PAGES;
    return m.direction === "reverse" ? segs[segs.length - 1].to : segs[0].from;
  }
  function getRemainingPages(m) {
    const total = getRemainingSegments(m).reduce((s, seg) => s + (seg.to - seg.from + 1), 0);
    return Math.max(total, 1);
  }
  function beadsHTML(filled, label) {
    let spans = "";
    for (let i = 0; i < TOTAL_AJZA; i++) {
      spans += `<span class="bead${i < filled ? " bead-filled" : ""}"></span>`;
    }
    return `<div class="beads-wrap"><div class="beads-row" dir="ltr">${spans}</div><p class="beads-label">${label}</p></div>`;
  }
  function statCardHTML(value, label) {
    return `<div class="stat-card"><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>`;
  }
  function inspireHTML(text) {
    return `<div class="inspire-card"><span class="inspire-icon">✦</span><p>${text}</p></div>`;
  }

  // يبني جدولاً منظّماً (تاريخ + يوم + الورد) لأول أيام أي خطة قادمة، اعتماداً على تواريخ حقيقية
  // محسوبة من تاريخ بداية الخطة (getPlanStartDate) مع مراعاة أيام الراحة الأسبوعية.
  // days: مصفوفة عناصر { date, isRest, fromPage, toPage, isFilled } كما تُنتجها دوال buildDailyAssignments/buildReverseDailyAssignments/buildCyclicAssignments.
  function buildUpcomingScheduleTableHTML(days, opts) {
    opts = opts || {};
    const limit = opts.limit || 14;
    const rangeLabelFn = opts.rangeLabelFn || ((d) => {
      if (d.isRest) return "يوم راحة";
      if (d.isDeferred) return "لا ورد اليوم (تأجيل سورة قصيرة لغدٍ)";
      if (d.isFilled || (d.fromPage == null && !(d.ranges && d.ranges.length))) return "✓ تمّ الختم";
      return formatDayRangesFullBySurah(d);
    });
    const shown = days.slice(0, limit);
    const rows = shown.map((d) => {
      const dayName = WEEK_DAYS[(d.date.getDay() + 1) % 7];
      return `<tr class="${d.isRest ? "sched-row-rest" : ""}">
        <td>${formatDate(d.date)}</td>
        <td>${dayName}</td>
        <td>${rangeLabelFn(d)}</td>
      </tr>`;
    }).join("");
    const moreNote = days.length > limit
      ? `<p class="hint">وتتواصل الخطة يوماً بعد يوم حتى تاريخ ${formatDate(days[days.length - 1].date)} بإذن الله.</p>`
      : "";
    return `
      <div class="card sched-table-card">
        <h3 class="week-title">${opts.title || "النطاق اليومي والتواريخ"}</h3>
        <div class="sched-table-wrap">
          <table class="sched-table">
            <thead><tr><th>التاريخ</th><th>اليوم</th><th>${opts.rangeColLabel || "الورد"}</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${moreNote}
      </div>`;
  }
  // نسخة مخصّصة للخطة الشاملة: عمود للحفظ وعمود للمراجعة جنباً إلى جنب لكل تاريخ.
  function buildCombinedUpcomingScheduleTableHTML(days, opts) {
    opts = opts || {};
    const limit = opts.limit || 14;
    const labelFor = (d) => {
      if (!d) return "✓ اكتمل";
      if (d.isRest) return "راحة";
      if (d.isDeferred) return "تأجيل سورة قصيرة";
      if (d.isFilled || (d.fromPage == null && !(d.ranges && d.ranges.length))) return "✓ تمّ";
      return formatDayRangesShortBySurah(d);
    };
    const shown = days.slice(0, limit);
    const rows = shown.map((d) => {
      const dayName = WEEK_DAYS[(d.date.getDay() + 1) % 7];
      const memoRest = d.memo && d.memo.isRest;
      const reviewRest = d.review && d.review.isRest;
      const bothRest = memoRest && reviewRest;
      return `<tr class="${bothRest ? "sched-row-rest" : ""}">
        <td>${formatDate(d.date)}</td>
        <td>${dayName}</td>
        <td class="sched-cell-memo">${labelFor(d.memo)}</td>
        <td class="sched-cell-review">${labelFor(d.review)}</td>
      </tr>`;
    }).join("");
    const moreNote = days.length > limit
      ? `<p class="hint">وتتواصل الخطة يوماً بعد يوم حتى تاريخ ${formatDate(days[days.length - 1].date)} بإذن الله.</p>`
      : "";
    return `
      <div class="card sched-table-card">
        <h3 class="week-title">${opts.title || "النطاق اليومي والتواريخ (حفظ ومراجعة)"}</h3>
        <div class="sched-table-wrap">
          <table class="sched-table">
            <thead><tr><th>التاريخ</th><th>اليوم</th><th>الحفظ</th><th>المراجعة</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${moreNote}
      </div>`;
  }

  /* ---------------- Memorization calculations ---------------- */
  function computeDuration(m) {
    const remaining = getRemainingPages(m);
    const totalMonths = Math.max(m.years * 12 + Number(m.months || 0), 1);
    const totalDays = totalMonths * 30;
    const perWeek = (remaining / totalDays) * 7;
    const activeDaysPerWeek = getActiveDaysCountPerWeek(m);
    const perDay = perWeek / activeDaysPerWeek; // pages per active memorization day
    const ajzaPerMonth = ((remaining / totalDays) * 30) / 20;
    return { perDay, perWeek, ajzaPerMonth, finishDate: addDays(getPlanStartDate(), totalDays), totalDays, remaining };
  }
  // معدّل المراجعة التنازلية اليومي (قد يكون نصف صفحة) — يُقرَّب لأقرب نصف صفحة (0.5) بدل تقريبه
  // دائماً لصفحة كاملة، حتى تنعكس "المراجعة العكسية" بدقة عند معدّلات أقل من صفحة/يوم.
  function getReversePagesPerDay(r) {
    return Math.max(Math.round((Number(r.reversePagesPerDay) || 1) * 2) / 2, 0.5);
  }
  // تنسيق عرض معدّل الصفحات/اليوم في بطاقات الإحصاء: عدد صحيح كما هو، وإلا بمنزلة عشرية واحدة
  // (0.5, 1.5, ...).
  function formatPerDayValue(n) {
    return Number.isInteger(n) ? String(n) : n.toFixed(1);
  }
  function computePace(m) {
    const remaining = getRemainingPages(m);
    const perWeek = Math.max(Number(m.pagesPerWeek) || 0.0001, 0.0001);
    const totalWeeks = remaining / perWeek;
    const totalDays = Math.ceil(totalWeeks * 7);
    const totalYears = totalDays / 365;
    const activeDaysPerWeek = getActiveDaysCountPerWeek(m);
    const perDay = perWeek / activeDaysPerWeek; // pages per active memorization day
    return { totalWeeks, totalDays, totalYears, perDay, finishDate: addDays(getPlanStartDate(), totalDays), remaining };
  }
  // مدة خطة الحفظ بالأيام (تُستخدم لربط نهاية المراجعة بنهاية خطة الحفظ، ولبناء تقويم الحفظ نفسه).
  // إن اختار المستخدم "نهاية الخطة" بتاريخ محدد (m.endMode === "date")، تُقصّ هذه المدة الطبيعية
  // عند ذلك التاريخ حتى لو لم يكتمل حفظ القرآن الكريم بعد بهذا المعدّل — وهذا مصدر الحقيقة الوحيد
  // لطول خطة الحفظ، تستدعيه كل الأماكن الأخرى (نتائج تبويب الحفظ، التبويب الشامل، تصدير PDF) بدل
  // إعادة حساب المدة الطبيعية كل مرة بشكل منفصل، لضمان توقف الخطة في نفس التاريخ في كل مكان تظهر فيه.
  function getMemoNaturalProgramDays(m) {
    const totalDays = (m.mode === "duration") ? computeDuration(m).totalDays : computePace(m).totalDays;
    return Math.max(Math.round(totalDays), 1);
  }
  function getMemoProgramDays(m) {
    const natural = getMemoNaturalProgramDays(m);
    if (m.endMode === "date") return Math.min(natural, computeProgramDaysFromEndDate(m));
    return natural;
  }
  // true إذا كانت "نهاية الخطة" المحددة تقصّ خطة الحفظ فعلياً قبل اكتمال القرآن الكريم بالمعدّل الحالي.
  function isMemoEndDateCapped(m) {
    return m.endMode === "date" && getMemoProgramDays(m) < getMemoNaturalProgramDays(m);
  }

  /* ---------------- End-date picker (هجري / ميلادي) for a capped memorize plan ---------------- */
  // Mirrors buildEndDatePickerHTML (used by cyclic review) but with its own "memo-" id namespace,
  // since both can be visible together on the "خطة شاملة" tab.
  function buildMemoEndDatePickerHTML(m, prefix) {
    const type = m.calendarType || "gregorian";
    const parts = m.endDate || defaultEndDateParts(type);
    const isHijri = type === "hijri";
    const monthNames = isHijri ? HIJRI_MONTHS : ARABIC_MONTHS;
    const baseYear = isHijri ? planStartHijriParts().year : getPlanStartDate().getFullYear();
    const dayCount = isHijri ? 30 : daysInGregorianMonth(parts.year || baseYear, parts.month || 1);

    let dayOptions = "";
    for (let d = 1; d <= dayCount; d++) {
      dayOptions += `<option value="${d}"${d === parts.day ? " selected" : ""}>${d}</option>`;
    }
    let monthOptions = "";
    monthNames.forEach((name, idx) => {
      monthOptions += `<option value="${idx + 1}"${idx + 1 === parts.month ? " selected" : ""}>${name}</option>`;
    });
    let yearOptions = "";
    for (let y = baseYear; y <= baseYear + 6; y++) {
      yearOptions += `<option value="${y}"${y === parts.year ? " selected" : ""}>${y}</option>`;
    }

    const endDateObjForDisplay = isHijri
      ? (() => { const g = convertDateParts("hijri", "gregorian", parts); return new Date(g.year, g.month - 1, g.day); })()
      : new Date(parts.year, parts.month - 1, parts.day);

    const cappedNote = isMemoEndDateCapped(m)
      ? `<p class="hint">ستتوقف خطة الحفظ عند هذا التاريخ حتى لو لم يكتمل حفظ القرآن الكريم كاملاً بهذا المعدّل.</p>`
      : `<p class="hint">هذا التاريخ لن يقصّر الخطة فعلياً — المعدّل الحالي ينهي حفظ القرآن الكريم قبل هذا التاريخ أو عنده تماماً.</p>`;

    return `
      <div class="mode-switch" style="margin-top:0.7rem;">
        <button class="mode-btn${!isHijri ? " active" : ""}" id="${prefix}memo-caltype-gregorian">ميلادي</button>
        <button class="mode-btn${isHijri ? " active" : ""}" id="${prefix}memo-caltype-hijri">هجري</button>
      </div>
      <div class="field-row" style="margin-top:0.6rem;">
        <div class="field-group">
          <span>اليوم</span>
          <select id="${prefix}memo-end-day">${dayOptions}</select>
        </div>
        <div class="field-group">
          <span>الشهر</span>
          <select id="${prefix}memo-end-month">${monthOptions}</select>
        </div>
        <div class="field-group">
          <span>السنة</span>
          <select id="${prefix}memo-end-year">${yearOptions}</select>
        </div>
      </div>
      <p class="hint">تاريخ نهاية الخطة الموافق: ${formatDualDate(endDateObjForDisplay)}</p>
      ${cappedNote}
    `;
  }

  function buildMemoFormHTML(m, prefix) {
    let formHTML = "";
    if (m.mode === "duration") {
      formHTML = `
        <div class="card form-card">
          <label class="field-label">أريد إتمام حفظ القرآن خلال:</label>
          <div class="field-row">
            <div class="field-group">
              <input type="number" min="0" id="${prefix}memo-years" value="${m.years}" />
              <span>سنة</span>
            </div>
            <div class="field-group">
              <input type="number" min="0" max="11" id="${prefix}memo-months" value="${m.months}" />
              <span>شهر</span>
            </div>
          </div>
        </div>`;
    } else {
      formHTML = `
        <div class="card form-card">
          <label class="field-label">أستطيع حفظ هذا العدد من الصفحات أسبوعياً:</label>
          <div class="field-group wide">
            <input type="number" min="0.5" step="0.5" id="${prefix}memo-pace" value="${m.pagesPerWeek}" />
            <span>صفحة / أسبوع</span>
          </div>
        </div>`;
    }
    const pm = m.preMemorized || { enabled: false, mode: "range", fromPage: 1, toPage: 20, count: 20, secondRangeEnabled: false, fromPage2: 500, toPage2: TOTAL_PAGES };
    const preMemFieldsHTML = pm.mode === "range" ? `

          <button class="mode-btn${pm.secondRangeEnabled ? " active" : ""}" id="${prefix}memo-premem-range2-on">إضافة نطاق آخر محفوظ</button>
        </div>
        ${pm.secondRangeEnabled ? `
        <div class="field-row" style="margin-top:0.5rem;">
          <div class="field-group">
            <span>من صفحة (٢)</span>
            <input type="number" min="1" max="${TOTAL_PAGES}" id="${prefix}memo-premem-from2" value="${pm.fromPage2 || 500}" />
          </div>
          <div class="field-group">
            <span>إلى صفحة (٢)</span>
            <input type="number" min="1" max="${TOTAL_PAGES}" id="${prefix}memo-premem-to2" value="${pm.toPage2 || TOTAL_PAGES}" />
          </div>

        <div class="field-group wide">
          <input type="number" min="0" max="${TOTAL_PAGES - 1}" id="${prefix}memo-premem-count" value="${pm.count}" />
          <span>صفحة محفوظة</span>
        </div>`;

    const preMemCount = getPreMemorizedCount(m);
    const remainingSegs = pm.enabled ? getRemainingSegments(m) : [];
    const remainingTotal = getRemainingPages(m);
    let remainingHint;
    if (pm.mode !== "range") {

    } else if (!remainingSegs.length) {

    } else if (remainingSegs.length === 1) {

        : `سيبدأ التخطيط من الصفحة ${remainingSegs[0].from} حتى ختم الباقي (${remainingTotal} صفحة).`;
    } else {
      remainingHint = `تبقّى ${remainingSegs.length} مقاطع للحفظ (${remainingSegs.map((s) => `${s.from}-${s.to}`).join("، ")}) بإجمالي ${remainingTotal} صفحة، وسيوزَّع الحفظ عليها بالترتيب.`;

    const preMemHTML = `

  function renderMemoPanel() {
    const m = state.memo;
    const html = `
      <div class="panel-grid">
        <div class="panel-col panel-col-form">${buildMemoFormHTML(m, "")}</div>
        <div class="panel-col panel-col-results" id="memo-results"></div>
