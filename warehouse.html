function BarcodesPage({ data, setData, notify, readOnly }) {
  const [modal, setModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  // "all" = كل الباركودات · "unassigned" = بدون قسم · وإلا معرّف القسم نفسه
  const [sectionFilter, setSectionFilter] = useState("all");
  // فلتر "المضافة": "all" = الكل · "added" = مضافة كصنف بقائمة الأغراض فقط ·
  // "unadded" = غير مضافة فقط — يعمل مع أي فلتر قسم مختار، ويبقى محفوظاً
  // بنفس الشكل بكل الأقسام (لأن صفحة الباركودات موحّدة لكل الأقسام)
  const [addedFilter, setAddedFilter] = useState("all");
  const [query, setQuery] = useState("");
  const [scanOpen, setScanOpen] = useState(false);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);
  const [flashIdx, setFlashIdx] = useState(null);
  const cardRefs = React.useRef({});

  // تحديد أكواد معيّنة للطباعة (بدل طباعة كل ما هو ظاهر بالفلاتر): وضع
  // "تحديد للطباعة" يفعّل مربع اختيار + عدّاد نسخ فوق كل باركود، فيقدر
  // المستخدم يختار كوداً واحداً فقط ويطلب له 10 نسخ مثلاً (لصقها على عدة
  // منتجات من نفس الصنف)، أو يختار عدة أكواد مختلفة بأعداد مختلفة لكل واحد
  const [selectMode, setSelectMode] = useState(false);
  // { [number]: count }
  const [printSelection, setPrintSelection] = useState({});

  const togglePrintSelect = (number, checked) => {
    setPrintSelection((prev) => {
      const next = { ...prev };
      if (checked) next[number] = next[number] || 1;
      else delete next[number];
      return next;
    });
  };
  const setPrintCount = (number, value) => {
    const n = Math.max(1, Math.min(300, parseInt(value, 10) || 1));
    setPrintSelection((prev) => (prev[number] === undefined ? prev : { ...prev, [number]: n }));
  };
  const bumpPrintCount = (number, delta) => {
    setPrintSelection((prev) => {
      if (prev[number] === undefined) return prev;
      const n = Math.max(1, Math.min(300, (prev[number] || 1) + delta));
      return { ...prev, [number]: n };
    });
  };
  const toggleSelectMode = () => {
    setSelectMode((v) => !v);
    setPrintSelection({});
  };

  const printSelectionCount = Object.keys(printSelection).length;
  const printCopiesTotal = Object.values(printSelection).reduce((sum, n) => sum + (Number(n) || 0), 0);

  // القائمة الفعلية التي ستُطبع عند وجود تحديد: كل كود مكرّر بعدد نسخه
  const printItems = React.useMemo(() => {
    const out = [];
    Object.entries(printSelection).forEach(([number, count]) => {
      const b = data.barcodes.find((x) => x.number === number);
      if (!b) return;
      const n = Math.max(1, Math.min(300, Number(count) || 1));
      for (let i = 0; i < n; i++) out.push({ b, key: number + "-" + i });
    });
    return out;
  }, [printSelection, data.barcodes]);

  const branches = data.branches || [];
  const sectionName = (id) => branches.find((b) => b.id === id)?.name || "";

  // مجموعة أرقام الباركودات المرتبطة فعلياً بصنف مسجّل بقائمة الأغراض —
  // تُستخدم لتمييز الباركود بعلامة "مضاف" بدل ترك المستخدم يخمّن
  const linkedCodes = React.useMemo(
    () => new Set((data.items || []).map((it) => it.code)),
    [data.items]
  );

  const openAdd = () => setModal({
    mode: "add",
    row: {
      name: "",
      number: generateBarcodeNumber(data.barcodes),
      branch: sectionFilter !== "all" && sectionFilter !== "unassigned" ? sectionFilter : "",
      image: "",
    },
  });
  const openEdit = (row, idx) => setModal({ mode: "edit", row: { ...row }, idx });

  // طباعة (ملصقات عادية أو استكرات مصغّرة): لو المستخدم بوضع "تحديد
  // للطباعة" وعنده أكواد محدّدة، تُطبع فقط تلك الأكواد بعدد النسخ المطلوب
  // لكل واحد (بدل كل ما هو ظاهر بالفلاتر الحالية) عبر شبكة طباعة مخفية
  // (print-selection-grid) تحتوي كل كود مكرراً بعدد نسخه.
  const doPrint = (sticker) => {
    if (selectMode && printSelectionCount === 0) {
      notify("حدد كوداً واحداً على الأقل للطباعة، أو أنهِ وضع التحديد لطباعة كل الظاهر", "error");
      return;
    }
    const usingSelection = selectMode && printSelectionCount > 0;
    if (usingSelection) document.body.classList.add("printing-selection");
    let styleEl = null;
    if (sticker) {
      document.body.classList.add("printing-stickers");
      // @page لا يمكن تقييده بكلاس CSS عادي، لذا نحقن وسم <style> مؤقت
      // يلغي هوامش الصفحة الافتراضية (12mm) فقط أثناء طباعة الاستكرات
      styleEl = document.createElement("style");
      styleEl.id = "sticker-page-style";
      styleEl.textContent = "@media print { @page { margin: 0; size: auto; } }";
      document.head.appendChild(styleEl);
    }
    const cleanup = () => {
      document.body.classList.remove("printing-stickers");
      document.body.classList.remove("printing-selection");
      if (styleEl) styleEl.remove();
      window.removeEventListener("afterprint", cleanup);
    };
    window.addEventListener("afterprint", cleanup);
    window.print();
  };

  const save = (row) => {
    if (!row.name.trim() || !row.number.trim()) {
      notify("الاسم والرقم مطلوبان", "error");
      return;
    }
    // تأكيد عدم تكرار رقم الباركود مع أي كود آخر مسجّل مسبقاً (باستثناء
    // نفس الصف الجاري تعديله بوضع "تعديل")
    const duplicateIdx = data.barcodes.findIndex(
      (b, i) => b.number === row.number.trim() && (modal.mode !== "edit" || i !== modal.idx)
    );
    if (duplicateIdx >= 0) {
      notify(`هذا الرقم مستخدم مسبقاً لـ «${data.barcodes[duplicateIdx].name}»`, "error");
      return;
    }
    let barcodes;
    if (modal.mode === "add") barcodes = [...data.barcodes, row];
    else barcodes = data.barcodes.map((b, i) => (i === modal.idx ? row : b));
    setData({ ...data, barcodes });
    setModal(null);
    notify(modal.mode === "add" ? "تمت إضافة الباركود" : "تم حفظ التعديلات");
  };

  const remove = (idx) => {
    setData({ ...data, barcodes: data.barcodes.filter((_, i) => i !== idx) });
    setConfirmDelete(null);
    notify("تم الحذف");
  };

  // مسح سريع بالكاميرا: تسجيل/بحث فوري — إن كان الكود موجوداً ننقل المستخدم
  // لقسمه ونومض على بطاقته، وإن لم يكن موجوداً نفتح نموذج إضافة معبّأ بالرقم
  // مباشرة (تسهيل عملية "التسجيل السريع" دون كتابة الرقم يدوياً)
  const handleScanDetect = (value) => {
    setScanOpen(false);
    const code = value.trim();
    const idx = data.barcodes.findIndex((b) => b.number === code);
    if (idx >= 0) {
      const found = data.barcodes[idx];
      setSectionFilter(found.branch || "unassigned");
      notify(`تم العثور على «${found.name}»`);
      setFlashIdx(idx);
      setTimeout(() => {
        cardRefs.current[idx]?.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 60);
      setTimeout(() => setFlashIdx(null), 900);
    } else {
      notify("كود جديد — أكمل بيانات الباركود", "info");
      setModal({
        mode: "add",
        row: { name: "", number: code, branch: sectionFilter !== "all" && sectionFilter !== "unassigned" ? sectionFilter : "", image: "" },
      });
    }
  };

  const visible = data.barcodes
    .map((b, idx) => ({ b, idx }))
    .filter(({ b }) => {
      if (sectionFilter === "all") return true;
      if (sectionFilter === "unassigned") return !b.branch;
      return b.branch === sectionFilter;
    })
    .filter(({ b }) => {
      if (addedFilter === "added") return linkedCodes.has(b.number);
      if (addedFilter === "unadded") return !linkedCodes.has(b.number);
      return true;
    })
    .filter(({ b }) => fuzzyIncludes(b.name + " " + b.number + " " + sectionName(b.branch), query));

  // تحديد الكل: يحدد كل الباركودات الظاهرة حالياً (حسب الفلاتر) بنسخة
  // واحدة لكل واحد، مثل الوضع القديم قبل إضافة التحديد المخصص
  const allVisibleSelected = visible.length > 0 && visible.every(({ b }) => printSelection[b.number] !== undefined);
  const toggleSelectAll = () => {
    if (allVisibleSelected) {
      setPrintSelection({});
    } else {
      const next = {};
      visible.forEach(({ b }) => { next[b.number] = printSelection[b.number] || 1; });
      setPrintSelection(next);
    }
  };

  const pageTitle = sectionFilter === "all"
    ? "الباركودات"
    : sectionFilter === "unassigned"
      ? "باركودات بدون قسم"
      : `باركودات ${sectionName(sectionFilter)}`;

  return (
    <div className="page">
      <PageHeader
        eyebrow="مرجع"
        title={pageTitle}
        subtitle="نظّم الباركودات حسب القسم وامسح بالكاميرا للتسجيل أو البحث السريع"
        action={
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="btn-ghost" onClick={() => setScanOpen(true)}><Camera size={15} /> مسح سريع</button>
            <button className={`btn-ghost ${selectMode ? "chip-active" : ""}`} onClick={toggleSelectMode}>
              <ListChecks size={15} /> {selectMode ? "إنهاء التحديد" : "تحديد للطباعة"}
            </button>
            <button className="btn-ghost" onClick={() => doPrint(false)}><Download size={15} /> طباعة الملصقات</button>
            <button className="btn-ghost" onClick={() => doPrint(true)}><Tags size={15} /> طباعة استكرات</button>
            {!readOnly && <button className="btn-primary" onClick={openAdd}><Plus size={16} /> إضافة باركود</button>}
          </div>
        }
      />

      <div className="toolbar">
        <div className="search-box">
          <Search size={16} />
          <input placeholder="ابحث بالاسم أو الرقم أو القسم…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <button type="button" className="search-cam-btn" title="بحث بالكاميرا" onClick={() => setSearchCameraOpen(true)}>
            <Camera size={15} />
          </button>
        </div>
      </div>

      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQuery(code); setSearchCameraOpen(false); }}
        />
      )}

      {branches.length > 0 && (
        <div className="filter-chips">
          <button className={`chip ${sectionFilter === "all" ? "chip-active" : ""}`} onClick={() => setSectionFilter("all")}>
            الكل
          </button>
          {branches.map((b) => (
            <button
              key={b.id}
              className={`chip ${sectionFilter === b.id ? "chip-active" : ""}`}
              onClick={() => setSectionFilter(b.id)}
            >
              {b.name}
            </button>
          ))}
          <button className={`chip ${sectionFilter === "unassigned" ? "chip-active" : ""}`} onClick={() => setSectionFilter("unassigned")}>
            بدون قسم
          </button>
        </div>
      )}

      {selectMode && (
        <div className="print-selection-bar">
          <label className="print-selectall-box">
            <input type="checkbox" checked={allVisibleSelected} onChange={toggleSelectAll} />
            تحديد الكل ({visible.length})
          </label>
          <span className="print-selection-sep" />
          <ListChecks size={15} />
          {printSelectionCount === 0
            ? "اضغط على أي باركود لتحديده للطباعة، وحدّد عدد النسخ لكل واحد"
            : `محدد: ${printSelectionCount} كود${printSelectionCount > 1 ? "" : ""} — إجمالي ${printCopiesTotal} نسخة للطباعة`}
          {printSelectionCount > 0 && (
            <button type="button" className="btn-ghost print-selection-clear" onClick={() => setPrintSelection({})}>
              <X size={13} /> مسح التحديد
            </button>
          )}
        </div>
      )}

      <div className="filter-chips">
        <button className={`chip ${addedFilter === "all" ? "chip-active" : ""}`} onClick={() => setAddedFilter("all")}>
          كل الباركودات
        </button>
        <button className={`chip ${addedFilter === "added" ? "chip-active" : ""}`} onClick={() => setAddedFilter("added")}>
          <PackageCheck size={13} style={{ marginInlineEnd: 4, verticalAlign: "-2px" }} /> المضافة فقط
        </button>
        <button className={`chip ${addedFilter === "unadded" ? "chip-active" : ""}`} onClick={() => setAddedFilter("unadded")}>
          غير المضافة فقط
        </button>
      </div>

      <div className="panel">
        {visible.length === 0 ? (
          <EmptyState
            icon={Barcode}
            title={query ? "لا توجد نتائج مطابقة للبحث" : "لا توجد باركودات في هذا القسم"}
            hint="أضف باركوداً جديداً أو امسح كوداً لتسجيله هنا مباشرة"
          />
        ) : (
          <div className="barcode-grid">
            {visible.map(({ b, idx }) => {
              const isSelected = printSelection[b.number] !== undefined;
              return (
                <div
                  className={`barcode-card ${flashIdx === idx ? "scan-flash" : ""} ${selectMode ? "barcode-card-selectable" : ""} ${isSelected ? "barcode-card-selected" : ""}`}
                  key={idx}
                  ref={(el) => { cardRefs.current[idx] = el; }}
                  onClick={selectMode ? () => togglePrintSelect(b.number, !isSelected) : undefined}
                >
                  {!selectMode && linkedCodes.has(b.number) && (
                    <div className="barcode-linked-badge" title="مضاف كصنف في قائمة الأغراض">
                      <PackageCheck size={11} /> مضاف
                    </div>
                  )}
                  {selectMode && (
                    <div className="barcode-select-box" onClick={(e) => e.stopPropagation()}>
                      <input
                        type="checkbox"
                        checked={isSelected}
                        onChange={(e) => togglePrintSelect(b.number, e.target.checked)}
                      />
                      {isSelected && (
                        <span className="barcode-select-count">
                          <button type="button" onClick={() => bumpPrintCount(b.number, -1)}><Minus size={11} /></button>
                          <input
                            type="number" min="1" max="300"
                            value={printSelection[b.number]}
                            onChange={(e) => setPrintCount(b.number, e.target.value)}
                          />
                          <button type="button" onClick={() => bumpPrintCount(b.number, 1)}><Plus size={11} /></button>
                        </span>
                      )}
                    </div>
                  )}
                  {b.image && <img className="barcode-thumb" src={b.image} alt={b.name || "صورة"} />}
                  <RealBarcode value={b.number} />
                  <div className="barcode-number">{b.number}</div>
                  <div className="barcode-name">{b.name}</div>
                  {b.branch && sectionFilter === "all" && (
                    <div className="barcode-section-tag">{sectionName(b.branch) || "—"}</div>
                  )}
                  {!readOnly && !selectMode && (
                    <div className="row-actions barcode-actions">
                      <button className="icon-btn" onClick={() => openEdit(b, idx)}><Pencil size={14} /></button>
                      <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(idx)}><Trash2 size={14} /></button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* شبكة مخفية على الشاشة، تظهر فقط أثناء الطباعة عند وجود تحديد
            (body.printing-selection) — تحتوي كل كود محدَّد مكرراً بعدد
            نسخه بدل قائمة الأكواد الظاهرة بالفلاتر الحالية */}
        <div className="barcode-grid print-selection-grid">
          {printItems.map(({ b, key }) => (
            <div className="barcode-card" key={key}>
              {b.image && <img className="barcode-thumb" src={b.image} alt={b.name || "صورة"} />}
              <RealBarcode value={b.number} />
              <div className="barcode-number">{b.number}</div>
              <div className="barcode-name">{b.name}</div>
            </div>
          ))}
        </div>
      </div>

      {modal && (
        <Modal title={modal.mode === "add" ? "إضافة باركود" : "تعديل الباركود"} onClose={() => setModal(null)}>
          <BarcodeForm
            row={modal.row}
            branches={branches}
            mode={modal.mode}
            currentIdx={modal.idx}
            existingBarcodes={data.barcodes}
            onCancel={() => setModal(null)}
            onSave={save}
          />
        </Modal>
      )}

      {confirmDelete !== null && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">هل تريد حذف هذا الباركود؟</p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}

      {scanOpen && <BarcodeCameraModal onDetect={handleScanDetect} onClose={() => setScanOpen(false)} />}
    </div>
  );
}

function BarcodeForm({ row, branches, mode, currentIdx, existingBarcodes, onCancel, onSave }) {
  const [form, setForm] = useState(row);
  const [cameraOpen, setCameraOpen] = useState(false);

  // بوضع "الإضافة" نكتفي باسم المنتج والقسم فقط، والرقم يتولّد تلقائياً
  // (10 أرقام عشوائية غير مكررة) دون الحاجة لمسحه أو كتابته يدوياً
  const isAutoNumber = mode === "add";

  // فحص مباشر (أثناء الكتابة) للتأكد إن الرقم المكتوب/الممسوح مو مستخدم
  // من قبل لكود آخر — يظهر تنبيه فوري ويمنع الحفظ لحين تصحيحه
  const list = existingBarcodes || [];
  const duplicate = list.find(
    (b, i) => b.number === (form.number || "").trim() && (mode !== "edit" || i !== currentIdx)
  );

  const handleCameraDetect = (value) => {
    setCameraOpen(false);
    setForm((f) => ({ ...f, number: value.trim() }));
  };

  const regenerate = () => {
    setForm((f) => ({ ...f, number: generateBarcodeNumber(existingBarcodes) }));
  };

  return (
    <>
    <div className="form-grid">
      <Field label="اسم المنتج">
        <input
          className="input"
          value={form.name}
          onChange={(e) => setForm({ ...form, name: e.target.value })}
          autoFocus
        />
      </Field>
      <Field label="القسم">
        <select className="input" value={form.branch || ""} onChange={(e) => setForm({ ...form, branch: e.target.value })}>
          <option value="">بدون قسم محدد</option>
          {(branches || []).map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
        </select>
      </Field>
      <Field label="صورة (اختياري)">
        <ImageUploadField value={form.image} onChange={(img) => setForm({ ...form, image: img })} />
        <div className="field-hint">لو رُبطت صورة هنا، ستظهر تلقائياً عند إضافة صنف بهذا الباركود لاحقاً</div>
      </Field>
      {isAutoNumber ? (
        <Field label={<span className="scan-label"><ScanLine size={13} /> الرقم <span className="scan-hint">تم توليده تلقائياً</span></span>}>
          <div className="scan-input-row">
            <input className="input mono scan-input" value={form.number} readOnly />
            <button type="button" className="icon-btn" title="توليد رقم جديد" onClick={regenerate}>
              <RefreshCw size={14} />
            </button>
          </div>
        </Field>
      ) : (
        <Field label={<span className="scan-label"><ScanLine size={13} /> الرقم <span className="scan-hint">جاهز للمسح</span></span>}>
          <div className="scan-input-row">
            <input
              className="input mono scan-input"
              value={form.number}
              onChange={(e) => setForm({ ...form, number: e.target.value.trim() })}
              placeholder="امسح الباركود أو اكتب الرقم يدوياً"
              autoComplete="off"
            />
            <ScanCameraButton onClick={() => setCameraOpen(true)} />
          </div>
          {duplicate && (
            <div className="scan-duplicate-warning">
              <Barcode size={12} /> هذا الرقم مستخدم مسبقاً لـ «{duplicate.name}»
            </div>
          )}
        </Field>
      )}
      <div className="modal-actions">
        <button className="btn-ghost" onClick={onCancel}>إلغاء</button>
        <button className="btn-primary" disabled={!!duplicate} onClick={() => onSave(form)}><Check size={15} /> حفظ</button>
      </div>
    </div>
    {cameraOpen && <BarcodeCameraModal onDetect={handleCameraDetect} onClose={() => setCameraOpen(false)} />}
    </>
  );
}

function GlobalSearch({ data, inventory, go, onPick, currentUser, isOwner }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);
  const [boxView, setBoxView] = useState(null); // صنف "صندوق" نعرض محتوياته بنافذة منبثقة من نتائج البحث العام مباشرة
  const myBranch = !isOwner && currentUser?.restrictedBranch;
  const scoped = myBranch ? inventory.filter((i) => i.branch === myBranch) : inventory;
  const results = q.length > 1
    ? scoped.filter((i) => fuzzyIncludes(i.name + i.code, q)).slice(0, 6)
    : [];
  const boxContents = boxView ? (data?.items || []).filter((i) => i.parentCode === boxView.code) : [];
  const balanceFor = (code) => inventory?.find((i) => i.code === code)?.balance ?? 0;

  return (
    <div className="global-search">
      <Search size={15} />
      <input
        placeholder="بحث عام بالكود أو الاسم…"
        value={q}
        onChange={(e) => { setQ(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
      />
      <button
        type="button"
        className="search-cam-btn"
        title="بحث بالكاميرا"
        onMouseDown={(e) => e.preventDefault()}
        onClick={() => setSearchCameraOpen(true)}
      >
        <Camera size={15} />
      </button>
      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQ(code); setOpen(true); setSearchCameraOpen(false); }}
        />
      )}
      {open && results.length > 0 && (
        <div className="global-results">
          {results.map((r) => (
            <div key={r.code} className="global-result-item">
              <button
                type="button"
                className="global-result-main"
                onMouseDown={() => { onPick ? onPick(r.code) : go("inventory"); setQ(""); setOpen(false); }}
              >
                <div>
                  <div className="cell-strong">
                    {r.emoji ? `${r.emoji} ` : ""}{r.name}
                    {r.isContainer && <span className="box-badge">📦 صندوق</span>}
                  </div>
                  <CodeTag code={r.code} />
                </div>
                <StampBadge status={r.status} />
              </button>
              {r.isContainer && (
                <button
                  type="button"
                  className="icon-btn"
                  title="فتح الصندوق ومشاهدة المحتويات"
                  onMouseDown={(e) => { e.preventDefault(); setBoxView(r); setOpen(false); }}
                >
                  <Boxes size={15} />
                </button>
              )}
            </div>
          ))}
        </div>
      )}

      {boxView && (
        <Modal
          title={`📦 محتويات «${boxView.name}»`}
          onClose={() => { setBoxView(null); setQ(""); }}
        >
          {boxContents.length === 0 ? (
            <EmptyState icon={Boxes} title="الصندوق فاضي" hint="ما فيه أي منتج مضاف داخل هذا الصندوق حتى الآن" />
          ) : (
            <div className="box-contents-list">
              {boxContents.map((c) => (
                <div className="box-contents-row" key={c.code}>
                  <div>
                    <div className="cell-strong">{c.emoji ? `${c.emoji} ` : ""}{c.name}</div>
                    <div className="cell-muted" style={{ fontSize: 12 }}>{c.code} · الرصيد: {balanceFor(c.code)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
          <div className="modal-actions">
            <button
              className="btn-ghost"
              onClick={() => {
                setBoxView(null); setQ("");
                onPick ? onPick(boxView.code) : go("inventory");
              }}
            >
              فتح الصندوق بصفحة المخزون
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

const NAV = [
  { key: "dashboard", label: "لوحة التحكم", icon: LayoutGrid },
  { key: "tasks", label: "المهام", icon: ClipboardList },
  { key: "items", label: "قائمة الأغراض", icon: Package },
  { key: "activities", label: "الأنشطة المؤقتة", icon: Briefcase },
  { key: "inventory", label: "المخزون", icon: Boxes },
  { key: "barcodes", label: "الباركودات", icon: Barcode },
  { key: "audit", label: "سجل النشاط", icon: Hash },
  { key: "reports", label: "التقارير والإحصائيات", icon: BarChart3 },
  { key: "owners", label: "الرؤساء", icon: ShieldAlert, ownerOnly: true },
  { key: "users", label: "المستخدمون", icon: Users, ownerOnly: true },
  { key: "groups", label: "المجموعات", icon: Layers, ownerOnly: true },
  { key: "branches", label: "الأقسام", icon: MapPin, ownerOnly: true },
  { key: "locations", label: "المواقع", icon: Locate, ownerOnly: true },
];

// صلاحيات إضافية ليست صفحات بحد ذاتها (لا تظهر بالقائمة الجانبية) لكن تُمنح
// وتُمنع بنفس طريقة صفحات NAV — مثل ربط الجوال كقارئ باركود لاسلكي.
const EXTRA_PERMISSIONS = [
  { key: "scannerPairing", label: "ربط الجوال (قارئ باركود لاسلكي)", icon: Smartphone },
];

// الصفحات التي يقدر رئيس الموقع يتيحها أو يمنعها لكل مستخدم (متحكم) على حدة.
// لوحة التحكم دائماً متاحة للجميع كصفحة أساسية، وباقي صفحات الإدارة
// (الرؤساء/المستخدمون/المجموعات/الأقسام) تبقى حصراً على رئيس الموقع دائماً.
const GRANTABLE_PAGES = [...NAV.filter((n) => !n.ownerOnly && n.key !== "dashboard"), ...EXTRA_PERMISSIONS];

// الصفحات التي يقدر الرئيس صاحب التحكم الكامل يتيحها أو يمنعها لرئيس آخر
// "بصلاحيات محددة" — تشمل كل الصفحات (حتى صفحات الإدارة) عدا لوحة التحكم
// التي تبقى متاحة للجميع دائماً.
const OWNER_GRANTABLE_PAGES = [...NAV.filter((n) => n.key !== "dashboard"), ...EXTRA_PERMISSIONS];

/* ------------------------------------------------------------------ */
/*  OWNERS PAGE (إدارة رؤساء الموقع — كل رئيس باسم إجباري وكلمة مرور خاصة) */
/* ------------------------------------------------------------------ */

function OwnersPage({ data, setData, notify, currentOwnerId }) {
  const [modal, setModal] = useState(null); // { mode, owner }
  const [confirmDelete, setConfirmDelete] = useState(null);
  const owners = data.owners || [];

  const openAdd = () => setModal({ mode: "add", owner: { name: "", password: randomPassword(), permissions: null, recoveryQuestion: "", recoveryAnswer: "" } });
  const openEdit = (o) => setModal({ mode: "edit", owner: { ...o } });

  const save = (form) => {
    const name = form.name.trim();
    if (!name || !form.password.trim()) {
      notify("اسم الرئيس وكلمة المرور مطلوبان", "error");
      return;
    }
    const dup = owners.some((o) => o.name === name && o.id !== form.id);
    if (dup) { notify("هذا الاسم مستخدم لرئيس آخر بالفعل", "error"); return; }

    const recoveryQuestion = (form.recoveryQuestion || "").trim();
    const recoveryAnswer = (form.recoveryAnswer || "").trim();
    if ((recoveryQuestion && !recoveryAnswer) || (!recoveryQuestion && recoveryAnswer)) {
      notify("لاستخدام استرداد كلمة المرور، أدخل السؤال والإجابة معاً", "error");
      return;
    }

    const willBeRestricted = Array.isArray(form.permissions);
    if (willBeRestricted) {
      const otherFullOwners = owners.filter((o) => o.id !== form.id && !o.permissions).length;
      if (otherFullOwners === 0) {
        notify("لازم يبقى رئيس واحد على الأقل بتحكم كامل قبل تقييد صلاحيات البقية", "error");
        return;
      }
    }

    const record = {
      id: form.id || genId("owner"), name, password: form.password.trim(),
      permissions: willBeRestricted ? OWNER_GRANTABLE_PAGES.map((p) => p.key).filter((k) => form.permissions.includes(k)) : null,
      recoveryQuestion, recoveryAnswer,
    };
    const exists = owners.some((o) => o.id === record.id);
    const merged = exists ? { ...owners.find((o) => o.id === record.id), ...record } : record;
    const next = exists ? owners.map((o) => (o.id === merged.id ? merged : o)) : [...owners, merged];
    setData({ ...data, owners: next });
    setModal(null);
    notify(exists ? "تم تحديث بيانات الرئيس" : "تمت إضافة رئيس جديد");
  };

  const remove = (id) => {
    if (owners.length <= 1) {
      notify("لازم يبقى رئيس واحد على الأقل — أضف رئيساً آخر قبل حذف هذا", "error");
      setConfirmDelete(null);
      return;
    }
    const target = owners.find((o) => o.id === id);
    const remainingFullOwners = owners.filter((o) => o.id !== id && !o.permissions).length;
    if (!target?.permissions && remainingFullOwners === 0) {
      notify("لازم يبقى رئيس واحد على الأقل بتحكم كامل — عدّل صلاحيات رئيس آخر لتحكم كامل قبل حذف هذا", "error");
      setConfirmDelete(null);
      return;
    }
    setData({ ...data, owners: owners.filter((o) => o.id !== id) });
    setConfirmDelete(null);
    notify("تم حذف الرئيس");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="إدارة الوصول" title="الرؤساء" subtitle="كل رئيس موقع له اسم إجباري وكلمة مرور خاصة به — تحكم كامل افتراضياً، أو صلاحيات محددة إن اخترت ذلك"
        action={<button className="btn-primary" onClick={openAdd}><Plus size={16} /> إضافة رئيس</button>}
      />
      <div className="panel">
        {owners.length === 0 ? (
          <EmptyState icon={ShieldAlert} title="لا يوجد رؤساء بعد" hint="أضف رئيساً باسم وكلمة مرور خاصة به" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead><tr><th>الاسم</th><th>الصلاحيات</th><th>كلمة المرور</th><th></th></tr></thead>
              <tbody>
                {owners.map((o) => (
                  <tr key={o.id}>
                    <td className="cell-strong">
                      {o.name}
                      {o.id === currentOwnerId && <span className="stamp-badge" style={{ marginRight: 8, color: "var(--green)", borderColor: "var(--green)", background: "var(--green-bg)" }}>أنت</span>}
                    </td>
                    <td>
                      {!o.permissions ? (
                        <span className="stamp-badge" style={{ color: "var(--green)", borderColor: "var(--green)", background: "var(--green-bg)" }}>تحكم كامل</span>
                      ) : o.permissions.length === 0 ? (
                        <span className="stamp-badge" style={{ color: "var(--red)", borderColor: "var(--red)", background: "var(--red-bg)" }}>بدون صفحات</span>
                      ) : (
                        <span className="stamp-badge" style={{ color: "var(--amber)", borderColor: "var(--amber)", background: "var(--amber-bg)" }}>
                          {o.permissions.length} من {OWNER_GRANTABLE_PAGES.length}
                        </span>
                      )}
                    </td>
                    <td className="cell-mono">{o.password}</td>
                    <td>
                      <div className="row-actions">
                        <button className="icon-btn" onClick={() => openEdit(o)}><Pencil size={15} /></button>
                        <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(o)}><Trash2 size={15} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <Modal wide title={modal.mode === "add" ? "إضافة رئيس" : "تعديل الرئيس"} onClose={() => setModal(null)}>
          <OwnerForm owner={modal.owner} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">هل تريد حذف الرئيس «{confirmDelete.name}»؟ لن يتمكن من الدخول بعدها.</p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete.id)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function OwnerForm({ owner, onCancel, onSave }) {
  const [form, setForm] = useState(owner);
  const [showPass, setShowPass] = useState(false);
  const restricted = Array.isArray(form.permissions);

  return (
    <div className="form-grid">
      <Field label="اسم الرئيس">
        <input className="input" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="مثال: حسن" />
      </Field>
      <Field label="كلمة المرور">
        <div className="scan-input-row">
          <input
            type={showPass ? "text" : "password"} className="input mono scan-input"
            value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })}
          />
          <button type="button" className="scan-camera-btn" onClick={() => setShowPass((v) => !v)} title="إظهار/إخفاء">
            {showPass ? <EyeOff size={15} /> : <Eye size={15} />}
          </button>
          <button type="button" className="scan-camera-btn" onClick={() => setForm({ ...form, password: randomPassword() })} title="توليد كلمة مرور">
            <Shuffle size={15} />
          </button>
        </div>
      </Field>
      <div className="modal-section-divider">استرداد كلمة المرور (اختياري) — يقدر أي رئيس بتحكم كامل يضبطه من هنا حتى لو الرئيس نفسه نسى كلمة مروره</div>
      <Field label="سؤال استرداد — يُستخدم لو نسي هذا الرئيس كلمة مروره لاحقاً">
        <input className="input" value={form.recoveryQuestion || ""} onChange={(e) => setForm({ ...form, recoveryQuestion: e.target.value })} placeholder="مثال: ما اسم أول موقع عملت فيه؟" />
      </Field>
      <Field label="الإجابة">
        <input className="input" value={form.recoveryAnswer || ""} onChange={(e) => setForm({ ...form, recoveryAnswer: e.target.value })} placeholder="الإجابة" />
      </Field>
      <Field label="نوع الصلاحية" full>
        <div className="login-choices" style={{ gap: 6 }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
            <input type="radio" checked={!restricted} onChange={() => setForm({ ...form, permissions: null })} /> تحكم كامل — يشوف كل الصفحات ويقدر يدير الرؤساء والمستخدمين
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
            <input
              type="radio" checked={restricted}
              onChange={() => setForm({ ...form, permissions: Array.isArray(form.permissions) ? form.permissions : OWNER_GRANTABLE_PAGES.map((p) => p.key) })}
            /> صلاحيات محددة — حدد بنفسك أي صفحات يشوفها
          </label>
        </div>
      </Field>
      {restricted && (
        <Field label="الصفحات المتاحة لهذا الرئيس" full>
          <div className="perm-toolbar">
            <button type="button" className="perm-toolbar-btn" onClick={() => setForm({ ...form, permissions: OWNER_GRANTABLE_PAGES.map((p) => p.key) })}>تحديد الكل</button>
            <button type="button" className="perm-toolbar-btn" onClick={() => setForm({ ...form, permissions: [] })}>إلغاء الكل</button>
          </div>
          <div className="perm-grid">
            {OWNER_GRANTABLE_PAGES.map((p) => {
              const checked = (form.permissions || []).includes(p.key);
              return (
                <label key={p.key} className={`perm-check ${checked ? "perm-check-active" : ""}`}>
                  <input
                    type="checkbox" checked={checked}
                    onChange={() => setForm({
                      ...form,
                      permissions: checked
                        ? (form.permissions || []).filter((k) => k !== p.key)
                        : [...(form.permissions || []), p.key],
                    })}
                  />
                  <p.icon size={14} />
                  <span>{p.label}</span>
                </label>
              );
            })}
          </div>
        </Field>
      )}
      <div className="modal-actions">
        <button className="btn-ghost" onClick={onCancel}>إلغاء</button>
        <button className="btn-primary" onClick={() => onSave(form)}><Check size={15} /> حفظ</button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  USERS PAGE (site owner only)                                      */
/* ------------------------------------------------------------------ */

const TEMP_DURATIONS = [
  { key: "1d", label: "يوم واحد", ms: 24 * 3600 * 1000 },
  { key: "3d", label: "3 أيام", ms: 3 * 24 * 3600 * 1000 },
  { key: "7d", label: "7 أيام", ms: 7 * 24 * 3600 * 1000 },
  { key: "30d", label: "30 يوماً", ms: 30 * 24 * 3600 * 1000 },
];

function randomPassword() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  return Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
}

function UsersPage({ data, setData, notify }) {
  const [modal, setModal] = useState(null); // { mode, user }
  const [confirmDelete, setConfirmDelete] = useState(null);

  const openAdd = () => setModal({ mode: "add", user: { username: "", name: "", password: randomPassword(), canEdit: true, temp: false, durationKey: "1d", permissions: GRANTABLE_PAGES.map((p) => p.key) } });
  const openEdit = (u) => setModal({ mode: "edit", user: { ...u, temp: !!u.tempUntil, durationKey: "1d", permissions: u.permissions || GRANTABLE_PAGES.map((p) => p.key) } });

  const save = (form) => {
    const username = form.username.trim();
    if (!username || !form.password.trim()) {
      notify("اسم المستخدم وكلمة المرور مطلوبان", "error");
      return;
    }
    const dup = data.users.some((u) => u.username === username && u.id !== form.id);
    if (dup) { notify("اسم المستخدم مستخدم بالفعل", "error"); return; }

    const tempUntil = form.temp
      ? new Date(Date.now() + (TEMP_DURATIONS.find((d) => d.key === form.durationKey)?.ms || 0)).toISOString()
      : null;

    const record = {
      id: form.id || genId("user"),
      username,
      name: (form.name || "").trim(),
      password: form.password.trim(),
      canEdit: !!form.canEdit,
      restrictedBranch: form.restrictedBranch || "",
      permissions: GRANTABLE_PAGES.map((p) => p.key).filter((k) => (form.permissions || []).includes(k)),
      tempUntil,
      createdAt: form.createdAt || Date.now(),
    };

    const exists = data.users.some((u) => u.id === record.id);
    const users = exists ? data.users.map((u) => (u.id === record.id ? record : u)) : [...data.users, record];
    setData({ ...data, users });
    setModal(null);
    notify(exists ? "تم تحديث بيانات المستخدم" : "تمت إضافة المستخدم");
  };

  const remove = (id) => {
    setData({ ...data, users: data.users.filter((u) => u.id !== id) });
    setConfirmDelete(null);
    notify("تم حذف المستخدم");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="إدارة الوصول" title="المستخدمون" subtitle="حسابات دخول بكلمة مرور دائمة أو مؤقتة، مع تحديد هل يقدر يعدّل أو للقراءة فقط"
        action={<button className="btn-primary" onClick={openAdd}><Plus size={16} /> إضافة مستخدم</button>}
      />
      <div className="panel">
        {data.users.length === 0 ? (
          <EmptyState icon={Users} title="لا يوجد مستخدمون بعد" hint="أضف مستخدماً بكلمة مرور دائمة أو مؤقتة" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr><th>الاسم الحقيقي</th><th>اسم المستخدم</th><th>الصلاحية</th><th>القسم</th><th>الصفحات المتاحة</th><th>كلمة المرور</th><th>المدة</th><th></th></tr>
              </thead>
              <tbody>
                {data.users.map((u) => {
                  const expired = isTempExpired(u);
                  return (
                    <tr key={u.id}>
                      <td className="cell-strong">{u.name || "—"}</td>
                      <td className="cell-strong">{u.username}</td>
                      <td>
                        <span className="stamp-badge" style={u.canEdit
                          ? { color: "var(--green)", borderColor: "var(--green)", background: "var(--green-bg)" }
                          : { color: "#5B6570", borderColor: "#5B6570", background: "#EEE9DA" }}>
                          {u.canEdit ? "يقدر يعدّل" : "قراءة فقط"}
                        </span>
                      </td>
                      <td className="cell-strong">{u.restrictedBranch ? (data.branches.find((b) => b.id === u.restrictedBranch)?.name || "—") : "كل الأقسام"}</td>
                      <td>
                        {!u.permissions || u.permissions.length === GRANTABLE_PAGES.length ? (
                          <span className="stamp-badge" style={{ color: "var(--green)", borderColor: "var(--green)", background: "var(--green-bg)" }}>كل الصفحات</span>
                        ) : u.permissions.length === 0 ? (
                          <span className="stamp-badge" style={{ color: "var(--red)", borderColor: "var(--red)", background: "var(--red-bg)" }}>بدون صفحات</span>
                        ) : (
                          <span className="stamp-badge" style={{ color: "var(--amber)", borderColor: "var(--amber)", background: "var(--amber-bg)" }}>
                            {u.permissions.length} من {GRANTABLE_PAGES.length}
                          </span>
                        )}
                      </td>
                      <td className="cell-mono">{u.password}</td>
                      <td>
                        {u.tempUntil ? (
                          <span className="stamp-badge" style={{
                            color: expired ? "var(--red)" : "var(--amber)",
                            borderColor: expired ? "var(--red)" : "var(--amber)",
                            background: expired ? "var(--red-bg)" : "var(--amber-bg)",
                          }}>
                            <KeyRound size={11} style={{ marginLeft: 3, verticalAlign: "-1px" }} />
                            {expired ? "منتهية" : `مؤقتة حتى ${new Date(u.tempUntil).toLocaleString("ar-SA-u-nu-latn")}`}
                          </span>
                        ) : (
                          <span className="stamp-badge" style={{ color: "var(--green)", borderColor: "var(--green)", background: "var(--green-bg)" }}>دائمة</span>
                        )}
                      </td>
                      <td>
                        <div className="row-actions">
                          <button className="icon-btn" onClick={() => openEdit(u)}><Pencil size={15} /></button>
                          <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(u)}><Trash2 size={15} /></button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <Modal wide title={modal.mode === "add" ? "إضافة مستخدم" : "تعديل المستخدم"} onClose={() => setModal(null)}>
          <UserForm user={modal.user} branches={data.branches} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">هل تريد حذف المستخدم «{confirmDelete.username}»؟ لن يتمكن من الدخول بعدها.</p>
          <div className="modal-actions">

}

function GroupsPage({ data, setData, notify }) {
  const [modal, setModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const countFor = (id) => data.items.filter((i) => i.group === id).length;

  const openAdd = () => setModal({ mode: "add", group: { name: "" } });
  const openEdit = (g) => setModal({ mode: "edit", group: { ...g } });

  const save = (form) => {
    if (!form.name.trim()) { notify("اسم المجموعة مطلوب", "error"); return; }
    const record = { id: form.id || genId("grp"), name: form.name.trim() };
    const exists = data.itemGroups.some((g) => g.id === record.id);
    const itemGroups = exists ? data.itemGroups.map((g) => (g.id === record.id ? record : g)) : [...data.itemGroups, record];
    setData({ ...data, itemGroups });
    setModal(null);
    notify(exists ? "تم تحديث المجموعة" : "تمت إضافة المجموعة");
  };

  const remove = (id) => {
    // الأصناف المرتبطة بهذه المجموعة تبقى بدون مجموعة بدل ما تُحذف
    const items = data.items.map((i) => (i.group === id ? { ...i, group: "" } : i));
    setData({ ...data, itemGroups: data.itemGroups.filter((g) => g.id !== id), items });
    setConfirmDelete(null);
    notify("تم حذف المجموعة");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="تصنيف الأصناف" title="المجموعات" subtitle="نوع الصنف — مثل بلاستيك، صحون، ورقيات — يسهّل التصفية والتنظيم"
        action={<button className="btn-primary" onClick={openAdd}><Plus size={16} /> إضافة مجموعة</button>}
      />
      <div className="panel">
        {data.itemGroups.length === 0 ? (
          <EmptyState icon={Layers} title="لا توجد مجموعات بعد" hint="أضف مجموعة مثل «بلاستيك» أو «صحون» لتصنيف الأصناف عليها" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead><tr><th>اسم المجموعة</th><th>عدد الأصناف</th><th></th></tr></thead>
              <tbody>
                {data.itemGroups.map((g) => (
                  <tr key={g.id}>
                    <td className="cell-strong">{suggestEmojiForGroup(g.name) ? `${suggestEmojiForGroup(g.name)} ` : ""}{g.name}</td>
                    <td className="cell-mono">{countFor(g.id)}</td>
                    <td>
                      <div className="row-actions">
                        <button className="icon-btn" onClick={() => openEdit(g)}><Pencil size={15} /></button>
                        <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(g)}><Trash2 size={15} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <Modal title={modal.mode === "add" ? "إضافة مجموعة" : "تعديل المجموعة"} onClose={() => setModal(null)}>
          <GroupForm group={modal.group} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">هل تريد حذف مجموعة «{confirmDelete.name}»؟ الأصناف المرتبطة بها تبقى موجودة بدون مجموعة.</p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete.id)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  LOCATIONS PAGE (site owner only) — سجلّ رسمي لمواقع الأصناف داخل     */
/*  الأقسام (مثل "الرف الأول")، بدل ما كانت مجرد نص حر يُكتب يدوياً.      */
/*  المواقع تُطابق أصناف "الموقع" بالاسم (وليس بمعرّف) حتى تبقى متوافقة   */
/*  مع كل البيانات القديمة المحفوظة قبل إضافة هذه الصفحة.                */
/* ------------------------------------------------------------------ */

function LocationsPage({ data, setData, notify }) {
  const [modal, setModal] = useState(null); // { mode: 'add'|'edit', location: { id?, name, branch }, originalName? }
  const [confirmDelete, setConfirmDelete] = useState(null);
  // بعد تعديل الاسم: نسأل المستخدم صراحة هل يريد تحديث اسم الموقع بكل
  // المنتجات المسجلة عليه بالاسم القديم أم يترك المنتجات كما هي
  const [renamePrompt, setRenamePrompt] = useState(null); // { oldName, newName, count }
  // فلتر القسم بالجدول فقط (لا يغيّر البيانات نفسها) — يساعد لو عدد
  // المواقع كبير ومقسّمة على أقسام كثيرة
  const [branchFilter, setBranchFilter] = useState("all");

  const branches = data.branches || [];
  const registeredLocations = data.locations || [];
  // أي "موقع" مستخدم فعلياً بصنف من الأصناف لكنه غير مسجّل رسمياً بقائمة
  // المواقع (مثلاً بيانات قديمة، أو استيراد CSV يحط قيمة نصية مباشرة بدون
  // تسجيلها هنا) — نضيفه كسطر "غير مسجّل" حتى يظهر بهذي الصفحة أيضاً، ويقدر
  // رئيس الموقع يعدّله (يحدد له قسماً) فيتسجّل رسمياً بقائمة المواقع فوراً
  const registeredNames = new Set(registeredLocations.map((l) => l.name));
  const unregisteredNames = [...new Set(
    (data.items || []).map((i) => i.category).filter((c) => c && !registeredNames.has(c))
  )];
  const allLocations = [
    ...registeredLocations,
    ...unregisteredNames.map((name) => ({ id: `unregistered:${name}`, name, branch: "", unregistered: true })),
  ];
  const locations = branchFilter === "all" ? allLocations : allLocations.filter((l) => (l.branch || "") === branchFilter);
  const countFor = (name) => data.items.filter((i) => i.category === name).length;
  const branchName = (id) => branches.find((b) => b.id === id)?.name || "";

  const openAdd = () => setModal({ mode: "add", location: { name: "", branch: branchFilter !== "all" ? branchFilter : "" } });
  const openEdit = (loc) => setModal({ mode: "edit", location: { branch: "", ...loc, id: loc.unregistered ? undefined : loc.id }, originalName: loc.name });

  const save = (form, originalName) => {
    const name = form.name.trim();
    if (!name) { notify("اسم الموقع مطلوب", "error"); return; }
    const duplicate = registeredLocations.some((l) => l.name === name && l.id !== form.id);
    if (duplicate) { notify("يوجد موقع آخر بنفس هذا الاسم مسبقاً", "error"); return; }

    const record = { id: form.id || genId("loc"), name, branch: form.branch || "" };
    const exists = registeredLocations.some((l) => l.id === record.id);
    const nextLocations = exists ? registeredLocations.map((l) => (l.id === record.id ? record : l)) : [...registeredLocations, record];
    setData({ ...data, locations: nextLocations });
    setModal(null);

    if (exists && originalName && originalName !== name) {
      const count = countFor(originalName);
      if (count > 0) {
        // نعرض السؤال بعد الحفظ مباشرة بدل ما نغيّر أسماء المنتجات صمتاً
        setRenamePrompt({ oldName: originalName, newName: name, count });
        return;
      }
    }
    notify(exists ? "تم تحديث الموقع" : "تمت إضافة الموقع");
  };

  const applyRenameToItems = () => {
    if (!renamePrompt) return;
    const { oldName, newName } = renamePrompt;
    const items = data.items.map((i) => (i.category === oldName ? { ...i, category: newName } : i));
    setData({ ...data, items });
    notify(`تم تحديث اسم الموقع في ${renamePrompt.count} منتج`);
    setRenamePrompt(null);
  };

  const remove = (loc) => {
    // الأصناف المرتبطة بهذا الموقع تبقى موجودة، فقط يُفرغ حقل "الموقع" لديها
    const items = data.items.map((i) => (i.category === loc.name ? { ...i, category: "" } : i));
    setData({ ...data, locations: registeredLocations.filter((l) => l.id !== loc.id), items });
    setConfirmDelete(null);
    notify("تم حذف الموقع");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="مواقع الأصناف" title="المواقع" subtitle="سجّل مواقع دقيقة داخل كل قسم (مثل «الرف الأول») لتظهر كقائمة منسدلة عند إضافة أي غرض من نفس القسم فقط"
        action={<button className="btn-primary" onClick={openAdd}><Plus size={16} /> إضافة موقع</button>}
      />
      {branches.length > 0 && allLocations.length > 0 && (
        <div className="toolbar">
          <select className="input location-select" value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)}>
            <option value="all">كل الأقسام</option>
            <option value="">عام (بدون قسم محدد)</option>
            {branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
          </select>
        </div>
      )}
      <div className="panel">
        {locations.length === 0 ? (
          <EmptyState icon={Locate} title="لا توجد مواقع مسجّلة بعد" hint="أضف موقعاً مثل «الرف الأول» أو «الدولاب البني 1» ليظهر كخيار جاهز عند إضافة أي غرض" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead><tr><th>اسم الموقع</th><th>القسم</th><th>عدد الأصناف</th><th></th></tr></thead>
              <tbody>
                {locations.map((l) => (
                  <tr key={l.id}>
                    <td className="cell-strong">
                      <Locate size={13} style={{ marginLeft: 4, verticalAlign: "-2px" }} />{l.name}
                      {l.unregistered && <span className="box-badge" title="مستخدم بصنف لكنه غير مسجّل رسمياً بهذي القائمة">غير مسجّل رسمياً</span>}
                    </td>
                    <td className={l.branch ? "" : "cell-muted"}>{l.branch ? branchName(l.branch) : "عام لكل الأقسام"}</td>
                    <td className="cell-mono">{countFor(l.name)}</td>
                    <td>
                      <div className="row-actions">
                        <button className="icon-btn" title={l.unregistered ? "تسجيل رسمي" : "تعديل"} onClick={() => openEdit(l)}><Pencil size={15} /></button>
                        <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(l)}><Trash2 size={15} /></button>
                      </div>
                    </td>
                  </tr>

          <div className="modal-actions">

  );

/*  LOCATION PICKER — قائمة منسدلة بالمواقع المسجّلة صفحة "المواقع"،     */
/*  مع خيار إضافة موقع جديد بسرعة من داخل أي نموذج (إضافة/تعديل غرض،     */
/*  أو تسجيل داخل/خارج سريع) دون الحاجة للخروج والذهاب لصفحة المواقع.    */
/* ------------------------------------------------------------------ */

function LocationPicker({ locations, value, onChange, onCreateLocation, branch }) {
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState("");
  // كل قسم له مواقعه الخاصة فقط: لو النموذج فيه قسم مختار نعرض فقط مواقع
  // هذا القسم + المواقع "العامة" (بدون قسم محدد لها، غالباً بيانات قديمة).
  // لو ما فيه قسم مختار بعد، نعرض كل المواقع حتى لا نخفي شيء بصمت
  const list = (locations || []).filter((l) => !branch || !l.branch || l.branch === branch);
  const isRegistered = !value || list.some((l) => l.name === value);

  const commitNew = () => {
    const name = draft.trim();
    if (!name) { setAdding(false); return; }
    onCreateLocation(name, branch || "");
    onChange(name);
    setAdding(false);
    setDraft("");
  };

  return (
    <>
      <select
        className="input"
        value={adding ? "__new__" : (value || "")}
        onChange={(e) => {
          if (e.target.value === "__new__") { setAdding(true); setDraft(""); return; }
          setAdding(false);
          onChange(e.target.value);
        }}
      >
        <option value="">بدون موقع محدد</option>
        {list.map((l) => <option key={l.id} value={l.name}>{l.name}</option>)}
        {value && !isRegistered && <option value={value}>{value} (غير مسجّل بقائمة المواقع)</option>}
        <option value="__new__">+ إضافة موقع جديد…</option>
      </select>
      {adding && (
        <div className="scan-input-row" style={{ marginTop: 8 }}>
          <input
            autoFocus className="input" value={draft} onChange={(e) => setDraft(e.target.value)}
            placeholder="اسم الموقع الجديد"
            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); commitNew(); } }}
          />
          <button type="button" className="btn-ghost" onClick={commitNew}><Check size={15} /> إضافة</button>
        </div>
      )}
    </>
  );
}

function ChangeOwnerPasswordModal({ owner, onSave, onClose, notify }) {
  const [oldPass, setOldPass] = useState("");
  const [newPass, setNewPass] = useState("");
  const [newPass2, setNewPass2] = useState("");
  const [recoveryQuestion, setRecoveryQuestion] = useState(owner?.recoveryQuestion || "");
  const [recoveryAnswer, setRecoveryAnswer] = useState(owner?.recoveryAnswer || "");

  const submit = () => {
    if (oldPass !== owner?.password) { notify("كلمة المرور الحالية غير صحيحة", "error"); return; }
    if (!newPass.trim() || newPass.length < 4) { notify("كلمة المرور الجديدة قصيرة جداً", "error"); return; }
    if (newPass !== newPass2) { notify("كلمتا المرور الجديدتان غير متطابقتين", "error"); return; }
    if ((recoveryQuestion.trim() && !recoveryAnswer.trim()) || (!recoveryQuestion.trim() && recoveryAnswer.trim())) {
      notify("لاستخدام استرداد كلمة المرور، أدخل السؤال والإجابة معاً", "error");
      return;
    }
    onSave({ password: newPass, recoveryQuestion: recoveryQuestion.trim(), recoveryAnswer: recoveryAnswer.trim() });
    onClose();
  };

  return (
    <Modal title={`تغيير كلمة مرور ${owner?.name || "رئيس الموقع"}`} onClose={onClose}>
      <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
        <Field label="كلمة المرور الحالية">
          <input type="password" className="input" value={oldPass} onChange={(e) => setOldPass(e.target.value)} />
        </Field>
        <Field label="كلمة المرور الجديدة">
          <input type="password" className="input" value={newPass} onChange={(e) => setNewPass(e.target.value)} />
        </Field>
        <Field label="تأكيد كلمة المرور الجديدة">
          <input type="password" className="input" value={newPass2} onChange={(e) => setNewPass2(e.target.value)} />
        </Field>
        <div className="modal-section-divider">استرداد كلمة المرور (اختياري)</div>
        <Field label="سؤال استرداد — يُستخدم لو نسيت كلمة المرور لاحقاً">
          <input className="input" value={recoveryQuestion} onChange={(e) => setRecoveryQuestion(e.target.value)} placeholder="مثال: ما اسم أول موقع عملت فيه؟" />
        </Field>
        <Field label="الإجابة">
          <input className="input" value={recoveryAnswer} onChange={(e) => setRecoveryAnswer(e.target.value)} placeholder="إجابتك" />
        </Field>
        <div className="modal-actions">
          <button className="btn-ghost" onClick={onClose}>إلغاء</button>
          <button className="btn-primary" onClick={submit}><Check size={15} /> حفظ</button>
        </div>
      </div>
    </Modal>
  );
}

function TasksPage({ data, setData, notify, isOwner, currentUser }) {
  const [showAdd, setShowAdd] = useState(false);
  const [filter, setFilter] = useState("pending"); // pending | done | all
  const [confirmDelete, setConfirmDelete] = useState(null);

  const tasks = data.tasks || [];
  const userName = (id) => (id === "all" ? "كل المنظمين" : data.users.find((u) => u.id === id)?.username || "مستخدم محذوف");

  // المنظم يشوف بس المهام المكلّف فيها (له شخصياً أو لكل المنظمين)؛
  // رئيس الموقع يشوف كل المهام لإدارتها ومتابعتها.
  const visibleTasks = isOwner
    ? tasks
    : tasks.filter((t) => t.assignedTo === "all" || t.assignedTo === currentUser?.id);

  const filtered = visibleTasks
    .filter((t) => (filter === "all" ? true : filter === "done" ? t.done : !t.done))
    .sort((a, b) => {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      const ad = a.dueDate || "9999", bd = b.dueDate || "9999";
      if (ad !== bd) return ad.localeCompare(bd);
      return (b.createdAt || "").localeCompare(a.createdAt || "");
    });

  const addTask = ({ text, assignedTo, dueDate }) => {
    const task = {
      id: genId("task"), text, assignedTo, dueDate,
      done: false, createdAt: new Date().toISOString(), createdBy: currentUser?.name || currentUser?.username || "رئيس الموقع",
      doneAt: null, doneBy: null,
    };
    setData({ ...data, tasks: [task, ...tasks] });
    setShowAdd(false);
    notify("تمت إضافة المهمة");
  };

  const toggleDone = (task) => {
    const done = !task.done;
    setData({
      ...data,
      tasks: tasks.map((t) => (t.id === task.id
        ? { ...t, done, doneAt: done ? new Date().toISOString() : null, doneBy: done ? (currentUser?.name || currentUser?.username || "رئيس الموقع") : null }
        : t)),
    });
    notify(done ? "تم تحديد المهمة كمنجزة" : "تم إرجاع المهمة كمعلّقة");
  };

  const removeTask = (id) => {
    setData({ ...data, tasks: tasks.filter((t) => t.id !== id) });
    setConfirmDelete(null);
    notify("تم حذف المهمة");
  };

  const isOverdue = (t) => !t.done && t.dueDate && t.dueDate < todayISO();

  return (
    <div className="page">
      <PageHeader
        eyebrow="متابعة"
        title="المهام"
        subtitle={isOwner ? "أنشئ مهام وكلّفها للمنظمين — يشوفونها فور دخولهم للموقع" : "المهام المكلّف بها — علّم عليها أول ما تخلّصها"}
        action={isOwner && (
          <button className="btn-primary" onClick={() => setShowAdd(true)}><Plus size={15} /> مهمة جديدة</button>
        )}
      />

      <div className="toolbar">
        <div className="filter-chips">
          <button className={`chip ${filter === "pending" ? "chip-active" : ""}`} onClick={() => setFilter("pending")}>معلّقة</button>
          <button className={`chip ${filter === "done" ? "chip-active" : ""}`} onClick={() => setFilter("done")}>منجزة</button>
          <button className={`chip ${filter === "all" ? "chip-active" : ""}`} onClick={() => setFilter("all")}>الكل</button>
        </div>
      </div>

      <div className="panel">
        {filtered.length === 0 ? (
          <EmptyState icon={ClipboardList} title={filter === "done" ? "ما فيه مهام منجزة بعد" : "ما فيه مهام معلّقة 🎉"} />
        ) : (
          <div className="task-list">
            {filtered.map((t) => (
              <div key={t.id} className={`task-row ${t.done ? "task-row-done" : ""}`}>
                <button className="task-check" onClick={() => toggleDone(t)} title={t.done ? "إرجاع كمعلّقة" : "تحديد كمنجزة"}>
                  <Check size={14} />
                </button>
                <div className="task-body">
                  <div className="task-text">{t.text}</div>
                  <div className="task-meta">
                    {isOwner && <span>{userName(t.assignedTo)}</span>}
                    {t.dueDate && (
                      <span className={isOverdue(t) ? "task-overdue" : ""}>
                        <Clock size={11} style={{ verticalAlign: "-1px" }} /> {fmtDate(t.dueDate)}
                      </span>
                    )}
                    {t.done && t.doneBy && <span>أنجزها {t.doneBy}</span>}
                  </div>
                </div>
                {isOwner && (
                  <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(t.id)} title="حذف">
                    <Trash2 size={15} />
                  </button>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      {showAdd && (
        <Modal title="مهمة جديدة" onClose={() => setShowAdd(false)}>
          <TaskForm users={data.users} onCancel={() => setShowAdd(false)} onSave={addTask} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p style={{ fontSize: 13, marginBottom: 16 }}>هل تريد حذف هذه المهمة؟</p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => removeTask(confirmDelete)}><Trash2 size={15} /> حذف</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// يصنّف رسالة الحدث لنوع مرئي (أيقونة + لون) بالاعتماد على كلمات مفتاحية
// شائعة بنصوص notify() بالموقع، بدون الحاجة لتعديل كل نقطة تستدعيها
function classifyAuditEvent(msg) {
  if (/حذف/.test(msg)) return { label: "حذف", tone: "red", Icon: Trash2 };
  if (/تسجيل دخول/.test(msg)) return { label: "دخول بضاعة", tone: "green", Icon: ArrowDownToLine };
  if (/تسجيل خروج/.test(msg)) return { label: "خروج بضاعة", tone: "red", Icon: ArrowUpFromLine };
  if (/استيراد/.test(msg)) return { label: "استيراد", tone: "amber", Icon: Download };
  if (/إضاف/.test(msg)) return { label: "إضافة", tone: "green", Icon: Plus };
  if (/كلمة مرور/.test(msg)) return { label: "أمان", tone: "navy", Icon: KeyRound };
  if (/الدخول بنجاح/.test(msg)) return { label: "دخول للنظام", tone: "navy", Icon: KeyRound };
  if (/مهمة/.test(msg)) return { label: "مهمة", tone: "navy", Icon: ClipboardList };
  if (/تحديث|حفظ التعديلات/.test(msg)) return { label: "تعديل", tone: "amber", Icon: Pencil };
  return { label: "أخرى", tone: "navy", Icon: Clock };
}

// وقت نسبي تقريبي ("قبل 5 دقائق") — يبسّط قراءة السجل بدون ما نفقد
// الوقت الدقيق (يبقى ظاهر كـ tooltip عند التمرير)
function timeAgoAr(ts) {
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff / 60000);
  if (min < 1) return "الآن";
  if (min < 60) return `قبل ${min} دقيقة`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `قبل ${hr} ساعة`;
  const day = Math.floor(hr / 24);
  return `قبل ${day} يوم`;
}

function AuditPage({ log, isOwner, currentUser }) {
  const [query, setQuery] = useState("");
  const [byFilter, setByFilter] = useState("all");
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);

  // منظم عادي يشوف نشاطه هو فقط؛ رئيس الموقع فقط يشوف سجل الجميع
  const visibleLog = useMemo(
    () => (isOwner ? log : log.filter((e) => e.by === (currentUser?.name || currentUser?.username || "مستخدم"))),
    [log, isOwner, currentUser]
  );

  const actors = useMemo(() => [...new Set(visibleLog.map((e) => e.by || "—"))], [visibleLog]);

  const filtered = visibleLog
    .filter((e) => byFilter === "all" || (e.by || "—") === byFilter)
    .filter((e) => fuzzyIncludes(e.msg + (e.by || ""), query));

  const rows = filtered.map((e) => ({ time: new Date(e.time).toLocaleString("ar-SA-u-nu-latn"), by: e.by || "—", event: e.msg }));

  return (
    <div className="page">
      <PageHeader
        eyebrow="تدقيق" title="سجل النشاط"
        subtitle={isOwner ? "كل العمليات على المستودع من أي جهاز أو منظم — محفوظة بشكل دائم" : "نشاطك أنت فقط على المستودع — محفوظ بشكل دائم"}
        action={rows.length > 0 && <button className="btn-ghost" onClick={() => downloadCSV("سجل_النشاط.csv", rows, ["time", "by", "event"])}><Download size={15} /> تصدير CSV</button>}
      />

      {visibleLog.length > 0 && (
        <div className="toolbar">
          <div className="search-box">
            <Search size={16} />
            <input placeholder="ابحث بالحدث أو الاسم…" value={query} onChange={(e) => setQuery(e.target.value)} />
            <button type="button" className="search-cam-btn" title="بحث بالكاميرا" onClick={() => setSearchCameraOpen(true)}>
              <Camera size={15} />
            </button>
          </div>
          <select className="input" style={{ maxWidth: 200 }} value={byFilter} onChange={(e) => setByFilter(e.target.value)}>
            <option value="all">كل المنظمين</option>
            {actors.map((a) => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>
      )}

      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQuery(code); setSearchCameraOpen(false); }}
        />
      )}

      <div className="panel">
        {visibleLog.length === 0 ? (
          <EmptyState icon={Clock} title="لا يوجد نشاط مسجّل بعد" hint={isOwner ? "سيظهر هنا كل إضافة أو تعديل أو حذف يقوم به أي منظم" : "سيظهر هنا كل إضافة أو تعديل أو حذف تقوم به أنت"} />
        ) : filtered.length === 0 ? (
          <EmptyState icon={Search} title="لا نتائج مطابقة" hint="جرّب كلمة بحث أو فلتر مختلف" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead><tr><th>النوع</th><th>الوقت</th><th>بواسطة</th><th>الحدث</th></tr></thead>
              <tbody>
                {filtered.map((e, i) => {
                  const c = classifyAuditEvent(e.msg);
                  return (
                    <tr key={i}>
                      <td>
                        <span className={`stamp-badge audit-tone-${c.tone}`}>
                          <c.Icon size={11} style={{ marginLeft: 3, verticalAlign: "-1px" }} />
                          {c.label}
                        </span>
                      </td>
                      <td className="cell-mono" title={new Date(e.time).toLocaleString("ar-SA-u-nu-latn")}>{timeAgoAr(e.time)}</td>
                      <td className="cell-strong">{e.by || "—"}</td>
                      <td className="cell-strong">{e.msg}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

const ROLE_KEY = "warehouse-role";

// نافذة استرداد كلمة المرور — تظهر داخل نافذة الدخول للتحكم
function ForgotPasswordPanel({ mode, data, ownerNameInput, onClose }) {
  const [answer, setAnswer] = useState("");
  const [revealed, setRevealed] = useState(false);
  const [err, setErr] = useState("");
  const owner = mode === "owner" ? (data.owners || []).find((o) => o.name === (ownerNameInput || "").trim()) : null;
  const hasQuestion = mode === "owner" && !!(owner?.recoveryQuestion || "").trim();

  const checkAnswer = (e) => {
    e.preventDefault();
    const correct = (owner?.recoveryAnswer || "").trim().toLowerCase();
    if (answer.trim().toLowerCase() === correct && correct !== "") {
      setRevealed(true);
      setErr("");
    } else {
      setErr("الإجابة غير صحيحة");
    }
  };

  return (
    <Modal title="نسيت كلمة المرور؟" onClose={onClose}>
      {mode === "user" ? (
        <p className="confirm-text">
          كلمات مرور المستخدمين يديرها رئيس الموقع من صفحة «المستخدمون» — تواصل معه لإعادة تعيين كلمة مرورك.
        </p>
      ) : mode === "owner" && !owner ? (
        <p className="confirm-text">
          اكتب اسم الرئيس أولاً بخانة "اسم الرئيس" أعلاه، ثم اضغط "نسيت كلمة المرور؟" مرة ثانية.
        </p>
      ) : !hasQuestion ? (
        <p className="confirm-text">
          لم يتم إعداد سؤال استرداد لكلمة مرور «{owner.name}» بعد. يمكن إعداده لاحقاً من «تغيير كلمة المرور»
          بعد الدخول. كلمة المرور الافتراضية عند أول تشغيل للموقع هي <strong>admin</strong> إن لم تُغيَّر بعد.
        </p>
      ) : revealed ? (
        <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
          <p className="confirm-text">كلمة مرور «{owner.name}» الحالية هي:</p>
          <div className="recovered-pass">{owner.password}</div>
          <p className="confirm-text" style={{ fontSize: 12.5 }}>يُفضّل تغييرها فور الدخول من «تغيير كلمة المرور».</p>
        </div>
      ) : (
        <form className="form-grid" style={{ gridTemplateColumns: "1fr" }} onSubmit={checkAnswer}>
          <Field label={owner.recoveryQuestion}>
            <input autoFocus className="input" value={answer} onChange={(e) => setAnswer(e.target.value)} placeholder="إجابتك" />
          </Field>
          {err && <div className="alert alert-error"><AlertTriangle size={15} /> {err}</div>}
          <div className="modal-actions">
            <button type="button" className="btn-ghost" onClick={onClose}>إلغاء</button>
            <button type="submit" className="btn-primary"><Check size={15} /> تحقّق</button>
          </div>
        </form>
      )}
    </Modal>
  );
}

// نافذة "الدخول للتحكم" — تظهر عند طلب المستخدم الانتقال من وضع العرض
// شاشة "لوحة معلومات مختصرة" لوضع العرض (قبل تسجيل الدخول) — أرقام إجمالية
// فقط بدون تفاصيل كل صنف، لرئيس الموقع اللي يفضّل ما يعرض تفاصيل المخزون
// للزوار لكنه يحب يظهر أرقام عامة.
function GuestDashboardSummary({ inventory }) {
  const total = inventory.length;
  const available = inventory.filter((i) => i.status === "available").length;
  const low = inventory.filter((i) => i.status === "low").length;
  const empty = inventory.filter((i) => i.status === "empty").length;
  const cards = [
    { label: "إجمالي الأصناف", value: total, tone: "navy" },
    { label: "متوفر", value: available, tone: "green" },
    { label: "ناقص", value: low, tone: "amber" },
    { label: "نافد", value: empty, tone: "red" },
  ];
  return (
    <div className="stat-grid">
      {cards.map((s) => (
        <div key={s.label} className={`stat-card tone-${s.tone}`}>
          <div className="stat-value">{s.value}</div>
          <div className="stat-label">{s.label}</div>
        </div>
      ))}
    </div>
  );
}
