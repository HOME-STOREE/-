  const setThemePref = (v) => { setThemePrefState(v); saveThemePref(v); };

  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = (e) => setSystemPrefersDark(e.matches);
    mq.addEventListener ? mq.addEventListener("change", onChange) : mq.addListener(onChange);
    return () => (mq.removeEventListener ? mq.removeEventListener("change", onChange) : mq.removeListener(onChange));
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", effectiveTheme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", effectiveTheme === "dark" ? "#171C22" : "#2B3B47");
  }, [effectiveTheme]);

  // القائمة الجانبية بالجوال (عبر أيقونة الخطوط الثلاثة): تُغلق تلقائياً
  // عند اختيار صفحة، أو الضغط خارجها، أو زر Escape — بدل شريط سفلي ثابت.
  useEffect(() => {
    if (!navOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setNavOpen(false); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [navOpen]);

  // اكتشاف الجوال عبر JS مباشرة (وليس فقط عبر @media) — بعض متصفحات
  // الأندرويد (خصوصاً متصفحات هواوي/الشركات الصينية عند فتح الملف مباشرة
  // بدون سيرفر) لا تُطبّق meta viewport بشكل صحيح فتفشل @media في العمل،
  // فيبقى الشريط الجانبي ظاهراً بعرضه الكامل وتخرج البطاقات عن الشاشة.
  // هذا احتياط إضافي يجبر وضع الجوال بناءً على العرض الفعلي للنافذة.
  const [isMobile, setIsMobile] = useState(
    () => typeof window !== "undefined" && window.innerWidth <= 860
  );
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= 860);
    onResize();
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    return () => {
      window.removeEventListener("resize", onResize);
      window.removeEventListener("orientationchange", onResize);
    };
  }, []);
  const [session, setSession] = useState(() => {
    try {
      const raw = sessionStorage.getItem(ROLE_KEY);
      return raw ? JSON.parse(raw) : { type: "guest" };
    } catch (e) { return { type: "guest" }; }
  });

  const [auditLog, setAuditLog] = useState([]);
  const auditLogRef = React.useRef([]);
  // اسم الفاعل الحالي (يُحدَّث لاحقاً بعد اشتقاق currentUser بالأسفل)،
  // نحتفظ به بمرجع حتى تقدر notify() تقرأه دون إعادة ترتيب الكود
  const actorRef = React.useRef("رئيس الموقع");

  // تحميل سجل النشاط الدائم من Supabase عند فتح الموقع + مزامنة فورية
  // بين كل الأجهزة (بدل السجل المحلي المؤقت السابق الذي يضيع بإغلاق الصفحة)
  useEffect(() => {
    let cancelled = false;
    let unsub = null;
    (async () => {
      try {
        const res = await window.storage?.get(AUDIT_KEY, false);
        if (cancelled) return;
        const list = res?.value ? JSON.parse(res.value) : [];
        auditLogRef.current = list;
        setAuditLog(list);
      } catch {}
      if (!cancelled && window.subscribeStorage) {
        unsub = window.subscribeStorage(AUDIT_KEY, (rawValue, isLocalWrite) => {
          if (cancelled || isLocalWrite) return;
          try {
            const list = JSON.parse(rawValue);
            auditLogRef.current = list;
            setAuditLog(list);
          } catch {}
        });
      }
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  }, []);

  const pushAuditEntry = useCallback((msg) => {
    const next = [{ msg, time: Date.now(), by: actorRef.current }, ...auditLogRef.current].slice(0, 500);
    auditLogRef.current = next;
    setAuditLog(next);
    window.storage?.set(AUDIT_KEY, JSON.stringify(next), false).catch(() => {});
  }, []);

  // استعادة سجل النشاط بالكامل من نسخة احتياطية مستوردة (لو كانت موجودة بالملف)
  const restoreAuditLog = useCallback((list) => {
    if (!Array.isArray(list)) return;
    auditLogRef.current = list;
    setAuditLog(list);
    window.storage?.set(AUDIT_KEY, JSON.stringify(list), false).catch(() => {});
  }, []);

  const notify = useCallback((msg, type = "success", opts = {}) => {
    setToast({ msg, type, id: Date.now() });
    if (!opts.silent) { playBeep(type === "error" ? "error" : "success"); hapticPulse(type === "error" ? "error" : "success"); }
    if (type !== "error" && !opts.silent) {
      pushAuditEntry(msg);
    }
    setTimeout(() => setToast((t) => (t?.msg === msg ? null : t)), 2600);
  }, [pushAuditEntry]);

  const onRemoteUpdate = useCallback(() => {
    notify("تم تحديث البيانات من جهاز آخر", "success", { silent: true });
  }, [notify]);

  const [data, setData, saving, sync] = useStore(onRemoteUpdate);

  // نسخ احتياطي تلقائي محلي: لو رئيس الموقع سبق واختار مجلداً على هذا
  // الجهاز، وحان وقت النسخة التالية (حسب المدة التي حددها)، نكتب الملف
  // تلقائياً بدون أي تدخل منه — بصمت، ودون إزعاجه لو تعذّر ذلك.
  useEffect(() => {
    if (session.type !== "owner" || !data || !isAutoBackupSupported()) return;
    (async () => {
      try {
        const settings = getAutoBackupSettings();
        if (!settings.enabled) return;
        if (daysSinceAutoBackup() < (settings.everyDays || 1)) return;
        const handle = await getDirHandle();
        if (!handle) return;
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm !== "granted") return; // ما نقدر نطلب الإذن بدون تفاعل مباشر من المستخدم
        await writeAutoBackupFile(handle, data, auditLogRef.current);
      } catch {
        // نتجاهل أي خطأ هنا بصمت — رئيس الموقع يقدر يتأكد ويأخذ نسخة يدوية من نافذة النسخ الاحتياطي
      }
    })();
  }, [session.type, data]);

  const inventory = useMemo(() => (data ? computeInventory(data) : []), [data]);

  // إعدادات تنبيهات رئيس الموقع (خاصة بهذا الجهاز/المتصفح)
  const [notifSettings, setNotifSettingsState] = useState(() => getNotifSettings());
  const [showNotifSettings, setShowNotifSettings] = useState(false);
  const [showGuestScreenSettings, setShowGuestScreenSettings] = useState(false);
  const [showBackupSettings, setShowBackupSettings] = useState(false);
  const setNotifSettings = (level) => {
    const next = { ...notifSettings, level };
    setNotifSettingsState(next);
    saveNotifSettings(next);
  };

  const systemNotify = useCallback((opts) => {
    notifySystemEvent({
      isOwner: session.type === "owner",
      ownerId: session.type === "owner" ? session.ownerId : undefined,
      settings: notifSettings,
      ...opts,
    });
  }, [session.type, session.ownerId, notifSettings]);

  // تسجيل الـ Service Worker مرة واحدة عند فتح الموقع (شرط أساسي لعمل PWA وPush)
  useEffect(() => {
    registerServiceWorker();
  }, []);

  // كشف تلقائي لأي صنف "دخل حالة نقص" جديدة (منخفض أو نفد) ليست موجودة بالفحص السابق،
  // فيرسل تنبيه نظام لرئيس الموقع (حسب إعداداته)، بدون تكرار نفس التنبيه في كل مرة.
  const prevShortageRef = React.useRef(new Set());
  useEffect(() => {
    if (session.type !== "owner" || !data) return;
    const shortageNow = new Set(inventory.filter((i) => i.status === "low" || i.status === "empty").map((i) => i.code));
    const prev = prevShortageRef.current;
    const newlyShort = [...shortageNow].filter((c) => !prev.has(c));
    if (newlyShort.length) {
      const names = newlyShort.map((c) => inventory.find((i) => i.code === c)?.name).filter(Boolean);
      systemNotify({
        eventLevel: "shortage",
        title: "المستودع — تنبيه نقص",
        body: names.length === 1
          ? `الصنف «${names[0]}» وصل لحد النقص أو نفد`
          : `${names.length} أصناف وصلت لحد النقص أو نفدت: ${names.slice(0, 3).join("، ")}${names.length > 3 ? "…" : ""}`,
        tag: "warehouse-shortage",
      });
    }
    prevShortageRef.current = shortageNow;
  }, [inventory, session.type, data, systemNotify]);

  // "مهامك اليوم" — تظهر تلقائياً مرة وحدة لكل دخول للمنظم (session.type === "user")
  // لو عنده مهام معلّقة مكلّف فيها شخصياً أو موجّهة لكل المنظمين، دون إزعاجه بها
  // في كل مرة يتنقل بين الصفحات.
  const [showMyTasks, setShowMyTasks] = useState(false);
  const shownTasksForUserRef = React.useRef(null);
  const myPendingTasks = useMemo(() => {
    if (!data || session.type !== "user") return [];
    const me = data.users.find((u) => u.id === session.userId);
    if (!me) return [];
    return (data.tasks || []).filter((t) => !t.done && (t.assignedTo === "all" || t.assignedTo === me.id));
  }, [data, session.type, session.userId]);
  useEffect(() => {
    if (!data || session.type !== "user") return;
    if (shownTasksForUserRef.current === session.userId) return;
    shownTasksForUserRef.current = session.userId;
    if (myPendingTasks.length > 0) setShowMyTasks(true);
  }, [data, session.type, session.userId, myPendingTasks.length]);

  const enter = (s) => {
    setSession(s);
    try { sessionStorage.setItem(ROLE_KEY, JSON.stringify(s)); } catch (e) {}
  };

  // تسجيل الخروج من وضع التحكم يعيدك دائماً إلى وضع العرض الافتراضي، وليس لشاشة اختيار فارغة
  const logout = () => {
    setSession({ type: "guest" });
    setPage("dashboard");
    shownTasksForUserRef.current = null;
    try { sessionStorage.removeItem(ROLE_KEY); } catch (e) {}
  };

  // تجهيز تقرير قابل للطباعة/PDF بتصميم مستند مرتّب، ثم فتح نافذة الطباعة
  const triggerPrint = (type) => setPrintJob({ type });
  useEffect(() => {
    if (!printJob) {
      document.body.classList.remove("printing-report");
      return;
    }
    document.body.classList.add("printing-report");
    const t = setTimeout(() => window.print(), 60);
    const after = () => setPrintJob(null);
    window.addEventListener("afterprint", after);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", after); };
  }, [printJob]);

  if (!data) {
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">📦</div>
        <div>جارٍ تحضير المستودع…</div>
      </div>
    );
  }

  const isOwner = session.type === "owner";
  const isGuest = session.type !== "owner" && session.type !== "user";
  const currentUser = session.type === "user" ? data.users.find((u) => u.id === session.userId) : null;
  const currentOwner = isOwner ? (data.owners || []).find((o) => o.id === session.ownerId) : null;
  actorRef.current = isOwner
    ? (currentOwner ? `${currentOwner.name} (رئيس الموقع)` : "رئيس الموقع")
    : (currentUser?.name || currentUser?.username || "مستخدم");

  // رئيس تم حذف حسابه (من رئيس آخر) وهو ما زال بجلسة مفتوحة — إخراج فوري
  if (session.type === "owner" && !currentOwner) {
    setTimeout(() => {
      logout();
      notify("تم حذف حسابك — تواصل مع رئيس آخر بالموقع", "error");
    }, 0);
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">⏳</div>
        <div>جارٍ تسجيل الخروج…</div>
      </div>
    );
  }

  // مستخدم مؤقت انتهت صلاحيته أو حُذف حسابه — إخراج فوري
  if (session.type === "user" && (!currentUser || isTempExpired(currentUser))) {
    setTimeout(() => {
      logout();
      notify("انتهت صلاحية الدخول — تواصل مع رئيس الموقع", "error");
    }, 0);
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">⏳</div>
        <div>جارٍ تسجيل الخروج…</div>
      </div>
    );
  }

  /* ---------------- وضع العرض (الافتراضي التلقائي) ----------------
     واجهة مبسّطة جداً: المخزون فقط للقراءة، بدون لوحة تحكم ولا قوائم جانبية،
     مع زر واحد للانتقال لوضع التحكم والتعديل (محمي بكلمة مرور). */
  if (isGuest) {
    return (
      <>
      <div className="view-shell">
        <FontStyles />
        <header className="view-topbar">
          <div className="brand">
            <div className="brand-mark">
              <Boxes size={20} strokeWidth={2.2} />
            </div>
            <div>
              <div className="brand-title">المستودع</div>
              <div className="brand-sub">لوحة العرض</div>
            </div>
          </div>
          <span
            className={`conn-dot ${sync.online ? "conn-dot-on" : "conn-dot-off"}`}
            title={sync.online ? "متصل — البيانات محدّثة" : "غير متصل — سيتم التحديث عند عودة الاتصال"}
          />
          <ThemeToggle themePref={themePref} effectiveTheme={effectiveTheme} onSet={setThemePref} />
          <button className="btn-ghost view-control-btn" onClick={() => setShowControlLogin(true)}>
            <KeyRound size={14} /> <span>الدخول للتحكم</span>
          </button>
        </header>

        <main className="view-main">
          {data.guestScreen === "welcome" ? (
            <GuestWelcomeScreen text={data.guestWelcomeText} />
          ) : data.guestScreen === "lists" ? (
            <GuestListsWithInventory data={data} inventory={inventory} triggerPrint={triggerPrint} />
          ) : data.guestScreen === "dashboard" ? (
            <GuestDashboardSummary inventory={inventory} />
          ) : (
            <InventoryPage inventory={inventory} itemGroups={data.itemGroups} branches={data.branches} locations={data.locations} onPrint={() => triggerPrint("inventory")} showBranchFilter />
          )}
        </main>

        {showControlLogin && (
          <ControlLoginModal
            data={data}
            onClose={() => setShowControlLogin(false)}
            onEnter={(s) => { enter(s); setShowControlLogin(false); notify("تم الدخول بنجاح"); }}
          />
        )}

        <Toast toast={toast} />
      </div>
      <PrintableReport job={printJob} data={data} inventory={inventory} />
      </>
    );
  }

  // كل مستخدم مسجّل دخول (رئيس الموقع أو مستخدم) يشوف الصفحات المتاحة له فقط؛
  // رئيس الموقع "بتحكم كامل" (permissions: null) يشوف كل شيء دائماً كسابق.
  // رئيس "بصلاحيات محددة" يشوف فقط الصفحات المفعّلة له من صفحة الرؤساء —
  // تماماً كالمستخدم العادي، لكن بإمكانية الوصول لصفحات الإدارة (الرؤساء/
  // المستخدمون/المجموعات/الأقسام) إن مُنحها تحديداً. المستخدم (متحكم) يشوف
  // "لوحة التحكم" دائماً بالإضافة لأي صفحة من GRANTABLE_PAGES فُعّلت له —
  // وإن لم تُحدَّد صلاحياته بعد (مستخدم قديم) يشوف كل الصفحات المتاحة كسابق
  // افتراضياً حتى لا ينكسر شيء بالترقية.
  const readOnly = currentUser ? !currentUser.canEdit : false;
  const isRestrictedOwner = isOwner && Array.isArray(currentOwner?.permissions);
  // نفس منطق صلاحيات الصفحات يُطبّق على صلاحية "ربط الجوال" — رئيس بتحكم كامل
  // أو مستخدم قديم بدون صلاحيات محددة يشوفها دائماً كسابق.
  const canUseScanner = isOwner
    ? (!isRestrictedOwner || currentOwner.permissions.includes("scannerPairing"))
    : (!currentUser?.permissions || currentUser.permissions.includes("scannerPairing"));
  const nonOwnerKeys = NAV.filter((n) => !n.ownerOnly).map((n) => n.key);
  const allowedKeys = isOwner
    ? (isRestrictedOwner
        ? nonOwnerKeys.filter((k) => k === "dashboard" || currentOwner.permissions.includes(k))
        : nonOwnerKeys)
    : nonOwnerKeys.filter((k) => k === "dashboard" || !currentUser?.permissions || currentUser.permissions.includes(k));
  const visibleNav = NAV.filter((n) => {
    if (!n.ownerOnly) return allowedKeys.includes(n.key);
    if (!isOwner) return false;
    return !isRestrictedOwner || currentOwner.permissions.includes(n.key);
  });
  const safePage = allowedKeys.includes(page) || (n2ok(page)) ? page : (allowedKeys[0] || "dashboard");
  function n2ok(p) {
    if (!NAV.some((n) => n.key === p && n.ownerOnly)) return false;
    if (!isOwner) return false;
    return !isRestrictedOwner || currentOwner.permissions.includes(p);
  }
  const go = (p) => {
    const ok = n2ok(p) || allowedKeys.includes(p);
    setPage(ok ? p : (allowedKeys[0] || "dashboard"));
    setNavOpen(false);
  };

  // من نتيجة البحث العام: يودّي المستخدم مباشرة لصفحة المخزون ويمرّر
  // للصنف بعينه ويميّزه، بدل ما يفتح الصفحة فاضية ويضطر يدوّر عليه يدوياً
  const goToItem = (code) => {
    setFocusCode(code);
    go("inventory");
  };

  const roleLabel = isOwner ? `${currentOwner?.name || "رئيس الموقع"} — ${isRestrictedOwner ? "صلاحيات محددة" : "تحكم كامل"}`
    : `${currentUser?.name || currentUser?.username}${readOnly ? " (قراءة فقط)" : " (يقدر يعدّل)"}`;

  return (
    <>
    <div className={`app-shell ${isMobile ? "is-mobile" : ""}`}>
      <FontStyles />
      {navOpen && <div className="sidebar-backdrop" onClick={() => setNavOpen(false)} />}
      <aside className={`sidebar ${navOpen ? "sidebar-open" : ""}`}>
        <div className="brand">
          <div className="brand-mark">
            <Boxes size={20} strokeWidth={2.2} />
          </div>
          <div>
            <div className="brand-title">المستودع</div>
            <div className="brand-sub">Warehouse Manifest</div>
          </div>
        </div>

        <div className={`role-badge role-badge-admin`}>
          {isOwner ? <ShieldAlert size={13} /> : <Users size={13} />}
          {roleLabel}
        </div>

        <nav className="nav-list">
          {visibleNav.map((n, i) => (
            <button key={n.key} className={`nav-item ${safePage === n.key ? "nav-item-active" : ""}`} onClick={() => go(n.key)}>
              <span className="nav-index">{String(i + 1).padStart(2, "0")}</span>
              <n.icon size={17} strokeWidth={2} />
              <span>{n.label}</span>
            </button>
          ))}
        </nav>

        <div className="sidebar-foot">
          {isOwner && (
            <button className="logout-btn" onClick={() => setShowPwModal(true)}>
              <KeyRound size={14} /> تغيير كلمة المرور
            </button>
          )}
          <button className="logout-btn" onClick={logout}>
            <X size={14} /> تسجيل الخروج
          </button>
        </div>
      </aside>

      <div className="main-col">
        <header className="topbar">
          {isMobile && (
            <button className="hamburger hamburger-force" onClick={() => setNavOpen((v) => !v)} aria-label="القائمة">
              <span /><span /><span />
            </button>
          )}
          <span
            className={`conn-dot ${sync.online ? "conn-dot-on" : "conn-dot-off"}`}
            title={sync.online ? (saving ? "جارٍ الحفظ…" : "متصل — يُحفظ تلقائياً") : "غير متصل — سيتم الحفظ عند عودة الاتصال"}
          />
          <GlobalSearch data={data} inventory={inventory} go={go} onPick={goToItem} currentUser={currentUser} isOwner={isOwner} />
          <ThemeToggle themePref={themePref} effectiveTheme={effectiveTheme} onSet={setThemePref} />
          {isOwner && (
            <button className="icon-btn" title="إعدادات التنبيهات" onClick={() => setShowNotifSettings(true)}>
              <Bell size={17} />
            </button>
          )}
          {isOwner && (
            <button className="icon-btn" title="إعدادات شاشة البداية" onClick={() => setShowGuestScreenSettings(true)}>
              <Monitor size={17} />
            </button>
          )}
          {isOwner && (
            <button className="icon-btn" title="النسخ الاحتياطي والاستعادة" onClick={() => setShowBackupSettings(true)}>
              <HardDriveDownload size={17} />
            </button>
          )}
          {canUseScanner && <ScannerPairing isOwner={isOwner} />}
          <button className="topbar-logout-btn" onClick={logout} title="تسجيل الخروج">
            <X size={15} /> <span>تسجيل الخروج</span>
          </button>
        </header>

        <main className="main-area">
          {safePage === "dashboard" && <Dashboard inventory={inventory} data={data} go={go} readOnly={readOnly} onPrint={() => triggerPrint("dashboard")} isOwner={isOwner} />}
          {safePage === "tasks" && <TasksPage data={data} setData={setData} notify={notify} isOwner={isOwner} currentUser={currentUser} />}
          {safePage === "items" && <ItemsPage data={data} setData={setData} notify={notify} readOnly={readOnly} onPrint={() => triggerPrint("items")} systemNotify={systemNotify} currentUser={currentUser} isOwner={isOwner} inventory={inventory} />}
          {safePage === "activities" && <ActivitiesPage data={data} setData={setData} notify={notify} readOnly={readOnly} inventory={inventory} />}
          {safePage === "inventory" && <InventoryPage inventory={inventory} itemGroups={data.itemGroups} branches={data.branches} locations={data.locations} onPrint={() => triggerPrint("inventory")} currentUser={currentUser} isOwner={isOwner} focusCode={focusCode} onFocusConsumed={() => setFocusCode(null)} />}
          {safePage === "barcodes" && <BarcodesPage data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "audit" && <AuditPage log={auditLog} isOwner={isOwner} currentUser={currentUser} />}
          {safePage === "owners" && isOwner && <OwnersPage data={data} setData={setData} notify={notify} currentOwnerId={session.ownerId} />}
          {safePage === "users" && isOwner && <UsersPage data={data} setData={setData} notify={notify} />}
          {safePage === "groups" && isOwner && <GroupsPage data={data} setData={setData} notify={notify} />}
          {safePage === "branches" && isOwner && <BranchesPage data={data} setData={setData} notify={notify} />}
          {safePage === "locations" && isOwner && <LocationsPage data={data} setData={setData} notify={notify} />}
          {safePage === "reports" && <ReportsPage data={data} inventory={inventory} auditLog={auditLog} />}
        </main>
      </div>

      {showPwModal && (
        <ChangeOwnerPasswordModal
          owner={(data.owners || []).find((o) => o.id === session.ownerId)}
          notify={notify}
          onClose={() => setShowPwModal(false)}
          onSave={({ password, recoveryQuestion, recoveryAnswer }) => {
            setData({
              ...data,
              owners: (data.owners || []).map((o) =>
                o.id === session.ownerId ? { ...o, password, recoveryQuestion, recoveryAnswer } : o
              ),
            });
            notify("تم تغيير كلمة المرور");
          }}
        />
      )}

      {showNotifSettings && (
        <NotificationSettingsModal
          settings={notifSettings}
          onClose={() => setShowNotifSettings(false)}
          onSave={(level) => setNotifSettings(level)}
          ownerId={isOwner ? session.ownerId : null}
        />
      )}

      {showGuestScreenSettings && (
        <GuestScreenSettingsModal
          data={data}
          onClose={() => setShowGuestScreenSettings(false)}
          onSave={({ guestScreen, guestWelcomeText, guestListsConfig }) => {
            setData({ ...data, guestScreen, guestWelcomeText, guestListsConfig });
            notify("تم حفظ إعدادات شاشة البداية");
          }}
        />
      )}

      {showBackupSettings && (
        <BackupSettingsModal
          data={data}
          auditLog={auditLog}
          notify={notify}
          onClose={() => setShowBackupSettings(false)}
          onRestore={(payload) => {
            setData(mergeBackupIntoData(data, payload));
            if (Array.isArray(payload.auditLog)) restoreAuditLog(payload.auditLog);
            notify("تم استيراد النسخة الاحتياطية الكاملة بنجاح");
          }}
        />
      )}

      {showMyTasks && myPendingTasks.length > 0 && (
        <MyTasksModal
          tasks={myPendingTasks}
          onClose={() => setShowMyTasks(false)}
          onDone={(taskId) => {
            setData({
              ...data,
              tasks: data.tasks.map((t) => (t.id === taskId
                ? { ...t, done: true, doneAt: new Date().toISOString(), doneBy: currentUser?.name || currentUser?.username || "?" }
                : t)),
            });
          }}
        />
      )}

      <Toast toast={toast} />
    </div>
    <PrintableReport job={printJob} data={data} inventory={inventory} />
    </>
  );
}

/* ------------------------------------------------------------------ */
/*  PRINTABLE REPORT — تصميم مستند مرتّب للتصدير كـ PDF/طباعة           */
/*  (بديل عن طباعة الموقع كما هو، يظهر فقط أثناء الطباعة)              */
/* ------------------------------------------------------------------ */

function PrintableReport({ job, data, inventory }) {
  if (!job || !data) return null;
  const type = job.type;
  const now = new Date();
  let generatedAt;
  try {
    generatedAt = new Intl.DateTimeFormat("ar-SA-u-nu-latn", { dateStyle: "long", timeStyle: "short" }).format(now);
  } catch {
    generatedAt = now.toLocaleString();
  }

  const groupName = (id) => data.itemGroups.find((g) => g.id === id)?.name || "بدون مجموعة";
  const branchName = (id) => (data.branches || []).find((b) => b.id === id)?.name || "—";

  const TITLES = {
    dashboard: "تقرير ملخص المستودع",
    inventory: "تقرير المخزون",
    items: "تقرير قائمة الأغراض",
  };

  const total = inventory.length;
  const available = inventory.filter((i) => i.status === "available").length;
  const low = inventory.filter((i) => i.status === "low").length;
  const empty = inventory.filter((i) => i.status === "empty").length;

  return (
    <div className="print-report">
      <div className="print-report-header">
        <div className="print-report-brand">
          <div className="print-report-brand-mark">📦</div>
          <div>
            <div className="print-report-brand-title">المستودع</div>
            <div className="print-report-brand-sub">Warehouse Manifest</div>
          </div>
        </div>
        <div className="print-report-meta">
          <div className="print-report-doc-title">{TITLES[type] || "تقرير"}</div>
          <div>تاريخ الإصدار: {generatedAt}</div>
        </div>
      </div>

      {type === "dashboard" && (
        <>
          <div className="print-stat-row">
            <div className="print-stat"><span>{total}</span>إجمالي الأصناف</div>
            <div className="print-stat"><span>{available}</span>متوفرة</div>
            <div className="print-stat"><span>{low}</span>مخزون منخفض</div>
            <div className="print-stat"><span>{empty}</span>نفدت كمياتها</div>
          </div>
          <table className="print-table">
            <thead><tr><th>الكود</th><th>الصنف</th><th>المجموعة</th><th>الموقع</th><th>الكمية</th><th>الحالة</th></tr></thead>
            <tbody>
              {inventory.map((i) => (
                <tr key={i.code}>
                  <td>{i.code}</td>
                  <td>{i.name}</td>
                  <td>{groupName(i.group)}</td>
                  <td>{i.category || "—"}</td>
                  <td>{i.balance}</td>
                  <td>{STATUS_META[i.status]?.label}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </>
      )}

      {type === "inventory" && (
        <table className="print-table">
          <thead><tr><th>الكود</th><th>الصنف</th><th>القسم</th><th>المجموعة</th><th>الموقع</th><th>الداخل</th><th>الخارج</th><th>الكمية</th><th>الحالة</th></tr></thead>
          <tbody>
            {inventory.map((i) => (
              <tr key={i.code}>
                <td>{i.code}</td>
                <td>{i.name}</td>
                <td>{branchName(i.branch)}</td>
                <td>{groupName(i.group)}</td>
                <td>{i.category || "—"}</td>
                <td>{i.inQty}</td>
                <td>{i.outQty}</td>
                <td>{i.balance}</td>
                <td>{STATUS_META[i.status]?.label}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {type === "items" && (
        <table className="print-table">
          <thead><tr><th>الكود</th><th>اسم الغرض</th><th>الفئة / الموقع</th><th>ملاحظات</th></tr></thead>
          <tbody>
            {data.items.map((it) => (
              <tr key={it.code}>
                <td>{it.code}</td>
                <td>{it.name}</td>
                <td>{it.category || "—"}</td>
                <td>{it.notes || "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <div className="print-report-footer">المستودع — مستند تم إنشاؤه تلقائياً بتاريخ {generatedAt}</div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  STYLES                                                             */
/* ------------------------------------------------------------------ */

function FontStyles() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

      :root {
        --kraft: #ECE2CC;
        --kraft-deep: #E1D3B2;
        --paper: #F8F3E7;
        --ink: #23303A;
        --ink-soft: #5B6570;
        --line: #C9BA96;
        --line-soft: #F0E9D6;
        --navy: #2B3B47;
        --green: #3F6D4E;
        --green-bg: #E9F1E9;
        --amber: #B3792C;
        --amber-bg: #FBF0DD;
        --red: #B23A2E;
        --red-bg: #FAE6E2;
        --olive: #8A7A3E;
        --olive-bg: #F5F0DD;
        --surface: #FFFFFF;
        --surface-hover: #FAF6EA;
        --chip-bg: #F3EEDD;
        --shadow-color: 35, 48, 58;
        color-scheme: light;
      }

      /* الوضع الليلي: نفس هوية العلامة (كرافت/كحلي) لكن معكوسة لراحة العين
         بالإضاءة المنخفضة — يُفعَّل عبر data-theme="dark" على <html> إما يدوياً
         أو تلقائياً حسب إعداد نظام تشغيل الجهاز (system). */
      [data-theme="dark"] {
        --kraft: #232B33;
        --kraft-deep: #2C3640;
        --paper: #171C22;
        --ink: #EDE7D8;
        --ink-soft: #9BA5AD;
        --line: #34404A;
        --line-soft: #2A333C;
        --navy: #5C84A6;
        --green: #6FBE8B;
        --green-bg: #16261C;
        --amber: #E3A868;
        --amber-bg: #2E2312;
        --red: #E2685A;
        --red-bg: #351815;
        --olive: #C9B76B;
        --olive-bg: #2A2612;
        --surface: #1E252C;
        --surface-hover: #29323B;
        --chip-bg: #29323B;
        --shadow-color: 0, 0, 0;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      /* حماية من خروج أي عنصر عن عرض الشاشة بالجوال (كروت، جداول، إلخ) */
      html, body { max-width: 100%; overflow-x: hidden; }

      /* ---------- نسخة احتياطية من قواعد الجوال، مبنية على كلاس JS
         (.is-mobile) بدل الاعتماد فقط على @media. بعض متصفحات الأندرويد
         (مثل متصفح هواوي عند فتح الملف مباشرة بدون سيرفر) لا تُفعّل
         meta viewport بشكل صحيح فتفشل @media، فيبقى الشريط الجانبي
         ظاهراً بعرضه الكامل ويغطي الواجهة. هذه القواعد تضمن نفس السلوك
         دائماً لأنها تعتمد على عرض النافذة الفعلي المحسوب بالجافاسكربت. */
      .app-shell.is-mobile .sidebar {
        position: fixed !important; top: 0; bottom: 0; right: 0; z-index: 70;
        width: min(78vw, 300px) !important;
        transform: translateX(100%);
        transition: transform 0.18s ease-out;
        box-shadow: -8px 0 24px rgba(0,0,0,0.18);
      }
      .app-shell.is-mobile .sidebar.sidebar-open { transform: translateX(0); }
      .app-shell.is-mobile .hamburger-force { display: flex !important; padding: 10px; margin: -10px; touch-action: manipulation; }
      .app-shell.is-mobile .main-area { padding: 18px 16px 24px !important; }
      .app-shell.is-mobile .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .app-shell.is-mobile .chart-grid { grid-template-columns: 1fr !important; }
      .app-shell.is-mobile .form-grid, .app-shell.is-mobile .form-grid-move { grid-template-columns: 1fr 1fr !important; }
      /* على شاشات الجوال الضيقة (أغلب الهواتف) تُعرض حقول النماذج عمود
         واحد بعرض كامل بدل التصاقها جنب بعض وانقطاع النص — يشمل هذا
         نماذج الإضافة/التعديل كلها (باركود، صنف، مستخدم...الخ) */
      @media (max-width: 560px) {
        .app-shell.is-mobile .form-grid,
        .app-shell.is-mobile .form-grid-move { grid-template-columns: 1fr !important; }
        .app-shell.is-mobile .modal-overlay { align-items: flex-end !important; padding: 0 !important; }
        .app-shell.is-mobile .modal-sheet { max-width: 100% !important; border-radius: 16px 16px 0 0 !important; max-height: 88vh !important; }
        .app-shell.is-mobile .modal-body { padding: 16px !important; }
        .app-shell.is-mobile .modal-actions { flex-direction: column-reverse !important; gap: 8px !important; }
        .app-shell.is-mobile .modal-actions .btn-primary,
        .app-shell.is-mobile .modal-actions .btn-ghost,
        .app-shell.is-mobile .modal-actions .btn-danger { width: 100% !important; }
      }
      .app-shell.is-mobile .topbar { padding: 10px 12px !important; gap: 8px !important; }
      .app-shell.is-mobile .global-search { max-width: none !important; padding: 7px 10px !important; }
      .app-shell.is-mobile .topbar-logout-btn span { display: none !important; }
      .app-shell.is-mobile .topbar-logout-btn { padding: 8px !important; }
      .app-shell.is-mobile .sidebar-backdrop {
        display: block !important; position: fixed; inset: 0; z-index: 65;
        background: rgba(20,26,32,0.4);
      }

      .app-shell, .boot-screen {
        direction: rtl;
        font-family: 'Tajawal', sans-serif;
        color: var(--ink);
        background: var(--paper);
        background-image:
          linear-gradient(var(--paper), var(--paper)),
          repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(35,48,58,0.025) 28px);
      }

      .boot-screen {
        height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        font-size: 14px; color: var(--ink-soft);
      }
      .boot-mark { font-size: 34px; }

      .app-shell {
        display: flex;
        min-height: 100vh;
        width: 100%;
      }

      .mono, .cell-mono, .code-tag, input.mono { font-family: 'JetBrains Mono', monospace; }

      /* ---------- SIDEBAR ---------- */
      .sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--kraft);
        border-left: 1px dashed var(--line);
        display: flex;
        flex-direction: column;
        padding: 18px 14px;
        gap: 22px;
      }
      .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 8px; background: var(--navy); color: #F3EEDD;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      }
      .brand-title { font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 15px; line-height: 1.3; }
      .brand-sub { font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.04em; font-family: 'JetBrains Mono', monospace; }

      .nav-list { display: flex; flex-direction: column; gap: 3px; }
      .nav-item {
        display: flex; align-items: center; gap: 10px;
        background: transparent; border: none; cursor: pointer;
        padding: 10px 10px; border-radius: 8px;
        font-family: 'Tajawal', sans-serif; font-size: 13.5px; font-weight: 500;
        color: var(--ink); text-align: right; transition: background 0.15s ease;
      }
      .nav-index {
        font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-soft);
        width: 16px;
      }
      .nav-item:hover { background: rgba(43,59,71,0.06); }
      .nav-item-active { background: var(--navy); color: #F3EEDD; }
      .nav-item-active .nav-index { color: rgba(243,238,221,0.55); }

      .sidebar-foot { margin-top: auto; padding: 0 4px; }
      .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
      .conn-dot { width: 9px; height: 9px; min-width: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); cursor: default; }
      .conn-dot-off { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg, rgba(178,58,46,0.12)); animation: pulse 1.2s infinite ease-in-out; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

      /* ---------- MAIN ---------- */
      .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .topbar {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 24px; border-bottom: 1px dashed var(--line);
        position: sticky; top: 0; background: var(--paper); z-index: 5;
      }
      .hamburger { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; }
      .hamburger span { width: 20px; height: 2px; background: var(--ink); border-radius: 2px; }

      /* min-width:0 ضروري حتى يقدر عنصر flex:1 ينكمش تحت عرضه الطبيعي —
         بدونها كان شريط البحث يرفض ينكمش بالشاشات الضيقة ويدفع زر تسجيل
         الخروج والأزرار الثانية برا حدود الشاشة تماماً (يختفي بدل ما يظهر) */
      .global-search { position: relative; flex: 1; min-width: 0; max-width: 380px; display: flex; align-items: center; gap: 8px;
        background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--ink-soft);
      }
      .global-search input { border: none; outline: none; background: transparent; font-family: 'Tajawal'; font-size: 13px; color: var(--ink); flex: 1; min-width: 0; }
      .global-results { position: absolute; top: 42px; right: 0; left: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(var(--shadow-color),0.12); overflow: hidden; z-index: 20; }
      .global-result-item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: none; border: none; border-bottom: 1px solid #eee2c9; cursor: pointer; text-align: right; }
      .global-result-item:last-child { border-bottom: none; }
      .global-result-item:hover { background: var(--surface-hover); }
      .global-result-main { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: none; border: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: right; }

      .main-area { padding: 24px 28px 60px; flex: 1; }

      .page { display: flex; flex-direction: column; gap: 18px; max-width: 1180px; }

      .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .page-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; margin-bottom: 4px; }
      .page-title { font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 24px; margin: 0; color: var(--navy); }
      .page-subtitle { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }

      /* ---------- STAT CARDS ---------- */
      .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .stat-card {
        background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 8px; cursor: pointer;
        text-align: right; transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(35,48,58,0.08); }
      .stat-value { font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 26px; }
      .stat-label { font-size: 12.5px; color: var(--ink-soft); }
      .tone-navy svg { color: var(--navy); } .tone-navy .stat-value { color: var(--navy); }

      /* ---------- شارات نوع الحدث بسجل النشاط ---------- */
      .audit-tone-green { color: var(--green); border-color: var(--green); background: var(--green-bg); }
      .audit-tone-red { color: var(--red); border-color: var(--red); background: var(--red-bg); }
      .audit-tone-amber { color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
      .audit-tone-navy { color: var(--navy); border-color: var(--navy); background: var(--chip-bg); }
      .tone-green svg { color: var(--green); } .tone-green .stat-value { color: var(--green); }
      .tone-amber svg { color: var(--amber); } .tone-amber .stat-value { color: var(--amber); }
      .tone-red svg { color: var(--red); } .tone-red .stat-value { color: var(--red); }

      /* ---------- PANEL / TABLE ---------- */
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }

      /* ---------- TASKS ---------- */
      .task-list { display: flex; flex-direction: column; }
      .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); }
      .task-row:last-child { border-bottom: none; }
      .task-row-done { opacity: 0.55; }
      .task-check {
        flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line);
        background: var(--surface); color: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
        margin-top: 1px;
      }
      .task-row-done .task-check { background: var(--green); border-color: var(--green); color: #fff; }
      .task-check:hover { border-color: var(--navy); }
      .task-body { flex: 1; min-width: 0; }
      .task-text { font-size: 13.5px; font-weight: 600; }
      .task-row-done .task-text { text-decoration: line-through; }
      .task-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
      .task-overdue { color: var(--red); font-weight: 700; }
      .panel-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 10px; }
      .panel-title { font-family: 'Almarai', sans-serif; font-weight: 700; font-size: 14.5px; }
      .panel-sub { font-size: 11.5px; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; }

      .table-wrap { overflow-x: auto; }
      .ledger-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .ledger-table th {
        text-align: right; font-family: 'Tajawal'; font-weight: 700; font-size: 11.5px; color: var(--ink-soft);
        padding: 8px 14px; border-top: 1px dashed var(--line); border-bottom: 1px solid var(--line); white-space: nowrap;
      }
      .ledger-table th.sortable { cursor: pointer; user-select: none; }
      .ledger-table td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
      .ledger-table tr:last-child td { border-bottom: none; }
      .ledger-table tr:hover td { background: #FBF8F0; }
      .cell-strong { font-weight: 700; }
      .cell-muted { color: var(--ink-soft); font-size: 12.5px; }
      .cell-mono { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
      .cell-balance { font-weight: 700; }

      .code-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--chip-bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; font-size: 11.5px; color: var(--ink); }

      .stamp-badge {
        display: inline-block; font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 11px;
        padding: 4px 10px; border: 1.5px solid; border-radius: 7px; letter-spacing: 0.01em;
      }

      .move-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 7px; }
      .move-in { background: var(--green-bg); color: var(--green); }
      .move-out { background: var(--red-bg); color: var(--red); }

      /* ---------- TOOLBAR ---------- */
      .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; flex: 1; min-width: 220px; color: var(--ink-soft); }
      .search-box input { border: none; outline: none; background: transparent; font-family: 'Tajawal'; font-size: 13px; flex: 1; color: var(--ink); }
      .search-cam-btn {
        display: inline-flex; align-items: center; justify-content: center; flex: none;
        width: 28px; height: 28px; border-radius: 7px; border: none; cursor: pointer;
        background: var(--navy); color: #F3EEDD; margin-inline-start: 2px;
      }
      .search-cam-btn:hover { background: #1E2A33; }
      .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 12px; font-family: 'Tajawal'; font-weight: 500; cursor: pointer; color: var(--ink-soft); }
      .chip-active { background: var(--navy); border-color: var(--navy); color: #F3EEDD; }
      /* عناصر قوائم "الأقسام/المواقع" بشاشة البداية للزوّار — شكل شبه مستطيل
         (زوايا أقل استدارة) بدل الشكل البيضاوي الكامل المستخدم بباقي الشيبس */
      .list-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-family: 'Tajawal'; font-weight: 600; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, color .15s; }
      .list-chip:hover { border-color: var(--navy); }
      .list-chip-active { background: var(--navy); border-color: var(--navy); color: #F3EEDD; }
      .list-chip-active .cat-count { color: #F3EEDD; opacity: .85; }

      /* ---------- التسجيل السريع (دخول/خروج مباشرة من قائمة الأغراض) ---------- */
      .quick-chip-in.chip-active { background: var(--green); border-color: var(--green); color: #fff; }
      .quick-chip-out.chip-active { background: var(--red); border-color: var(--red); color: #fff; }
      /* بطاقات وضع الإدخال/الإخراج بقائمة الأغراض — عمود واحد يلف عمودياً
         بدل جدول عريض، حتى لا تحتاج الصفحة لأي تمرير أفقي على الجوال */
      .quick-log-list { display: flex; flex-direction: column; gap: 8px; }
      .quick-log-card { border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
      .quick-log-card.row-selected { background: #FBF6E9; border-color: #E4C77A; }
      [data-theme="dark"] .quick-log-card.row-selected { background: rgba(228,199,122,0.12); }
      .quick-log-card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
      .quick-log-card-top input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--navy); flex-shrink: 0; }
      .quick-log-card-info { flex: 1; min-width: 0; }
      .quick-log-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 3px; }
      .quick-log-card-balance { flex-shrink: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .quick-log-card-balance-label { font-size: 10.5px; color: var(--ink-soft); }
      .quick-log-card .quick-log-row { justify-content: flex-start; flex-wrap: wrap; }
      .quick-log-row { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
      .quick-log-qty { width: 72px; padding: 6px 8px; text-align: center; }
      .quick-log-btn { border-radius: 8px; padding: 8px; }
      .quick-log-btn-in { background: var(--green-bg); color: var(--green); }
      .quick-log-btn-in:hover { background: var(--green); color: #fff; }
      .quick-log-btn-out { background: var(--red-bg); color: var(--red); }
      .quick-log-btn-out:hover { background: var(--red); color: #fff; }
      .qty-stepper { display: flex; align-items: center; gap: 2px; }
      .qty-stepper-btn {
        display: flex; align-items: center; justify-content: center;
        width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink-soft); cursor: pointer; flex: none;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .qty-stepper-btn:hover { background: var(--navy); border-color: var(--navy); color: #fff; }
      .qty-stepper .quick-log-qty { width: 56px; }
      @media (max-width: 520px) {
        .quick-log-qty { width: 56px; }
        .qty-stepper .quick-log-qty { width: 44px; }
        .qty-stepper-btn { width: 22px; height: 22px; }
      }

      /* ---------- تحديد جماعي لتطبيق كمية على عدة أصناف دفعة وحدة ---------- */
      .bulk-bar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        background: var(--kraft); border: 1px solid var(--line); border-radius: 10px;
        padding: 10px 14px; margin-top: 10px;
      }
      .bulk-bar-selectall {
        display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700;
        color: var(--ink); cursor: pointer; white-space: nowrap;
      }
      .bulk-bar-selectall input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
      .bulk-bar-count {
        font-size: 12px; font-weight: 700; color: var(--ink-soft); background: var(--chip-bg);
        border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; white-space: nowrap;
      }
      .bulk-bar-qty { width: 130px; }
      .bulk-bar-apply:disabled, .bulk-bar-delete:disabled { opacity: 0.5; cursor: not-allowed; }
      .bulk-bar-clear { margin-inline-start: auto; }
      .table-select-col { width: 34px; text-align: center; }
      .table-select-col input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
      tr.row-selected { background: var(--surface-hover); }
      @media (max-width: 520px) {
        .bulk-bar { padding: 9px 10px; }
        .bulk-bar-qty { width: 100px; }
        .bulk-bar-clear { margin-inline-start: 0; }
      }

      /* ---------- BUTTONS ---------- */
      .btn-primary, .btn-ghost, .btn-danger {
        display: inline-flex; align-items: center; gap: 7px; font-family: 'Tajawal'; font-weight: 700; font-size: 13px;
        border-radius: 9px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
      }
      .btn-primary { background: var(--navy); color: #F3EEDD; }
      .btn-primary:hover { background: #1E2A33; }
      .btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
      .btn-ghost:hover { background: var(--surface-hover); }
      .btn-danger { background: var(--red); color: #fff; }
      .btn-danger:hover { background: #98301F; }

      .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 7px; color: var(--ink-soft); display: inline-flex; }
      .topbar-logout-btn {
        display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        background: var(--red-bg, #FAE6E2); color: var(--red, #B23A2E); border: 1px solid var(--red, #B23A2E);
        border-radius: 8px; padding: 8px 14px; font-family: 'Tajawal'; font-weight: 700; font-size: 12.5px;
        cursor: pointer; white-space: nowrap;
      }
      .topbar-logout-btn:hover { background: var(--red, #B23A2E); color: #fff; }
      @media (max-width: 520px) {
        .topbar-logout-btn span { display: none; }
        .topbar-logout-btn { padding: 8px; }
      }
      .icon-btn:hover { background: var(--surface-hover); color: var(--ink); }
      .theme-toggle-wrap { position: relative; }
      .theme-toggle-menu {
        position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 168px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
        box-shadow: 0 10px 26px rgba(var(--shadow-color),0.16);
      }
      .theme-toggle-item {
        display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; text-align: right;
        padding: 8px 10px; border-radius: 7px; font-family: 'Tajawal'; font-size: 12.5px; color: var(--ink); cursor: pointer;
      }
      .theme-toggle-item:hover { background: var(--surface-hover); }
      .theme-toggle-item-active { color: var(--navy); font-weight: 700; }
      .icon-btn-danger:hover { background: var(--red-bg); color: var(--red); }
      .row-actions { display: flex; gap: 2px; }

      /* ---------- FORMS ---------- */
      .form-panel { padding: 18px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 0; }
      .form-grid-move { grid-template-columns: 1fr 1fr 1fr; }
      .field { display: flex; flex-direction: column; gap: 6px; position: relative; min-width: 0; }
      .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); background: var(--surface-hover); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
      .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
      .box-contents-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
      .box-contents-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface-hover); }
      .box-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); background: var(--chip-bg); border-radius: 6px; padding: 2px 8px; margin-inline-start: 6px; }
      .field-full { grid-column: 1 / -1; }
      .field-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
      .field-hint { font-size: 11px; color: var(--ink-soft); opacity: 0.85; line-height: 1.5; }
      .perm-toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
      .perm-toolbar-btn {
        font-size: 11.5px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink-soft); cursor: pointer;
      }
      .perm-toolbar-btn:hover { background: var(--kraft); }
      .perm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .perm-check {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px;
        border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .perm-check input { accent-color: var(--navy); }
      .perm-check-active { border-color: var(--navy); background: var(--navy-bg, var(--kraft)); }
      @media (max-width: 520px) {
        .perm-grid { grid-template-columns: 1fr; }
      }
      .scan-label { display: inline-flex; align-items: center; gap: 5px; }
      .scan-hint {
        font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; color: var(--green);
        background: var(--green-bg); padding: 1.5px 7px; border-radius: 10px; letter-spacing: 0.02em;
        animation: scan-breathe 1.6s ease-in-out infinite;
      }
      @keyframes scan-breathe { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
      .scan-input { border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,109,78,0.08); }
      .scan-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,109,78,0.14); }
      .scan-flash { animation: scan-flash-anim 0.35s ease; }
      @keyframes scan-flash-anim {
        0% { background: var(--green-bg); border-color: var(--green); }
        100% { background: var(--paper); }
      }

      .scan-input-row { display: flex; gap: 6px; align-items: stretch; }
      .scan-input-row .scan-input { flex: 1; min-width: 0; }
      .scan-camera-btn {
        display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        background: var(--navy); color: #F3EEDD; border: none; border-radius: 8px; padding: 0 12px;
        font-family: 'Tajawal'; font-weight: 700; font-size: 12px; cursor: pointer;
      }
      .scan-camera-btn:hover { background: #1E2A33; }

      .camera-sheet { max-width: 460px; }
      .camera-body { padding: 0; }
      .camera-frame { position: relative; width: 100%; aspect-ratio: 4 / 5; background: #111; overflow: hidden; }
      .camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .camera-reticle { position: absolute; inset: 14% 10%; pointer-events: none; }
      .reticle-corner { position: absolute; width: 26px; height: 26px; border: 3px solid #7FE0A0; }
      .reticle-corner.tl { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 6px 0 0 0; }
      .reticle-corner.tr { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 0 6px 0 0; }
      .reticle-corner.bl { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 0 6px; }
      .reticle-corner.br { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 6px 0; }
      .reticle-line { position: absolute; right: 0; left: 0; top: 50%; height: 2px; background: #7FE0A0; box-shadow: 0 0 8px #7FE0A0; animation: reticle-sweep 1.6s ease-in-out infinite; }
      @keyframes reticle-sweep { 0%,100% { top: 12%; } 50% { top: 88%; } }
      .camera-status {
        position: absolute; bottom: 12px; right: 50%; transform: translateX(50%);
        background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; font-family: 'Tajawal'; font-weight: 600;
        padding: 6px 14px; border-radius: 8px; white-space: nowrap;
      }
      .camera-fallback { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 26px 22px; color: var(--ink-soft); }
      .camera-fallback svg { color: var(--amber); }
      .camera-fallback p { font-size: 12.5px; line-height: 1.8; margin: 0; }
      .camera-manual { display: flex; gap: 8px; width: 100%; margin-top: 4px; }
      .camera-manual .input { flex: 1; }
      .input {
        border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-family: 'Tajawal'; font-size: 13.5px;
        background: var(--paper); color: var(--ink); outline: none;
        width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box;
      }
      select.input { text-overflow: ellipsis; }
      .input:focus { border-color: var(--navy); background: var(--surface); }
      .input:disabled { color: var(--ink-soft); }

      /* إصلاح حقول التاريخ داخل صفحة RTL: بدون هذا، بعض المتصفحات تعكس
         ترتيب يوم/شهر/سنة داخل صندوق input[type=date] الأصلي فيصير
         مقروء بشكل معكوس. نجبر اتجاه محتوى الحقل نفسه LTR بينما يبقى
         الحقل والتسمية بجانبه بشكل RTL طبيعي كبقية الواجهة */
      input[type="date"], input[type="time"], input[type="datetime-local"] {
        direction: ltr;
        text-align: right;
      }
      input[type="date"]::-webkit-calendar-picker-indicator { margin-inline-start: 6px; margin-inline-end: 0; }
      .form-actions { display: flex; justify-content: flex-start; margin-top: 14px; }

      .autocomplete { position: relative; }
      .suggest-list { position: absolute; top: 42px; right: 0; left: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 20px rgba(var(--shadow-color),0.12); z-index: 15; max-height: 220px; overflow-y: auto; }
      .suggest-item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 11px; background: none; border: none; border-bottom: 1px solid var(--line-soft); cursor: pointer; text-align: right; font-size: 12.5px; }
      .suggest-item:last-child { border-bottom: none; }
      .suggest-item:hover { background: var(--surface-hover); }

      .alert { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 10px 13px; border-radius: 8px; margin-top: 12px; }
      .alert-error { background: var(--red-bg); color: var(--red); }
      .alert-info { background: #EAF1F5; color: var(--navy); }

      /* ---------- MODAL ---------- */
      .modal-overlay { position: fixed; inset: 0; background: rgba(35,48,58,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
      .modal-sheet { background: var(--paper); border-radius: 14px; width: 100%; max-width: 420px; border: 1px solid var(--line); display: flex; flex-direction: column; max-height: calc(100vh - 40px); overflow-x: hidden; }
      .modal-sheet-wide { max-width: 640px; }
      .modal-sheet-wide .modal-body { padding: 24px 26px; }
      .modal-sheet-wide .form-grid { gap: 18px 22px; }
      .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px dashed var(--line); flex-shrink: 0; }
      .modal-title { font-family: 'Almarai'; font-weight: 800; font-size: 14.5px; }
      .modal-body { padding: 18px; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; min-width: 0; box-sizing: border-box; }
      .modal-body * { max-width: 100%; box-sizing: border-box; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; grid-column: 1 / -1; flex-wrap: wrap; min-width: 0; }
      .modal-section-divider {
        grid-column: 1 / -1; font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
        border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 4px;
      }
      .confirm-text { font-size: 13px; color: var(--ink); line-height: 1.7; margin: 0; }

      /* ---------- EMPTY STATE ---------- */
      .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 46px 20px; color: var(--ink-soft); text-align: center; }
      .empty-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
      .empty-hint { font-size: 12px; }

      /* ---------- BARCODE CARDS ---------- */
      .barcode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 14px; }
      .barcode-card { position: relative; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      /* الباركود لازم يبقى خلفية فاتحة وخطوط داكنة دائماً بأي وضع (فاتح/داكن) عشان يبقى قابلاً للمسح والطباعة */
      .barcode-card { background: #FFFFFF; }
      .barcode-name { color: #23303A; }
      .barcode-stripes { display: flex; gap: 1.5px; height: 32px; align-items: stretch; }
      .barcode-stripes span { background: var(--ink); display: block; }
      .barcode-number { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.05em; margin-top: 4px; }
      .barcode-name { font-size: 12.5px; font-weight: 700; text-align: center; }
      .barcode-actions { position: absolute; top: 6px; left: 6px; }
      .barcode-linked-badge {
        position: absolute; top: 6px; right: 6px;
        display: flex; align-items: center; gap: 3px;
        font-size: 10px; font-weight: 700; color: #FFFFFF;
        background: var(--green); border-radius: 999px; padding: 3px 8px;
        line-height: 1;
      }
      .barcode-section-tag {
        font-size: 10.5px; font-weight: 600; color: var(--ink-soft);
        background: var(--bg); border: 1px solid var(--line);
        border-radius: 6px; padding: 2px 9px; margin-top: 2px;
      }

      /* ---------- تحديد أكواد للطباعة (وضع اختياري) ---------- */
      .print-selection-bar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        background: var(--surface); border: 1px dashed var(--line); border-radius: 10px;
        padding: 9px 14px; margin: 0 0 12px; font-size: 12.5px; color: var(--ink-soft);
      }
      .print-selectall-box {
        display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink);
        cursor: pointer; user-select: none; white-space: nowrap;
      }
      .print-selectall-box input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }
      .print-selection-sep { width: 1px; align-self: stretch; background: var(--line); }
      .print-selection-clear { margin-inline-start: auto; padding: 4px 10px !important; font-size: 12px !important; }
      /* لما يكون وضع التحديد فعّالاً، نرفع محتوى البطاقة لتحت عشان شريط
         التحديد (فوق البطاقة بعرضها الكامل) ما يتداخل مع الباركود أو الاسم */
      .barcode-card-selectable { cursor: pointer; padding-top: 44px; }
      .barcode-card-selected { border: 1px solid var(--navy) !important; box-shadow: 0 0 0 2px rgba(35,48,58,0.12); }
      .barcode-select-box {
        position: absolute; top: 0; left: 0; right: 0; z-index: 3;
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        background: var(--bg); border-bottom: 1px solid var(--line);
        border-radius: 10px 10px 0 0;
        padding: 7px 10px;
      }
      .barcode-select-box input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
      .barcode-select-count { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
      .barcode-select-count button {
        border: none; background: var(--surface); color: var(--navy); border-radius: 5px;
        width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer;
      }
      .barcode-select-count input {
        width: 30px; text-align: center; border: none; background: transparent;
        font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink);
      }
      .barcode-select-count input::-webkit-outer-spin-button,
      .barcode-select-count input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      .print-selection-grid { display: none; }
      @media print {
        body.printing-selection .barcode-grid:not(.print-selection-grid) { display: none !important; }
        body.printing-selection .print-selection-grid { display: grid !important; }
      }

      /* ---------- TOAST ---------- */
      .toast {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
        font-family: 'Tajawal'; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(35,48,58,0.2); z-index: 200;
        animation: toast-in 0.2s ease;
      }
      @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
      .toast-success { background: var(--navy); color: #F3EEDD; }
      .toast-error { background: var(--red); color: #fff; }

      /* ---------- LOGIN GATE ---------- */
      .login-screen {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--kraft); padding: 20px;
      }
      .login-card {
        background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
        padding: 34px 30px; width: 100%; max-width: 380px; text-align: center;
        box-shadow: 0 14px 40px rgba(35,48,58,0.12);
      }
      .login-mark {
        width: 52px; height: 52px; border-radius: 14px; background: var(--navy); color: #F3EEDD;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
      }
      .login-title { font-family: 'Almarai'; font-weight: 800; font-size: 19px; color: var(--ink); }
      .login-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; margin-bottom: 22px; }
      .login-choices { display: flex; flex-direction: column; gap: 10px; }
      .login-choice {
        display: flex; align-items: center; gap: 12px; text-align: right;
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px;
        cursor: pointer; font-family: 'Tajawal';
      }
      .login-choice:hover { background: var(--surface-hover); border-color: var(--navy); }
      .login-choice-icon {
        width: 36px; height: 36px; border-radius: 10px; background: var(--kraft);
        display: flex; align-items: center; justify-content: center; color: var(--navy); flex-shrink: 0;
      }
      .login-choice-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
      .login-choice-hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
      .login-admin-form { display: flex; flex-direction: column; gap: 4px; text-align: right; }
      .login-admin-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
      .link-btn {
        background: none; border: none; padding: 0; margin-top: 8px; text-align: right;
        color: var(--navy); font-family: 'Tajawal'; font-size: 12px; font-weight: 700;
        text-decoration: underline; cursor: pointer; align-self: flex-start;
      }
      .recovered-pass {
        font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
        background: var(--kraft); border: 1px dashed var(--line); border-radius: 10px;
        padding: 10px; text-align: center; letter-spacing: 0.04em;
      }

      /* ---------- VIEW MODE (لوحة العرض) — واجهة مبسّطة للزوار ---------- */
      .view-shell { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
      .view-topbar {
        display: flex; align-items: center; gap: 12px; padding: 14px 20px;
        border-bottom: 1px dashed var(--line); background: var(--paper); position: sticky; top: 0; z-index: 5;
      }
      .view-topbar .brand { display: flex; align-items: center; gap: 10px; flex: 1; }
      .view-control-btn { white-space: nowrap; }
      .view-main { flex: 1; padding: 20px 24px 40px; }
      @media (max-width: 520px) {
        .view-topbar { padding: 12px 14px; }
        .view-main { padding: 16px 14px 60px; }
        .view-control-btn span { display: none; }
      }

      /* ---------- ROLE BADGE ---------- */
      .role-badge {
        display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
        padding: 7px 12px; border-radius: 8px; margin: 0 16px 10px;
      }
      .role-badge-guest { background: var(--amber-bg); color: var(--amber); }
      .role-badge-admin { background: var(--green-bg); color: var(--green); }

      .logout-btn {
        display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
        font-family: 'Tajawal'; font-weight: 700; font-size: 11.5px; color: var(--ink-soft); padding: 6px 2px; margin-top: 6px;
      }
      .logout-btn:hover { color: var(--red); }

      /* ---------- ALERT BANNER ---------- */
      .alert-banner {
        display: flex; align-items: center; gap: 10px; background: var(--amber-bg); color: var(--amber);
        border: 1px solid var(--amber); border-radius: 10px; padding: 11px 14px; margin-bottom: 16px; font-size: 12.5px;
      }
      .alert-banner-text { flex: 1; line-height: 1.7; }
      .alert-banner-btn { flex-shrink: 0; }
      .alert-banner-expiry { background: var(--red-bg); color: var(--red); border-color: var(--red); }

      /* ---------- CHARTS ---------- */
      .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
      .mini-chart { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
      .mini-chart-row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; }
      .mini-chart-label { font-size: 11.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mini-chart-track { background: var(--kraft); border-radius: 6px; height: 10px; overflow: hidden; }
      .mini-chart-bar { background: var(--navy); height: 100%; border-radius: 6px; transition: width 0.3s ease; }
      .mini-chart-bar-amber { background: var(--amber); }
      .mini-chart-val { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-align: left; }
      .mini-chart-pct { color: var(--ink-soft); font-size: 10.5px; }

      /* ---------- INVENTORY GRID CARDS ---------- */
      .location-select { max-width: 180px; }
      .view-toggle { display: flex; gap: 4px; }
      .page-check-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .page-check-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }

      /* ---------- EMOJI PICKER ---------- */
      .emoji-picker-wrap { position: relative; }
      .emoji-trigger {
        display: flex; align-items: center; gap: 8px; width: 100%; background: var(--surface); border: 1px solid var(--line);
        border-radius: 8px; padding: 9px 12px; font-family: 'Tajawal'; font-size: 13px; color: var(--ink); cursor: pointer;
      }
      .emoji-trigger-glyph { font-size: 18px; }
      .emoji-popover {
        position: absolute; z-index: 40; top: calc(100% + 6px); right: 0; left: 0; background: var(--surface); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px; box-shadow: 0 10px 28px rgba(var(--shadow-color),0.18);
      }
      .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 8px; }
      .emoji-cell { font-size: 18px; background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px; cursor: pointer; }
      .emoji-cell:hover { background: var(--kraft); }
      .emoji-cell-active { border-color: var(--navy); background: var(--kraft); }
      .emoji-custom-row { display: flex; gap: 6px; }
      .inv-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 16px; }
      .inv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
      .inv-card-photo { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 2px; }
      .row-thumb { width: 26px; height: 26px; object-fit: cover; border-radius: 5px; vertical-align: middle; margin-left: 6px; }
      .inv-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .inv-card-head .cell-strong { font-size: 15px; }
      .inv-card-loc { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; }
      .inv-card-balance { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 6px; }
      .inv-card-balance-unit { font-family: 'Tajawal'; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
      .inv-card-box-btn { margin-top: 4px; width: 100%; justify-content: center; }

      /* بطاقة "كتاب" — خلفية بلون جلدي/خشبي تحاكي غلاف كتاب بدل البطاقة
         العادية، تُطبّق تلقائياً على أي صنف من مجموعة كتب/مكتبة أو باسم
         يحتوي كلمة "كتاب" — مجرد تمييز بصري، بدون أي تغيير بالبيانات */
      .inv-card-book, .item-card-book {
        background: linear-gradient(155deg, #6b4327 0%, #8a5a33 45%, #5a3720 100%);
        border: 1px solid #402a17;
        color: #f4e9d8;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(244,233,216,0.08);
      }
      .inv-card-book::before, .item-card-book::before {
        content: "";
        position: absolute;
        inset-inline-start: 0; top: 0; bottom: 0;
        width: 10px;
        background: linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.05));
        box-shadow: 2px 0 4px rgba(0,0,0,0.25);
      }
      .inv-card-book::after, .item-card-book::after {
        content: "📖";
        position: absolute;
        left: -14px; bottom: -18px;
        font-size: 72px;
        opacity: 0.16;
        transform: rotate(-8deg);
        pointer-events: none;
      }
      .inv-card-book .inv-card-loc, .item-card-book .cell-muted { color: #e4d3ba !important; }
      .inv-card-book .inv-card-balance-unit { color: #e4d3ba; }
      .inv-card-book .cell-strong, .item-card-book .cell-strong { color: #f4e9d8; }

      /* بطاقات المواد — كل مجموعة تاخذ شكل بطاقة يحاكي مادتها الحقيقية بدل
         الشكل العادي الموحّد، بنفس فكرة بطاقة "غلاف الكتاب" أعلاه. كل الأشكال
         التالية مجرد تمييز بصري ولا تُغيّر أي بيانات. */

      /* بلاستيك — قنينة شفافة بلمعة زجاجية */
      .inv-card-plastic {
        background: linear-gradient(155deg, #0b6e77 0%, #12959f 45%, #085158 100%);
        border: 1px solid #063e44;
        color: #eafcfb;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(234,252,251,0.10);
      }
      .inv-card-plastic::before {
        content: "";
        position: absolute;
        inset-inline-start: 22%; top: -20%; bottom: -20%;
        width: 26%;
        background: linear-gradient(rgba(255,255,255,0.22), rgba(255,255,255,0.02));
        transform: rotate(9deg);
        pointer-events: none;
      }
      .inv-card-plastic::after {
        content: "🧴";
        position: absolute;
        left: -10px; bottom: -20px;
        font-size: 70px;
        opacity: 0.16;
        transform: rotate(-6deg);
        pointer-events: none;
      }
      .inv-card-plastic .inv-card-loc, .inv-card-plastic .cell-muted { color: #c9f1ee !important; }
      .inv-card-plastic .inv-card-balance-unit { color: #c9f1ee; }
      .inv-card-plastic .cell-strong { color: #f2fffd; }

      /* صحون وأدوات مائدة — طبق خزفي بحافة ذهبية */
      .inv-card-dishes {
        background: radial-gradient(circle at 32% 24%, #FFFDF8 0%, #F3ECE0 72%);
        border: 1px solid #d8c9a8;
        color: var(--ink);
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 0 3px rgba(201,162,39,0.30), inset 0 0 0 5px rgba(201,162,39,0.10);
      }
      .inv-card-dishes::after {
        content: "🍽️";
        position: absolute;
        left: -8px; bottom: -20px;
        font-size: 64px;
        opacity: 0.13;
        transform: rotate(-4deg);
        pointer-events: none;
      }
      .inv-card-dishes .inv-card-loc { color: var(--ink-soft) !important; }

      /* ورقيات — صفحة دفتر مسطّرة بحاشية حمراء وطية زاوية */
      .inv-card-paper {
        background:
          repeating-linear-gradient(180deg, transparent 0 27px, rgba(43,59,71,0.08) 27px 28px),
          #FAF6EC;
        border: 1px solid var(--line);
        border-inline-start: 3px solid #B23A2E;
        color: var(--ink);
        position: relative;
        overflow: hidden;
      }
      .inv-card-paper::after {
        content: "";
        position: absolute;
        top: 0; inset-inline-end: 0;
        width: 0; height: 0;
        border-style: solid;
        border-width: 0 18px 18px 0;
        border-color: transparent var(--kraft-deep) transparent transparent;
        opacity: 0.9;
      }
      .inv-card-paper .inv-card-loc { color: var(--ink-soft) !important; }

      /* منظفات — فقاعات صابون منعشة */
      .inv-card-cleaning {
        background:
          radial-gradient(circle at 18% 30%, rgba(255,255,255,0.55) 0 10px, transparent 11px),
          radial-gradient(circle at 78% 18%, rgba(255,255,255,0.40) 0 6px, transparent 7px),
          radial-gradient(circle at 65% 62%, rgba(255,255,255,0.35) 0 14px, transparent 15px),
          radial-gradient(circle at 30% 78%, rgba(255,255,255,0.45) 0 8px, transparent 9px),
          linear-gradient(155deg, #1f9fae 0%, #6fd9c8 100%);
        border: 1px solid #16636e;
        color: #ffffff;
        position: relative;
        overflow: hidden;
      }
      .inv-card-cleaning::after {
        content: "🧼";
        position: absolute;
        left: -8px; bottom: -18px;
        font-size: 62px;
        opacity: 0.18;
        transform: rotate(-8deg);
        pointer-events: none;
      }
      .inv-card-cleaning .inv-card-loc, .inv-card-cleaning .cell-muted { color: #eafffb !important; }
      .inv-card-cleaning .inv-card-balance-unit { color: #eafffb; }
      .inv-card-cleaning .cell-strong { color: #ffffff; }

      /* ماء — قطرات وموجة هادئة */
      .inv-card-water {
        background: linear-gradient(180deg, #EAF6FB 0%, #CFEAF5 60%, #A9D9EA 100%);
        border: 1px solid #8FC3D8;
        color: #0B3B4A;
        position: relative;
        overflow: hidden;
      }
      .inv-card-water::after {
        content: "💧";
        position: absolute;
        left: -6px; bottom: -16px;
        font-size: 60px;
        opacity: 0.20;
        pointer-events: none;
      }
