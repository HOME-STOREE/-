<script>

tailwind.config = {
    theme: {
    extend: {
      colors: {
        ink: { DEFAULT: '#7A5C4F', soft: '#968374' },   // النصوص والعناوين
        line: '#75685A',                                 // الحدود والعناصر الداكنة
        page: { DEFAULT: '#F1EFE9', alt: '#DFDFDF' },    // خلفية الصفحة
        card: '#FDFDFD',                                 // خلفية البطاقات
        cardline: '#EFECE6',                             // حدود البطاقات
        hover: '#FAF9F6',                                // التمرير / التمييز الخفيف
        ok: '#4F7A56',
        warn: '#B7791F',
        bad: '#A4483F',
      },
      fontFamily: {
        sans: ['Cairo', 'Tajawal', '"IBM Plex Sans Arabic"', 'system-ui', 'sans-serif'],
      },
      keyframes: {
        drawerIn: { '0%': { transform: 'translateX(-28px)', opacity: 0 }, '100%': { transform: 'translateX(0)', opacity: 1 } },
        popIn: { '0%': { transform: 'scale(.97)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
        toastIn: { '0%': { transform: 'translateY(8px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
      },
      animation: {
        drawer: 'drawerIn .22s ease-out',
        pop: 'popIn .16s ease-out',
        toast: 'toastIn .2s ease-out',
      },
    },
  },
  plugins: [],
}

<style type="text/tailwindcss">

@layer base {
  html { font-family: 'Cairo', 'Tajawal', 'IBM Plex Sans Arabic', system-ui, sans-serif; }
  body { @apply bg-page text-ink antialiased; }
  h1, h2, h3, h4 { @apply text-ink font-bold; }
  :focus-visible { outline: 2px solid #75685A; outline-offset: 2px; }
  ::selection { background: #DFD3C6; }
}

@layer components {
  .card { @apply bg-card border border-cardline rounded-2xl; }
  .card-pad { @apply p-4 sm:p-5; }

  .btn { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed select-none; }
  .btn-primary { @apply btn bg-line text-white hover:bg-ink; }
  .btn-outline { @apply btn border border-line/50 text-ink bg-card hover:bg-hover; }
  .btn-ghost { @apply btn text-ink hover:bg-hover; }
  .btn-danger { @apply btn bg-bad text-white hover:opacity-90; }
  .btn-sm { @apply px-3 py-1.5 text-xs; }

  .input { @apply w-full rounded-xl border border-cardline bg-white px-3 py-2 text-sm text-ink placeholder:text-ink-soft/70 focus:border-line focus:ring-0 outline-none transition-colors disabled:bg-hover disabled:text-ink-soft; }
  .label { @apply block text-xs font-semibold text-ink mb-1.5; }

  .badge { @apply inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold border; }
  .badge-neutral { @apply badge bg-hover text-ink border-cardline; }
  .badge-brand { @apply badge bg-line text-white border-line; }
  .badge-ok { @apply badge bg-ok/10 text-ok border-ok/25; }
